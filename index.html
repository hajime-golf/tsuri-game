// 下の画面で使う写真を読み込む（読めなかったときは、図形の絵で続ける）
// 魚データで "photo": false の魚は、まだ絵がないので読みに行かない（仮の絵を描く）
function preloadFishPhotos(scene) {
  for (const fish of window.fishData.fish) {
    if (fish.photo === false) continue;
    const key = `fish-${fish.id}`;
    if (!scene.textures.exists(key)) scene.load.image(key, `images/${key}.webp`);
  }
}
function preloadDishPhotos(scene, fish) {
  for (const dish of fish.dishes || []) {
    const key = `dish-${fish.id}-${dish.id}`;
    if (dish.image && !scene.textures.exists(key)) scene.load.image(key, dish.image);
  }
}
// 絵がない料理は、仮の絵を描いておく
function bakeDishStandIns(scene, fish) {
  for (const dish of fish.dishes || []) {
    if (!dish.image) bake(scene, `dish-${fish.id}-${dish.id}`, 390, 390, (ctx, w, h) => paintStandInDish(ctx, w, h, fish, dish));
  }
}

// 文章の窓（読むものは画面に重ねたHTMLで出す。スクロールと選択ができる）
function showSheet(title, blocks) {
  const sheet = document.getElementById('sheet');
  sheet.textContent = '';
  const box = document.createElement('div');
  box.className = 'sheet-box';
  const h = document.createElement('h2');
  h.textContent = title;
  box.appendChild(h);
  for (const block of blocks) {
    if (block.heading) {
      const el = document.createElement('h3');
      el.textContent = block.heading;
      box.appendChild(el);
    }
    if (block.text) {
      const el = document.createElement('p');
      el.textContent = block.text;
      box.appendChild(el);
    }
    if (block.list || block.steps) {
      const el = document.createElement(block.steps ? 'ol' : 'ul');
      for (const item of block.list || block.steps) {
        const li = document.createElement('li');
        li.textContent = item;
        el.appendChild(li);
      }
      box.appendChild(el);
    }
    if (block.source) {
      const el = document.createElement('p');
      el.className = 'sheet-source';
      el.textContent = '出典：';
      const a = document.createElement('a');
      a.href = block.source.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = block.source.name;
      el.appendChild(a);
      box.appendChild(el);
    }
  }
  const close = document.createElement('button');
  close.textContent = 'とじる';
  close.addEventListener('click', () => { sheet.style.display = 'none'; });
  box.appendChild(close);
  sheet.appendChild(box);
  sheet.style.display = 'block';
  sheet.scrollTop = 0;
}

function recipeSheet(fish, dish) {
  const s = window.fishData.sources;
  if (!dish.recipe) {
    showSheet(`${dish.name}を実際に作るなら`, [
      { text: 'この料理は、作り方を確かめられる出典がまだ見つかっていません。まちがった手順を伝えないよう、準備中にしています。' },
    ]);
    return;
  }
  const r = dish.recipe;
  const blocks = [
    { heading: `材料（${r.serves}）`, list: r.ingredients },
    { heading: '作り方', steps: r.steps },
  ];
  if (r.note) blocks.push({ text: r.note });
  if (!dish.raw) blocks.push({ text: '魚の中まで火を通してね。' });
  blocks.push({ source: s[r.source] });
  showSheet(`${dish.name}を実際に作るなら`, blocks);
}

/* ---------- 図鑑と冷蔵庫の画面（読むものなので、画面に重ねたHTMLで出す） ---------- */

function makeEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function openPanel(title) {
  const sheet = document.getElementById('sheet');
  sheet.textContent = '';
  const box = makeEl('div', 'sheet-box');
  box.appendChild(makeEl('h2', '', title));
  sheet.appendChild(box);
  sheet.style.display = 'block';
  sheet.scrollTop = 0;
  return box;
}

function closePanel() { document.getElementById('sheet').style.display = 'none'; }

function panelButton(box, label, onClick) {
  const button = makeEl('button', '', label);
  button.addEventListener('click', onClick);
  box.appendChild(button);
  return button;
}

function fishImage(fishId, className) {
  const img = makeEl('img', className);
  const fish = fishById(fishId);
  img.src = fish && fish.photo === false ? standInUrl(fishId) : `images/fish-${fishId}.webp`;
  img.alt = '';
  return img;
}

function stampRow(entry, fish) {
  const row = makeEl('div', 'stamps');
  for (const [key, label] of [['caught', '釣れた'], ['cooked', '料理した'], ['eaten', '食べた']]) {
    if (fish && !Book.kinds(fish).includes(key)) continue;
    row.appendChild(makeEl('span', entry[key] > 0 ? 'stamp on' : 'stamp', label));
  }
  if (isNoEat(fish)) row.appendChild(makeEl('span', 'stamp', '食べない魚'));
  if (isLicensed(fish)) row.appendChild(makeEl('span', 'stamp', '店でさばく'));
  return row;
}

function fishById(id) { return window.fishData.fish.find((f) => f.id === id); }

function howToSheet() {

    { text: 'フグは自分でさばけないので、お金を払って店にさばいてもらうよ。毒のトゲがある魚は、さばく前にトゲを取ろう。食べない魚もいるよ。' },

function mannersSheet(onClose) {

// 釣り大会の案内
function contestPanel(onEnter, onClose) {
  const box = openPanel('釣り大会');
  const kind = Contest.available();
  const k = (id) => CONTEST_KINDS[id];
  if (kind) {
    box.appendChild(makeEl('p', 'card-name', `次の釣りは「${k(kind).name}」の日！`));
  } else {
    const s = Contest.tripsUntil('small'), b = Contest.tripsUntil('big');
    box.appendChild(makeEl('p', '', `次の小さな大会：あと${s}回の釣りのあと。　次の大潮の大会：あと${b}回の釣りのあと。`));
  }
  box.appendChild(makeEl('h3', '', '大会のルール'));
  const rules = makeEl('ul');
  for (const t of [
    `いつもの釣りの準備（釣り場・道具）で出るよ。小さな大会は${k('small').casts}投、大潮の大会は${k('big').casts}投まで。`,
    `釣れた魚は「キープ」か「リリース」を選ぶ。キープできるのは${CONTEST_KEEP}匹まで。キープした魚は、あとから帰せない。`,
    'キープした魚の重さの合計で「重さの賞」、いちばん大きい1匹で「大きさの賞」が決まる。',
    `ライバルの釣果は、${k('small').reveal}投目（大潮の大会は${k('big').reveal}投目）まで見える。そこから先は見えない。`,
    'キープした魚は、大会のあと冷蔵庫に入るよ。',
  ]) rules.appendChild(makeEl('li', '', t));
  box.appendChild(rules);
  const p = (id) => k(id).prizes.filter((x) => x > 0).map((x, i) => `${i + 1}位 ${x}D`).join('、');
  box.appendChild(makeEl('p', 'sheet-note', `賞金（それぞれの賞で）　小さな大会：${p('small')}　大潮の大会：${p('big')}`));
  box.appendChild(makeEl('p', 'sheet-note', '大会の日、賞金、ライバルはゲームのものです。大潮の日はゲームのカレンダーで決めていて、現実の潮ごよみとは違います。'));
  if (kind) panelButton(box, `${k(kind).name}に出る`, () => { closePanel(); onEnter(kind); });
  panelButton(box, 'とじる', () => { closePanel(); if (onClose) onClose(); });
}

// 大会の結果
function contestResultPanel(c, res, total, quit, onDone) {
  const box = openPanel(`${c.def.name}の結果`);
  if (quit) {
    box.appendChild(makeEl('p', '', '棄権したので、賞はなし。キープした魚は冷蔵庫に入れたよ。'));
  } else {
    const kg = (g) => `${(g / 1000).toFixed(2)}kg`;
    for (const [heading, list, fmt] of [['重さの賞（キープした魚の合計）', res.weight, kg], ['大きさの賞（いちばん大きい1匹）', res.size, (v) => `${v.toFixed(1)}cm`]]) {
      box.appendChild(makeEl('h3', '', heading));
      const ol = makeEl('ol');
      for (const p of list) {
        const li = makeEl('li', p.me ? 'card-name' : '', `${p.name}　${p.value > 0 ? fmt(p.value) : '記録なし'}${p.prize ? `　賞金 ${p.prize}D` : ''}`);
        ol.appendChild(li);
      }
      box.appendChild(ol);
    }
    box.appendChild(makeEl('p', 'card-name', total ? `賞金 合計 +${total}D！` : '今回は賞金なし。次はがんばろう！'));
    if (c.kept.length) box.appendChild(makeEl('p', '', 'キープした魚は冷蔵庫に入れたよ。'));
  }
  box.appendChild(makeEl('p', 'sheet-note', '大会と賞金はゲームのものです。'));
  panelButton(box, '港へもどる', () => { closePanel(); onDone(); });
}

// 図鑑から「この魚を実際に釣るには」
function realSheet(fish, onBack) {
  const box = openPanel(`${fish.name}を実際に釣るには`);
  const real = fish.real || {};
  factBlock(box, '時期', fish.facts.season);
  factBlock(box, '必要な道具', real.gear);
  box.appendChild(makeEl('h3', '', '予算の目安'));
  const spot = Trip.gear('spots').find((s) => s.id === fish.game.spots[0]);
  const budget = spot && spot.budget;
  if (budget && budget.status === '確認済み') {
    box.appendChild(makeEl('p', '', `参考（${spot.name}）：${budget.value}　ほかの道具の値段は、資料で確かめられていません。`));
    sourceLine(box, budget.sources);
  } else {
    box.appendChild(makeEl('p', '', (budget && budget.value) || '予算は、まだ資料で確かめているところです。'));

function chipRow(box, items, selectedId, onPick) {

// 魚ごとの来やすさを、記号で見せる
function outlookMark(rate) {
  if (rate >= 1.4) return '◎';
  if (rate >= 0.5) return '○';
  return '△';
}

// 釣りの準備
function tripPanel(onClose) {
  const box = openPanel('釣りの準備');
  const trip = Trip.current();
  const season = Trip.seasonIndex();
  const redraw = () => {
    const sheet = document.getElementById('sheet');
    const top = sheet.scrollTop;
    tripPanel(onClose);
    sheet.scrollTop = top;
  };
  const choose = (kind) => (id) => { Trip.choose(kind, id); redraw(); };

  box.appendChild(makeEl('p', '', `今の季節は${SEASON_NAMES[season]}。あと${Trip.tripsLeft()}回の釣りで${SEASON_NAMES[(season + 1) % 4]}になるよ。`));

  box.appendChild(makeEl('h3', '', '釣り場'));

  chipRow(box, spots, trip.spot.id, choose('spot'));
  tipBlock(box, trip.spot.note);
  for (const s of Trip.gear('spots')) {

  box.appendChild(makeEl('h3', '', '時間帯'));
  chipRow(box, Trip.gear('times'), trip.time.id, choose('time'));
  tipBlock(box, trip.time.note);

  box.appendChild(makeEl('h3', '', '仕掛け'));
  chipRow(box, Trip.gear('methods').filter((m) => m.spots.includes(trip.spot.id)), trip.method.id, choose('method'));
  tipBlock(box, trip.method.note);

  box.appendChild(makeEl('h3', '', 'エサ'));
  chipRow(box, Trip.gear('baits').filter((b) => trip.method.baits.includes(b.id)), trip.bait.id, choose('bait'));

  else if (info.rawOk) status = `釣ってから${info.days}日。あと${info.left}日で腐る。生の料理はあと${RULES.rawDays - info.days}日`;
  else status = `釣ってから${info.days}日。あと${info.left}日で腐る。もう生では使えない`;

  row.appendChild(body);

}

function wrapJapanese(text, size, width) {
  const noStart = '、。）」』！？・ー…';
  const lines = [];
  for (const para of text.split('\n')) {
    let line = '', used = 0;
    for (const ch of para) {
      const w = ch.charCodeAt(0) < 128 ? size * 0.55 : size;
      if (used + w > width && line && !noStart.includes(ch)) {
        lines.push(line);
        line = '';
        used = 0;
      }
      line += ch;
      used += w;
    }
    lines.push(line);
  }
  return lines.join('\n');
}

function bodyText(scene, x, y, rawText, size, opts = {}) {
  const text = rawText ? wrapJapanese(rawText, size, opts.width || W - 80) : '';
  return scene.add.text(x, y, text, {
    fontFamily: FONT_BODY, fontSize: `${size}px`, color: opts.color || COLOR.cream, align: opts.align || 'center',
    lineSpacing: opts.lineSpacing === undefined ? 10 : opts.lineSpacing,
  }).setOrigin(opts.originX === undefined ? 0.5 : opts.originX, opts.originY === undefined ? 0 : opts.originY)
    .setDepth(opts.depth || 30).setShadow(0, 2, 'rgba(10,8,8,0.75)', 8);
}

function titleText(scene, y, text) {
  return scene.add.text(W / 2, y, text, {
    fontFamily: FONT_TITLE, fontSize: '68px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
  }).setOrigin(0.5).setDepth(30).setShadow(0, 3, 'rgba(10,8,8,0.75)', 12);
}

// クーラーボックスの中の氷（大きなかけらが、すき間なく並ぶ）
function paintIce(ctx, w, h) {
  const size = 15;
  paintPixels(ctx, w, h, (x, y, o) => {
    const gx = Math.floor(x / size), gy = Math.floor(y / size);
    let d1 = 1e9, d2 = 1e9, id = 0;
    for (let j = -1; j <= 1; j++) {
      for (let i = -1; i <= 1; i++) {
        const cx = (gx + i + hash2(gx + i, gy + j)) * size;
        const cy = (gy + j + hash2(gy + j, gx + i + 7)) * size;
        const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
        if (d < d1) { d2 = d1; d1 = d; id = hash2(gx + i + 3, gy + j + 5); } else if (d < d2) d2 = d;
      }
    }
    const crack = sstep(0, 3, Math.sqrt(d2) - Math.sqrt(d1));
    const cloud = fbm(x * 0.012, y * 0.012, 3);
    const v = lerp(0.8, 1, id) * lerp(0.74, 1.08, cloud) * lerp(0.84, 1, crack);
    const shine = id > 0.9 ? 30 : 0;
    o[0] = 196 * v + 34 + shine; o[1] = 218 * v + 30 + shine; o[2] = 232 * v + 22 + shine;
  });
}

// まな板
function paintBoard(ctx, w, h) {
  paintPixels(ctx, w, h, (x, y, o) => {
    const warp = fbm(x * 0.005, y * 0.03, 3);
    const ring = Math.sin(y * 0.14 + warp * 20) * 0.5 + 0.5;
    const fine = fbm(x * 0.03, y * 0.4, 3);
    const c = lerp3([214, 178, 132], [232, 202, 160], clamp01(ring * 0.28 + fine * 0.62 + 0.08));
    const dx = (x / w - 0.5) * 1.3, dy = (y / h - 0.5) * 1.5;
    const lamp = 1.08 - sstep(0.2, 1, Math.sqrt(dx * dx + dy * dy)) * 0.5;
    o[0] = c[0] * lamp; o[1] = c[1] * lamp; o[2] = c[2] * lamp;
  });
}

function bakeFull(scene, key, paint) {
  bake(scene, key, Math.round(W / 2), Math.round(H / 2), paint);
  return scene.add.image(0, 0, key).setOrigin(0).setDisplaySize(W, H).setDepth(0);
}

// 鮮度のゲージ
function drawMeter(g, x, y, width, value, color) {
  g.clear();
  g.fillStyle(0x10202e, 0.65);
  g.fillRoundedRect(x, y, width, 24, 12);
  g.fillStyle(color, 1);
  g.fillRoundedRect(x + 3, y + 3, Math.max(18, (width - 6) * value), 18, 9);
}

class CoolerScene extends Phaser.Scene {
  constructor() { super('Cooler'); }

  init(data) {
    this.catchData = data;
    this.fresh = 0.45;
    this.leaving = false;
  }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
    bakeFull(this, 'ice', paintIce);
    this.add.rectangle(0, 0, W, H, 0x16304a, 0.42).setOrigin(0).setDepth(1);

    const fish = this.catchData.fish;
    titleText(this, H * 0.075, 'クーラーに入れる');
    const art = this.add.image(W / 2, H * 0.245, `fish-${fish.id}`).setScale(0.82).setDepth(10);
    this.art = art;

    bodyText(this, W / 2, H * 0.378, `鮮度`, 30);
    this.meter = this.add.graphics().setDepth(30);
    this.meterBox = { x: 150, y: H * 0.378 + 46, w: W - 300 };
    drawMeter(this.meter, this.meterBox.x, this.meterBox.y, this.meterBox.w, this.fresh, 0x7fe0c0);

    const y1 = Math.round(H * 0.5);
    this.addAction(y1, '氷締めする', 0.3, '氷水で一気に冷やした！');
    this.addAction(y1 + 120, '血抜きする', 0.25, 'きれいに血を抜いた！');

    this.say = bodyText(this, W / 2, y1 + 188, '', 32, { color: '#ffe0a6' });

    const noteY = y1 + 248;
    bodyText(this, W / 2, noteY,
      '「鮮度」はこのゲームの数字だよ。\n実際の魚も常温に置かず、すぐ冷やそう。\nヒスタミンという食中毒の原因は、火を通しても消えません。',
      25, { lineSpacing: 8, width: 750 });

    createSmallButton(this, W / 2 - 185, H - 92, isLicensed(fish) ? '店に頼む' : '家で料理する', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Cook', { ...this.catchData, fresh: this.fresh });
    });
    createSmallButton(this, W / 2 + 185, H - 92, '冷蔵庫にしまう', () => {
      if (this.leaving) return;
      this.leaving = true;
      Keep.add({ ...this.catchData, fresh: this.fresh });
      changeScene(this, 'Harbor');
    });

    rewardToast(this, this.catchData.bookNotes);
  }

  addAction(y, label, gain, message) {
    const button = createButton(this, W / 2, y, label, () => {
      if (button.used) return;
      button.used = true;
      button.setAlpha(0.45);
      this.fresh = Math.min(1, this.fresh + gain);
      drawMeter(this.meter, this.meterBox.x, this.meterBox.y, this.meterBox.w, this.fresh, 0x7fe0c0);
      this.say.setText(message);
      Buzz.pulse(30);
      if (!REDUCE_MOTION) {
        this.tweens.add({ targets: this.art, angle: 3, duration: 70, yoyo: true, repeat: 3 });
      }
    }, 42);
    return button;
  }
}

// 魚の絵のどこに何があるか（絵の幅に対する割合）。さばく画面の線の場所に使う
const PREP_ART = {
  aji: { gill: 0.25, viewGill: 0.19, half: 100 },
  saba: { gill: 0.24, viewGill: 0.19, half: 100 },
  kasago: { gill: 0.35, viewGill: 0.27, half: 130 },
  onikasago: { gill: 0.29, viewGill: 0.29, half: 138 },   // 毒トゲの場所もこの数字で決まる
  madai: { gill: 0.24, viewGill: 0.24, half: 120 },
  buri: { gill: 0.26, viewGill: 0.26, half: 85 },
  hirame: { gill: 0.22, viewGill: 0.22, half: 120 },
  suzuki: { gill: 0.26, viewGill: 0.26, half: 80 },
  isaki: { gill: 0.25, viewGill: 0.25, half: 110 },
  yamame: { gill: 0.23, viewGill: 0.23, half: 80 },
  nijimasu: { gill: 0.22, viewGill: 0.22, half: 75 },
  ayu: { gill: 0.19, viewGill: 0.19, half: 75 },
  amadai: { gill: 0.23, viewGill: 0.23, half: 85 },
  kurodai: { gill: 0.24, viewGill: 0.24, half: 110 },
  kisu: { gill: 0.23, viewGill: 0.23, half: 60 },
  karei: { gill: 0.2, viewGill: 0.2, half: 140 },   // 頭が右の絵。割合は頭の側から数える
  aoriika: { gill: 0.45, viewGill: 0.45, half: 110 },   // 足が左、胴が右
};

// 料理ごとのさばき方。順番に進める
function prepPlan(dish, fish) {
  const plans = {
    whole: ['scale', 'guts'],
    hiraki: ['scale', 'head', 'hiraki'],
    nimai: ['scale', 'head', 'belly', 'back2'],
    sanmai: ['scale', 'head', 'belly', 'back', 'belly2', 'back2'],
    gomai: ['scale', 'head', 'belly', 'back', 'belly2', 'back2'],   // カレイ・ヒラメ
    squid: ['squidOpen', 'squidGuts', 'squidSkin'],                // イカ
  };
  const plan = plans[dish.prep].slice();
  // 刺身は皮を引く（皮をあぶる・湯をかける料理と、イカは引かない）
  if (dish.raw && !dish.noSkin && dish.prep !== 'squid') plan.push('skin');
  if (hasPoison(fish)) plan.unshift('poison');   // 毒のある魚は、最初に毒のトゲを取る
  return plan;
}

class PrepScene extends Phaser.Scene {
  constructor() { super('Prep'); }

  init(data) {
    this.catchData = data;
    this.fish = data.fish;
    this.dish = data.dish;
    this.plan = prepPlan(this.dish, this.fish);
    this.planIndex = -1;
    this.step = '';
    this.scores = [];
    this.leaving = false;
    this.view = 'side';       // いま見えている魚の面（side / belly / back）
    this.headOff = false;
  }

  preload() {
    const path = this.dish.prepImage;
    if (path && !this.textures.exists(path)) this.load.image(path, path);
    const add = (key) => {
      // 絵がまだない魚と、背中・おなかの絵がない魚（"views": false）は読みに行かない（横向きの絵のまま進める）
      if (this.fish.photo === false || this.fish.views === false) return;
      if (!this.textures.exists(key)) this.load.image(key, `images/${key}.webp`);
    };
    add(`view-${this.fish.id}-back`);
    add(`view-${this.fish.id}-belly`);
    if (this.dish.raw) {
      add(`skin-${this.fish.id}-before`);
      add(`skin-${this.fish.id}-after`);
    }
  }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
    bakeFull(this, 'board', paintBoard);

    this.fishW = 720;
    this.fishScale = this.fishW / FISH_BAKE.w;
    this.fishX = W / 2;
    this.fishY = Math.round(H * 0.44);
    this.left = this.fishX - this.fishW / 2;
    this.art = PREP_ART[this.fish.id] || PREP_ART.aji;
    this.bandTop = this.fishY - this.art.half - 40;
    this.bandBottom = this.fishY + this.art.half + 40;

    this.body = this.add.image(this.fishX, this.fishY, `fish-${this.fish.id}`).setScale(this.fishScale).setDepth(5);

    const dark = '#3b2412';
    this.heading = titleText(this, H * 0.08, '').setColor(dark).setShadow(0, 1, 'rgba(255,240,210,0.7)', 3);
    this.hint = bodyText(this, W / 2, H * 0.13, '', 32, { color: dark }).setShadow(0, 1, 'rgba(255,240,210,0.7)', 3);
    this.progress = this.add.graphics().setDepth(30);

    const cautions = this.fish.safety.cautions.value || [];
    if ((this.fish.id === 'kasago' || hasPoison(this.fish)) && cautions.length) {
      bodyText(this, W / 2, H * 0.68, cautions[0], 28, { color: '#7a1f10' }).setShadow(0, 1, 'rgba(255,240,210,0.7)', 3);
    }

    this.guide = this.add.graphics().setDepth(20);
    this.trail = this.add.graphics().setDepth(21);
    this.input.on('pointerdown', (p) => this.onDown(p));
    this.input.on('pointermove', (p) => this.onMove(p));
    this.input.on('pointerup', (p) => this.onUp(p));
    this.nextStep();
  }

  say(title, hint) {
    this.heading.setText(title);
    this.setHint(hint);
  }

  // ヒントは毎回折り返しを計算し直す
  setHint(text) {
    this.hint.setText(wrapJapanese(text, 32, W - 80));
  }

  nextStep() {
    this.planIndex++;
    this.trail.clear();
    this.guide.clear();
    this.progress.clear();
    const name = this.plan[this.planIndex];
    if (!name) { this.finishAll(); return; }
    this.step = name;
    const a = this.art;
    const gillX = this.left + this.fishW * a.gill;
    const endX = this.left + this.fishW * 0.88;
    switch (name) {
      case 'scale': this.startScale(); break;
      case 'head': this.startHead(); break;
      case 'guts':
        this.rollTo('belly', () => {
          this.say('内臓を取る', 'おなかの真ん中の線を、頭の方からなぞろう');
          this.traceSide(a.viewGill, 0.6);
        });
        break;
      case 'belly':
        this.rollTo('belly', () => {
          this.say(this.cutTitle(), 'おなかの真ん中から、赤い丸→尾へ刃を入れよう');
          this.traceSide(a.viewGill, 0.88);
        });
        break;
      case 'back':
      case 'back2':
        this.rollTo('back', () => {
          this.say(this.cutTitle(), '背びれに沿って、尾→頭へ刃を入れよう');
          this.traceSide(0.88, a.viewGill);
        });
        break;
      case 'belly2':
        this.rollTo('belly', () => {
          this.say(this.cutTitle(), '反対側も、おなかの真ん中から赤い丸→尾へ');
          this.traceSide(a.viewGill, 0.88);
        });
        break;
      case 'hiraki':
        this.rollTo('back', () => {
          this.say('背から開く', '背びれに沿って、赤い丸→尾へ切り開こう');
          this.traceSide(a.viewGill, 0.88);
        });
        break;
      case 'skin':
        this.say('皮を引く', '皮を上にして、頭の方から皮を引こう');
        this.showPhoto(`skin-${this.fish.id}-before`);
        this.startTrace(this.fishY, this.left + 70, this.left + this.fishW - 60);
        break;
      case 'poison': this.startPoison(); break;
      // イカ（Honda釣り図鑑のさばき方をもとにした流れ）
      case 'squidOpen':
        // 絵は足が左、胴が右（絵の割合 0.45 から右が胴）
        this.say('胴を開く', '胴の真ん中の線に、包丁を入れよう（左から右へ）');
        this.startTrace(this.fishY, this.left + this.fishW * 0.5, this.left + this.fishW * 0.93);
        break;
      case 'squidGuts':
        this.say('甲と内臓を取る', '透明な甲を取って、頭と足をつかみ、内臓ごと左へはがそう（墨袋を破らないように）');
        this.startTrace(this.fishY + 20, this.left + this.fishW * 0.5, this.left + this.fishW * 0.1);
        break;
      case 'squidSkin':
        this.say('皮をむく', 'エンペラをはがして、皮を少しずつむこう（左から右へ）');
        this.startTrace(this.fishY - 60, this.left + this.fishW * 0.5, this.left + this.fishW * 0.92);
        break;
      default: this.nextStep();
    }
  }

  cutTitle() {
    if (this.dish.prep === 'gomai') return '五枚におろす';
    return this.dish.prep === 'nimai' ? '二枚におろす' : '三枚におろす';
  }

  /* 毒のトゲを取る：赤い丸を順にタップして切り落とす（場所は Honda釣り図鑑のさばき方） */
  startPoison() {
    this.say('毒のトゲを取る', '料理の前に、赤い丸のトゲを順にタップして切り落とそう');
    const a = this.art;
    this.poisonMiss = 0;
    this.poisonTargets = [
      { x: this.left + this.fishW * a.gill, y: this.fishY - a.half * 0.55, label: 'エラブタの突起（裏側も）' },
      // オニカサゴの絵の、背ビレの1本目と2本目のトゲの先に合わせた場所
      { x: this.left + this.fishW * (a.gill + 0.055), y: this.fishY - a.half * 1.0, label: '背ビレの前のトゲの先' },
      { x: this.left + this.fishW * (a.gill + 0.115), y: this.fishY - a.half * 1.12, label: '背ビレの前のトゲの先' },
    ];
    this.drawPoison();
  }

  drawPoison() {
    const g = this.guide;
    g.clear();
    const next = this.poisonTargets[0];
    if (!next) return;
    for (const t of this.poisonTargets) {
      g.lineStyle(5, 0xd63a26, t === next ? 1 : 0.4);
      g.strokeCircle(t.x, t.y, t === next ? 34 : 24);
    }
    this.setHint(`${next.label}をタップ。トゲには素手でさわらないでね`);
  }

  tapPoison(p) {
    const next = this.poisonTargets && this.poisonTargets[0];
    if (!next) return;
    if (Math.hypot(p.x - next.x, p.y - next.y) > 70) {
      this.poisonMiss++;
      this.setHint('そこじゃないよ。光っている赤い丸をタップ');
      return;
    }
    this.poisonTargets.shift();
    Buzz.pulse(30);
    Sound.nibble();
    // 切り落とした印
    this.trail.lineStyle(6, 0xfff4d8, 0.95);
    this.trail.lineBetween(next.x - 16, next.y - 16, next.x + 16, next.y + 16);
    this.trail.lineBetween(next.x - 16, next.y + 16, next.x + 16, next.y - 16);
    if (this.poisonTargets.length) { this.drawPoison(); return; }
    this.guide.clear();
    this.finishStep(clamp01(1 - this.poisonMiss * 0.15));
  }

  // 頭からの割合を、絵の左はしからの割合に直す（カレイは頭が右の絵）
  fx(frac) {
    return this.fish.faceRight ? 1 - frac : frac;
  }

  xOf(frac) {
    return this.left + this.fishW * this.fx(frac);
  }

  // 真ん中の線をなぞる。from から to へ
  traceSide(from, to) {
    this.startTrace(this.fishY, this.xOf(from), this.xOf(to));
  }

  // 魚を転がして、おなか側や背中側を上にする
  rollTo(view, then) {
    this.step = '';
    const name = this.plan[this.planIndex];
    const apply = () => {
      const key = `view-${this.fish.id}-${view}`;
      if (!this.textures.exists(key)) return;
      this.body.setTexture(key).setAngle(0);
      if (this.headOff) {
        const split = this.art.viewGill * FISH_BAKE.w;
        this.body.setCrop(split, 0, FISH_BAKE.w - split, FISH_BAKE.h);
      } else {
        this.body.setCrop();
      }
    };
    const done = () => { this.view = view; this.step = name; then(); };
    if (this.view === view) { done(); return; }
    this.setHint(view === 'belly' ? 'あお向けにするよ' : '背中を上にするよ');
    if (REDUCE_MOTION) { apply(); done(); return; }
    const scale = this.fishScale;
    this.tweens.add({
      targets: this.body, scaleY: 0, duration: 220, ease: 'Sine.easeIn',
      onComplete: () => {
        apply();
        this.tweens.add({ targets: this.body, scaleY: scale, duration: 220, ease: 'Sine.easeOut', onComplete: done });
      },
    });
  }

  /* ウロコ取り：魚の上をまんべんなくこする */
  startScale() {
    this.say('ウロコを取る', '魚の上を、左右にこすろう');
    this.bins = new Array(14).fill(0);
    this.lastX = null;
    this.drawBins();
  }

  drawBins() {
    const g = this.progress;
    g.clear();
    const y = this.bandBottom + 26;
    const w = this.fishW / this.bins.length;
    this.bins.forEach((v, i) => {
      g.fillStyle(0x3b2412, 0.2);
      g.fillRect(this.left + i * w + 2, y, w - 4, 16);
      g.fillStyle(0xc2562e, 1);
      g.fillRect(this.left + i * w + 2, y, (w - 4) * Math.min(1, v), 16);
    });
  }

  rubScale(p) {
    if (p.y < this.bandTop || p.y > this.bandBottom) { this.lastX = null; return; }
    if (this.lastX !== null) {
      const d = Math.abs(p.x - this.lastX);
      const toBin = (x) => Math.floor(((x - this.left) / this.fishW) * this.bins.length);
      const from = Math.max(0, Math.min(toBin(p.x), toBin(this.lastX)));
      const to = Math.min(this.bins.length - 1, Math.max(toBin(p.x), toBin(this.lastX)));
      if (d > 0) for (let bin = from; bin <= to; bin++) this.bins[bin] += 0.2;
      if (d > 4 && Math.random() < 0.7 && !REDUCE_MOTION) this.flake(p.x, p.y);
    }
    this.lastX = p.x;
    this.drawBins();
    if (this.bins.every((v) => v >= 1)) {
      const worst = Math.max(...this.bins);
      this.finishStep(clamp01(1.2 - (worst - 1) * 0.1));
    }
  }

  flake(x, y) {
    const dot = this.add.ellipse(x, y, 10, 7, 0xeef2f0, 0.9).setDepth(22);
    this.tweens.add({
      targets: dot, x: x + randBetween(-70, 70), y: y - randBetween(30, 110), alpha: 0, angle: randBetween(-180, 180),
      duration: 460, ease: 'Cubic.easeOut', onComplete: () => dot.destroy(),
    });
  }

  /* 頭を落とす：エラの後ろの線を、上から下へ */
  startHead() {
    this.say('頭を落とす', '赤い線にそって、上から下へスッとなぞろう');
    this.cutX = this.xOf(this.art.gill);
    this.guide.lineStyle(5, 0xd63a26, 0.9);
    for (let y = this.bandTop; y < this.bandBottom; y += 26) this.guide.lineBetween(this.cutX, y, this.cutX, y + 15);
  }

  finishHead(score) {
    const key = `fish-${this.fish.id}`;
    const right = !!this.fish.faceRight;   // 頭が右の絵は、右側を頭として切り離す
    const split = this.fx(this.art.gill) * FISH_BAKE.w;
    const head = this.add.image(this.fishX, this.fishY, key).setScale(this.fishScale).setDepth(5);
    if (right) {
      head.setCrop(split, 0, FISH_BAKE.w - split, FISH_BAKE.h);
      this.body.setCrop(0, 0, split, FISH_BAKE.h);
    } else {
      head.setCrop(0, 0, split, FISH_BAKE.h);
      this.body.setCrop(split, 0, FISH_BAKE.w - split, FISH_BAKE.h);
    }
    this.headOff = true;
    Buzz.pulse(40);
    if (REDUCE_MOTION) head.setAlpha(0);
    else this.tweens.add({ targets: head, x: head.x + (right ? 90 : -90), y: head.y + 80, angle: right ? 14 : -14, alpha: 0, duration: 620, ease: 'Cubic.easeIn' });
    this.finishStep(score);
  }

  /* 線をなぞる工程（内臓、開く、おろす、皮を引く） */
  startTrace(y, x0, x1) {
    this.lineY = y;
    this.lineStart = x0;
    this.lineEnd = x1;
    this.traceAt = x0;
    this.traceDev = 0;
    this.traceCount = 0;
    this.traceDir = x1 >= x0 ? 1 : -1;
    const dir = this.traceDir;
    this.guide.lineStyle(5, 0xd63a26, 0.9);
    for (let x = x0; (x1 - x) * dir > 0; x += 26 * dir) this.guide.lineBetween(x, y, x + 15 * dir, y);
    // なぞり始める場所の印
    this.guide.fillStyle(0xd63a26, 1);
    this.guide.fillCircle(x0, y, 15);
  }

  traceLine(p) {
    const moved = (p.x - this.traceAt) * this.traceDir;
    if (moved <= 0 || moved > 90) return;
    if (Math.abs(p.y - this.lineY) > 90) return;
    this.trail.lineStyle(7, 0xfff4d8, 0.9);
    this.trail.lineBetween(this.traceAt, this.lineY, p.x, p.y);
    this.traceAt = p.x;
    this.traceDev += Math.abs(p.y - this.lineY);
    this.traceCount++;
    if ((this.traceAt - this.lineEnd) * this.traceDir >= 0) this.finishTrace();
  }

  finishTrace() {
    const score = clamp01(1.1 - (this.traceDev / Math.max(1, this.traceCount)) / 55);
    Buzz.pulse(40);
    if (['hiraki', 'back2'].includes(this.step)) this.showResult();
    if (this.step === 'skin') this.showPhoto(`skin-${this.fish.id}-after`);
    this.finishStep(score);
  }

  // さばいた後の写真に切りかえる
  showResult() {
    const path = this.dish.prepImage;
    if (path) this.showPhoto(path);
  }

  // まな板の写真に切りかえる（前の絵はふわっと消す）
  showPhoto(key) {
    if (!this.textures.exists(key)) return;
    const photo = this.add.image(W / 2, this.fishY, key);
    photo.setDepth(6 + (this.photoCount = (this.photoCount || 0) + 1) * 0.01).setDisplaySize(W, W * photo.height / photo.width);
    if (REDUCE_MOTION) {
      this.body.setAlpha(0);
    } else {
      photo.setAlpha(0);
      this.tweens.add({ targets: photo, alpha: 1, duration: 500 });
      this.tweens.add({ targets: this.body, alpha: 0, duration: 500 });
    }
  }

  finishStep(score) {
    this.scores.push(score);
    this.step = '';       // 次の工程が始まるまで操作を受けない
    Sound.caught();
    this.setHint(score >= 0.85 ? 'うまい！' : score >= 0.55 ? 'いいね！' : 'できた！');
    this.time.delayedCall(REDUCE_MOTION ? 400 : 850, () => this.nextStep());
  }

  finishAll() {
    const skill = this.scores.reduce((a, b) => a + b, 0) / this.scores.length;
    const dish = this.dish;
    this.say('さばけた！', `${dish.name}にしよう`);
    createButton(this, W / 2, H - 92, dish.raw ? '盛りつける' : '料理する', () => {
      if (this.leaving) return;
      this.leaving = true;
      Buzz.pulse(20);
      const veil = this.add.rectangle(0, 0, W, H, 0x120b07, 0.86).setOrigin(0).setDepth(60);
      const text = bodyText(this, W / 2, H * 0.46, `${dish.name}を作っています…`, 44, { depth: 61 });
      const bar = this.add.graphics().setDepth(61);
      const progress = { v: 0 };
      this.tweens.add({
        targets: progress, v: 1, duration: REDUCE_MOTION ? 300 : 1400,
        onUpdate: () => drawMeter(bar, 180, H * 0.54, W - 360, progress.v, 0xf0a860),
        onComplete: () => {
          veil.setAlpha(1);
          text.setAlpha(0);
          changeScene(this, 'Eat', { ...this.catchData, skill });
        },
      });
    }, 44);
  }

  onDown(p) {
    if (this.step === 'poison') { this.tapPoison(p); return; }
    if (this.step === 'scale') this.lastX = p.x;
    if (this.step === 'head') this.swipe = { x: p.x, y: p.y, sum: p.x, n: 1 };
    if (this.isTrace() && Math.abs(p.x - this.traceAt) > 90) this.setHint('赤い丸から、なぞり始めよう');
  }

  isTrace() {
    return ['guts', 'hiraki', 'belly', 'back', 'belly2', 'back2', 'skin', 'squidOpen', 'squidGuts', 'squidSkin'].includes(this.step) && this.lineEnd !== undefined;
  }

  onMove(p) {
    if (!p.isDown) return;
    if (this.step === 'scale') this.rubScale(p);
    else if (this.step === 'head' && this.swipe) {
      this.swipe.sum += p.x;
      this.swipe.n++;
      this.trail.lineStyle(7, 0xfff4d8, 0.85);
      this.trail.lineBetween(p.prevPosition.x, p.prevPosition.y, p.x, p.y);
    } else if (this.isTrace()) {
      this.traceLine(p);
    }
  }

  onUp(p) {
    if (this.step === 'scale') this.lastX = null;
    if (this.step === 'head' && this.swipe) {
      const s = this.swipe;
      this.swipe = null;
      const off = Math.abs(s.sum / s.n - this.cutX);
      if (p.y - s.y < this.art.half * 1.1 || off > 150) {
        this.trail.clear();
        this.setHint('赤い線にそって、上から下まで長くなぞろう');
        return;
      }
      this.trail.clear();
      this.guide.clear();
      this.finishHead(clamp01(1.1 - off / 110));
    }
  }
}

// 料理を先に決める（決めた料理で、さばき方が変わる）
class CookScene extends Phaser.Scene {
  constructor() { super('Cook'); }

  init(data) {
    this.catchData = data;
    this.fish = data.fish;
    this.leaving = false;
  }

  preload() {
    preloadFishPhotos(this);   // 冷蔵庫から来たときは、まだ読み込んでいないことがある
    preloadDishPhotos(this, this.fish);
  }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
    for (const fish of window.fishData.fish) {
      bake(this, `fish-${fish.id}`, FISH_BAKE.w, FISH_BAKE.h, (ctx, w, h) => paintFish(ctx, w, h, fish.id));
    }
    bakeFull(this, 'table', paintTable);
    bakeDishStandIns(this, this.fish);
    const shop = isLicensed(this.fish);
    titleText(this, H * 0.075, shop ? `${this.fish.name}を店に頼む` : `${this.fish.name}をどう食べる？`);
    if (shop) {
      // 資格を持つ人がさばく魚。自分ではさばかず、お金を払って店にさばいてもらう
      const d = this.catchData;
      this.fee = shopFee(this.fish, Number.isFinite(d.weight) ? d.weight : 0, d.fresh, !!d.frozen);
      bodyText(this, W / 2, H - 330,
        `フグは自分でさばかない魚。さばき代 ${this.fee}D を払って、資格を持つ人のいる店で料理してもらおう（所持金 ${Save.data.money}D）。料金はゲーム用の数字で、現実で受けてくれるかは店によります。`,
        26, { color: '#ffd27a', lineSpacing: 6, width: 720 });
      createTextButton(this, W - 22, H - 42, '自分でさばかない理由', () => licensedSheet(this.fish), 1);
      if (!this.catchData.stockId) {
        // 釣ってすぐのときは、お金が足りなくても冷蔵庫にしまえる
        createTextButton(this, 22, H - 42, '冷蔵庫にしまう', () => {
          if (this.leaving) return;
          this.leaving = true;
          Keep.add(this.catchData);
          changeScene(this, 'Harbor');
        });
      }
    }

    const dishes = this.fish.dishes;
    const gap = 20;
    const hasRaw = dishes.some((d) => d.raw);
    const room = H - H * 0.14 - (hasRaw ? 220 : shop ? 360 : 40);
    const cardH = Math.min(280, Math.floor((room - gap * (dishes.length - 1)) / dishes.length));
    const top = H * 0.14;
    dishes.forEach((dish, i) => this.addCard(dish, top + i * (cardH + gap), cardH));

    if (hasRaw) {
      bodyText(this, W / 2, H - 205,
        '釣ってから3日たつか冷凍すると、生の料理は作れません。これはゲームのルールで、現実の日持ちの目安ではありません。',
        24, { color: '#ffd27a', lineSpacing: 6, width: 720 });
    }

    // 冷蔵庫から来たときは、料理をやめてもどれる（魚は食べるまで冷蔵庫に残る）
    if (this.catchData.stockId) {
      createTextButton(this, 22, H - 42, '← もどる', () => {
        if (this.leaving) return;
        this.leaving = true;
        changeScene(this, 'Harbor');
      });
    }
  }

  addCard(dish, y, height) {
    const days = this.catchData.days || 0;
    const frozen = !!this.catchData.frozen;
    const blocked = dish.raw && (frozen || days >= RULES.rawDays);   // ゲームのルール
    const box = this.add.container(0, y).setDepth(20);
    const bg = this.add.rectangle(40, 0, W - 80, height, 0x1c120c, 0.72).setOrigin(0).setStrokeStyle(2, 0xd8bc90, 0.5);
    box.add(bg);
    const key = `dish-${this.fish.id}-${dish.id}`;
    if (this.textures.exists(key)) {
      box.add(this.add.image(54, 14, key).setOrigin(0).setDisplaySize(height - 28, height - 28));
    }
    box.add(this.add.text(height + 44, height / 2 - (dish.raw ? 22 : 0), wrapJapanese(dish.name, 46, W - height - 130), {
      fontFamily: FONT_TITLE, fontSize: '46px', fontStyle: '600', color: COLOR.cream,
    }).setOrigin(0, 0.5));
    if (dish.raw) {
      box.add(this.add.text(height + 44, height / 2 + 34, blocked ? (frozen ? '冷凍したので生では作れない' : '3日たったので作れない') : '生の料理', {
        fontFamily: FONT_BODY, fontSize: '26px', color: '#ffd27a',
      }).setOrigin(0, 0.5));
    }
    const shop = isLicensed(this.fish);
    const poor = shop && Save.data.money < this.fee;
    if (shop) {
      box.add(this.add.text(height + 44, height / 2 + 40, poor ? `さばき代 ${this.fee}D（お金が足りない）` : `さばき代 ${this.fee}D`, {
        fontFamily: FONT_BODY, fontSize: '26px', color: '#ffd27a',
      }).setOrigin(0, 0.5));
    }
    if (blocked || poor) { box.setAlpha(0.45); return; }
    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerup', () => {
      if (this.leaving) return;
      this.leaving = true;
      Sound.unlock();
      if (shop) {
        // 店にさばいてもらう。さばく工程はないので、店の腕前で出来が決まる
        Save.data.money -= this.fee;
        Save.commit();
        changeScene(this, 'Eat', { ...this.catchData, dish, skill: 0.9, shop: true });
        return;
      }
      changeScene(this, 'Prep', { ...this.catchData, dish });
    });
  }
}

class EatScene extends Phaser.Scene {
  constructor() { super('Eat'); }

  init(data) {
    this.catchData = data;
    this.fish = data.fish;
    this.dish = data.dish;
    this.leaving = false;
  }

  preload() { preloadDishPhotos(this, this.fish); }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 500, 20, 12, 8);
    this.add.rectangle(0, 0, W, H, 0x170e09).setOrigin(0).setDepth(0);
    bakeDishStandIns(this, this.fish);

    const fish = this.fish, dish = this.dish;
    const photoH = Math.min(W, Math.round(H * 0.5));
    const key = `dish-${fish.id}-${dish.id}`;
    const photo = this.add.image(W / 2, photoH / 2, key).setDisplaySize(W, W).setDepth(1);
    if (photoH < W) photo.setCrop(0, (W - photoH) / 2, W, photoH);

    // 写真の下を、背景へなじませる
    bake(this, 'fade-down', 16, 160, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(23,14,9,0)');
      g.addColorStop(1, 'rgba(23,14,9,1)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
    this.add.image(0, photoH - 160, 'fade-down').setOrigin(0).setDisplaySize(W, 160).setDepth(2);

    if (!REDUCE_MOTION) {
      // 湯気がゆっくり立ちのぼる
      bake(this, 'steam', 200, 440, paintSteam);
      [0.34, 0.5, 0.66].forEach((fx, i) => {
        const puff = this.add.image(W * fx, photoH * 0.58, 'steam').setOrigin(0.5, 1).setAlpha(0).setDepth(3).setBlendMode(Phaser.BlendModes.SCREEN);
        const rise = () => {
          puff.setPosition(W * fx + randBetween(-20, 20), photoH * 0.58).setScale(randBetween(0.7, 1)).setAlpha(0);
          this.tweens.add({ targets: puff, y: photoH * 0.58 - 130, duration: 3400, ease: 'Sine.easeOut', onComplete: rise });
          this.tweens.add({ targets: puff, alpha: 0.55, duration: 1300, yoyo: true, hold: 600 });
        };
        this.time.delayedCall(300 + i * 800, rise);
      });
      photo.setAlpha(0);
      this.tweens.add({ targets: photo, alpha: 1, duration: 700 });
    }

    const quality = this.catchData.fresh * 0.5 + this.catchData.skill * 0.5;
    const rank = quality >= 0.85 ? '絶品' : quality >= 0.6 ? '上手にできた' : 'ふつうにおいしい';
    const stars = quality >= 0.85 ? '★★★' : quality >= 0.6 ? '★★☆' : '★☆☆';

    this.add.text(W - 22, photoH - 8, dish.image ? '絵はAIで作成' : '', {
      fontFamily: FONT_BODY, fontSize: '22px', color: COLOR.cream,
    }).setOrigin(1, 1).setAlpha(0.7).setDepth(4);

    titleText(this, photoH + 40, dish.name);
    bodyText(this, W / 2, photoH + 90, `${stars}　${rank}${this.catchData.frozen ? '（冷凍）' : ''}`, 34, { color: '#ffd27a' });

    // ここまで来たら「料理した」。冷蔵庫の魚はここで使い切る
    rewardToast(this, Book.recordCook(fish, dish, stars));
    if (this.catchData.stockId) Keep.remove(this.catchData.stockId);

    // 「いただきます」を押すと「食べた」になり、食レポが出る
    const eat = createButton(this, W / 2, H - 150, 'いただきます', () => {
      eat.setVisible(false).disableInteractive();
      rewardToast(this, [...Book.recordEat(fish), Market.eat(this.catchData)]);
      this.showTasting(photoH);
    }, 46).setDepth(40);
  }

  showTasting(photoH) {
    const fish = this.fish, dish = this.dish;
    const report = bodyText(this, W / 2, photoH + 150, dish.foodReport, 32);
    const best = fish.facts.bestWay;
    if (best.status === '確認済み' && !dish.raw) {
      bodyText(this, W / 2, report.y + report.height + 20, `豆知識：${best.value}`, 26, { color: '#e6d3b4' });
    }

    // フグは本物のレシピを出さず、自分でさばかないことを伝える
    if (isLicensed(fish)) createButton(this, W / 2, H - 212, '自分でさばかない理由', () => licensedSheet(fish), 34).setDepth(40);
    else createButton(this, W / 2, H - 212, '実際に作るなら', () => recipeSheet(fish, dish), 40).setDepth(40);
    createSmallButton(this, W / 2 - 185, H - 76, '港へもどる', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Harbor');
    });
    createSmallButton(this, W / 2 + 185, H - 76, 'また釣りに行く', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Fishing', {});
    });
  }
}

return [TitleScene, HarborScene, FishingScene, CoolerScene, PrepScene, CookScene, EatScene];
}

/* ============================================================
   7. 起動
   ============================================================ */
(function boot() {
  if (!window.Phaser) {
    showNotice('ゲームを読み込めませんでした', ['通信のよい場所で、もう一度開いてください。']);
    return;
  }
  const fishData = loadFishData();
  if (!fishData) return;

  window.fishData = fishData;  // 段階2以降の画面から使う
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: W,
    height: H,
    backgroundColor: '#3c4770',
    banner: false,
    audio: { noAudio: true },   // 音は「4. 音と振動」で作るので、Phaserの音は使わない
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: makeScenes(),
  });
})();
</script>
