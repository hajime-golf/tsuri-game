<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
'use strict';

/* ============================================================
   2. ゲームの設定
   ============================================================ */
const GAME_VERSION = 'v0.4';
const TAU = Math.PI * 2;

// 横幅は固定し、高さを端末の縦横比に合わせる（スマホで上下左右に余白を出さないため）
const W = 780;
const H = (() => {
  const aspect = window.innerWidth / window.innerHeight;
  if (!(aspect > 0) || aspect >= 1) return 1560;  // PCや横向きは決まった縦長で表示する
  return Math.round(W / Math.min(0.62, Math.max(0.45, aspect)));
})();

const HORIZON = Math.round(H * 0.6);      // 水平線の高さ
const SEA_H = H - HORIZON;
const SUN_X = Math.round(W * 0.63);

const FONT_TITLE = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif';
const FONT_BODY = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif';

const COLOR = {
  cream: '#fff6e6',
  ink: '#27406a',
  shore: '#171a2c',
};

// 動きを減らす設定の端末では、波やふわっと出る動きを控えめにする
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// やり取りの調整用の数字（ゲームの手応えを決めるもので、現実の魚のデータではない）
// calm：おとなしい時間（秒）／warn：合図の時間／surge：強く引く時間／reel：巻いて寄る速さ
// out：緩めたときに糸が出る速さ／extra：どこまで糸を出されるとにげられるか
const FIGHT_STYLES = {
  dart: {
    calm: [0.9, 1.9], warn: 0.38, surge: 0.38, reel: 0.12, out: 0.08, extra: 0.4, side: 0.3, dive: false,
    warnText: 'ピクッときた！', surgeText: '小きざみに引いてる！',
    escapeText: '遠くへにげられた…',
  },
  run: {
    calm: [1.4, 2.8], warn: 0.6, surge: 1.2, reel: 0.15, out: 0.09, extra: 0.6, side: 1, dive: false,
    warnText: '横に走るぞ！', surgeText: '走った！ はなして！',
    escapeText: '糸を出されすぎた…',
  },
  dive: {
    calm: [1.1, 2.2], warn: 0.5, surge: 0.9, reel: 0.09, out: 0.26, extra: 0.3, side: 0, dive: true, first: 0.5,
    warnText: '潜るぞ！', surgeText: 'こらえて！ はなすな！',
    escapeText: '岩のすきまに潜られた…',
  },
};
const TENSION_SLACK = 0.18;   // これより下は「ゆるい」
const TENSION_DANGER = 0.82;  // これより上は「切れそう」
const HOLD_STRAIN = 0.09;     // 押し続けた1秒ごとに、糸の張りの目標が上がる量
const METERS_PER_DIST = 40;   // 画面の距離1が何mに見えるか

function randBetween(a, b) { return a + Math.random() * (b - a); }

// 失敗したときの案内を、画面いっぱいに出す
function showNotice(title, lines, code) {
  const box = document.getElementById('notice');
  box.textContent = '';
  const h = document.createElement('h1');
  h.textContent = title;
  box.appendChild(h);
  for (const line of lines) {
    const p = document.createElement('p');
    p.textContent = line;
    box.appendChild(p);
  }
  if (code) {
    const p = document.createElement('p');
    const c = document.createElement('code');
    c.textContent = code;
    p.appendChild(c);
    box.appendChild(p);
  }
  const button = document.createElement('button');
  button.textContent = 'もう一度読み込む';
  button.addEventListener('click', () => location.reload());
  box.appendChild(button);
  box.style.display = 'block';
}

// エラーの文から「データの何行目か」を取り出す（ブラウザごとに書き方が違う）
function findErrorLine(text, message) {
  let match = /line (\d+) column/.exec(message);
  if (match) return Number(match[1]);
  match = /position (\d+)/.exec(message);
  if (match) return text.slice(0, Number(match[1])).split('\n').length;
  return null;
}

// 先頭の魚データを読む。書き間違いがあれば、場所を案内して null を返す
function loadFishData() {
  const text = document.getElementById('fish-data').textContent;
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    const line = findErrorLine(text, String(err.message));
    const code = line ? text.split('\n')[line - 1].trim() : null;
    showNotice(
      '魚データの書き方に間違いがあります',
      [line
        ? 'index.html の魚データで、次の行か、その1つ上の行を見てください。カンマや「"」の抜けがよくある原因です。'
        : 'index.html の魚データで、カンマや「"」の抜けがないか見てください。'],
      code
    );
    return null;
  }
  if (!data || !Array.isArray(data.fish) || typeof data.sources !== 'object' || data.sources === null) {
    showNotice('魚データの形が違います', ['魚データには「sources」と「fish」の欄が必要です。']);
    return null;
  }
  if (data.fish.length === 0) {
    showNotice('魚データが空です', ['魚データの「fish」に、魚を1種類以上入れてください。']);
    return null;
  }
  // ゲームに必要な数字がそろっているかを、魚ごとに確かめる
  for (const fish of data.fish) {
    const g = fish && fish.game;
    const ok = g && Array.isArray(g.sizeCm) && g.sizeCm.length === 2 && FIGHT_STYLES[g.fight]
      && Number.isFinite(g.power) && Number.isFinite(g.biteWindowMs) && Number.isFinite(g.weightA)
      && Array.isArray(g.nibbles) && g.nibbles.length === 2
      && Array.isArray(g.bestRange) && g.bestRange.length === 2;
    if (!ok) {
      showNotice(
        '魚データの「game」の欄に足りないものがあります',
        ['sizeCm、fight（dart / run / dive）、power、biteWindowMs、nibbles、bestRange、weightA を見てください。'],
        fish && fish.name ? String(fish.name) : null
      );
      return null;
    }
  }
  return data;
}

/* ============================================================
   3. 保存（使えない環境では、開いている間だけ覚えておく）
   ============================================================ */
const Save = (() => {
  const KEY = 'tsuri-game/save/v1';
  const DEFAULTS = {
    version: 1, plays: 0, sound: true,
    day: 1, money: 0, nextStockId: 1,
    book: {},        // 魚ごとの図鑑の記録
    stock: [],       // 冷蔵庫と冷凍庫の魚
    catchLog: [],    // 釣った記録
    cookLog: [],     // 料理した記録
  };
  let state = { ...DEFAULTS };
  let available = false;

  try {
    const storage = window.localStorage;
    storage.setItem(KEY + '/test', '1');
    storage.removeItem(KEY + '/test');
    available = true;
    const raw = storage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') state = { ...DEFAULTS, ...parsed };
    }
  } catch (err) {
    // 保存が使えない、または中身が壊れている場合は、最初の状態で続ける
  }

  // 中身の形がおかしい欄は、その欄だけ最初の状態に戻す（前の版の保存もそのまま使える）
  for (const name of ['stock', 'catchLog', 'cookLog']) {
    if (!Array.isArray(state[name])) state[name] = [];
  }
  if (!state.book || typeof state.book !== 'object' || Array.isArray(state.book)) state.book = {};
  for (const name of ['day', 'money', 'nextStockId']) {
    if (!Number.isFinite(state[name])) state[name] = DEFAULTS[name];
  }

  return {
    get data() { return state; },
    get available() { return available; },
    commit() {
      if (!available) return;
      try {
        window.localStorage.setItem(KEY, JSON.stringify(state));
      } catch (err) {
        available = false;  // 容量切れなど。以降は保存せずに続ける
      }
    },
  };
})();

// 魚をとっておくルール（ゲームの調整用の数字で、現実の保存の目安ではない）
const RULES = {
  rawDays: 3,          // 冷蔵で、この日数がたつと生の料理は作れない
  fridgeDays: 7,       // 冷蔵で、この日数がたつと腐る
  freezerDays: 30,     // 冷凍してから、この日数がたつと捨てるしかない
  fridgeFade: 0.1,     // 冷蔵で1日ごとに下がる鮮度の割合
  fridgeFloor: 0.3,    // 冷蔵の鮮度が下がる下限の割合
  frozenTaste: 0.6,    // 冷凍すると、味（鮮度）にかかる割合
  frozenPrice: 0.6,    // 冷凍すると、売値にかかる割合（売る機能は段階5で作る）
};
const RULE_NOTE = '生の料理は釣ってから3日まで、冷蔵は7日まで、冷凍は1か月まで、冷凍した魚は生で使えない、というのはゲームのルールです。現実の保存の目安ではありません。';

// 図鑑の達成ごほうび（お金D）。数字はゲーム用で、あとから直してよい
const BOOK_REWARDS = { caught: 100, cooked: 200, eaten: 100, fishComplete: 500, allComplete: 3000 };
const LOG_LIMIT = 200;   // 記録をいくつまで残すか

// 冷蔵庫と冷凍庫
const Keep = {
  items() { return Save.data.stock; },

  add(catchData) {
    const d = Save.data;
    d.stock.push({
      id: d.nextStockId++,
      fishId: catchData.fish.id,
      sizeCm: catchData.sizeCm,
      weight: catchData.weight,
      fresh: catchData.fresh,
      caughtDay: d.day,
      frozenDay: null,
    });
    Save.commit();
  },

  // いまの状態（あと何日もつか、生で使えるか、鮮度はいくつか）
  info(item) {
    const today = Save.data.day;
    const days = today - item.caughtDay;
    if (item.frozenDay !== null) {
      const left = RULES.freezerDays - (today - item.frozenDay);
      return { frozen: true, days, left, rotten: left <= 0, rawOk: false, fresh: item.fresh * RULES.frozenTaste };
    }
    const left = RULES.fridgeDays - days;
    const fade = Math.max(RULES.fridgeFloor, 1 - days * RULES.fridgeFade);
    return { frozen: false, days, left, rotten: left <= 0, rawOk: days < RULES.rawDays, fresh: item.fresh * fade };
  },

  // 冷凍する。凍らせた時点の鮮度をとっておく
  freeze(id) {
    const item = Save.data.stock.find((x) => x.id === id);
    if (!item || item.frozenDay !== null) return;
    item.fresh *= Math.max(RULES.fridgeFloor, 1 - (Save.data.day - item.caughtDay) * RULES.fridgeFade);
    item.frozenDay = Save.data.day;
    Save.commit();
  },

  remove(id) {
    Save.data.stock = Save.data.stock.filter((x) => x.id !== id);
    Save.commit();
  },

  // 腐った魚と、あと1日で腐る魚の数
  worryCount() {
    return Save.data.stock.filter((item) => this.info(item).left <= 1).length;
  },

  nextDay() {
    Save.data.day += 1;
    Save.commit();
  },
};

// 図鑑の記録と達成ごほうび。ごほうびの知らせを文字の配列で返す
const Book = {
  entry(id) {
    const book = Save.data.book;
    if (!book[id]) book[id] = { caught: 0, cooked: 0, eaten: 0, maxCm: 0, dishes: {} };
    return book[id];
  },

  stampCount() {
    let n = 0;
    for (const fish of window.fishData.fish) {
      const e = this.entry(fish.id);
      n += (e.caught > 0 ? 1 : 0) + (e.cooked > 0 ? 1 : 0) + (e.eaten > 0 ? 1 : 0);
    }
    return n;
  },
  stampTotal() { return window.fishData.fish.length * 3; },
  rate() { return Math.floor((this.stampCount() / this.stampTotal()) * 100); },

  // 3段階のどれかを初めて達成したときだけ、ごほうびを出す
  stamp(fish, kind, label) {
    const e = this.entry(fish.id);
    const first = e[kind] === 0;
    e[kind] += 1;
    const notes = [];
    if (first) {
      Save.data.money += BOOK_REWARDS[kind];
      notes.push(`図鑑「${fish.name}」${label}　+${BOOK_REWARDS[kind]}D`);
      if (e.caught > 0 && e.cooked > 0 && e.eaten > 0) {
        Save.data.money += BOOK_REWARDS.fishComplete;
        notes.push(`${fish.name}をコンプリート！　+${BOOK_REWARDS.fishComplete}D`);
      }
      if (this.stampCount() === this.stampTotal()) {
        Save.data.money += BOOK_REWARDS.allComplete;
        notes.push(`図鑑コンプリート！　+${BOOK_REWARDS.allComplete}D`);
      }
    }
    return notes;
  },

  pushLog(name, row) {
    const log = Save.data[name];
    log.push(row);
    if (log.length > LOG_LIMIT) log.splice(0, log.length - LOG_LIMIT);
  },

  recordCatch(fish, sizeCm, weight) {
    const e = this.entry(fish.id);
    e.maxCm = Math.max(e.maxCm, sizeCm);
    this.pushLog('catchLog', { day: Save.data.day, fishId: fish.id, sizeCm, weight: Math.round(weight) });
    const notes = this.stamp(fish, 'caught', '釣れた');
    Save.commit();
    return notes;
  },

  recordCook(fish, dish, stars) {
    const e = this.entry(fish.id);
    e.dishes[dish.id] = (e.dishes[dish.id] || 0) + 1;
    this.pushLog('cookLog', { day: Save.data.day, fishId: fish.id, dishId: dish.id, stars });
    const notes = this.stamp(fish, 'cooked', '料理した');
    Save.commit();
    return notes;
  },

  recordEat(fish) {
    const notes = this.stamp(fish, 'eaten', '食べた');
    Save.commit();
    return notes;
  },
};

   4. 音と振動、スマホを振る操作
   ============================================================ */

// 音はファイルを使わず、その場で作る
const Sound = (() => {
  let ctx = null;
  let master = null;
  let noiseBuffer = null;
  let sea = null;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = Save.data.sound ? 1 : 0;
      master.connect(ctx.destination);
      noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const samples = noiseBuffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    } catch (err) {
      ctx = null;  // 音が使えない環境では、音なしで続ける
    }
    return ctx;
  }

  // 高さを変えられる1音
  function tone(freq, dur, { type = 'sine', vol = 0.2, slideTo = null, delay = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // 水や風の「ザーッ」という音
  function noise(dur, { from = 1200, to = 300, vol = 0.2, type = 'lowpass', delay = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    src.buffer = noiseBuffer;
    filter.type = type;
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(master);
    src.start(t, Math.random());
    src.stop(t + dur + 0.02);
  }

  return {
    // 指で押した流れで呼ぶ（ブラウザは、押されるまで音を出させてくれない）
    unlock() {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
    },
    setEnabled(on) {
      Save.data.sound = on;
      Save.commit();
      if (master) master.gain.value = on ? 1 : 0;
    },
    startSea() {
      if (!ctx || sea) return;
      const src = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      src.buffer = noiseBuffer;
      src.loop = true;
      filter.type = 'lowpass';
      filter.frequency.value = 520;
      gain.gain.value = 0.05;
      lfo.frequency.value = 0.13;   // ゆっくり寄せては返す
      lfoGain.gain.value = 0.025;
      lfo.connect(lfoGain).connect(gain.gain);
      src.connect(filter).connect(gain).connect(master);
      src.start();
      lfo.start();
      sea = { src, lfo };
    },
    stopSea() {
      if (!sea) return;
      try { sea.src.stop(); sea.lfo.stop(); } catch (err) { /* すでに止まっている */ }
      sea = null;
    },
    cast()   { noise(0.42, { from: 2600, to: 500, vol: 0.14, type: 'bandpass' }); },
    splash() { noise(0.36, { from: 1800, to: 260, vol: 0.2 }); tone(240, 0.1, { slideTo: 90, vol: 0.12 }); },
    nibble() { tone(620, 0.07, { vol: 0.12, slideTo: 420 }); },
    bite()   { noise(0.3, { from: 1400, to: 200, vol: 0.28 }); tone(170, 0.24, { slideTo: 70, vol: 0.3 }); },
    hook()   { tone(330, 0.09, { type: 'triangle', vol: 0.2 }); tone(495, 0.14, { type: 'triangle', vol: 0.2, delay: 0.07 }); },
    warn()   { tone(880, 0.08, { type: 'triangle', vol: 0.16 }); tone(880, 0.08, { type: 'triangle', vol: 0.16, delay: 0.12 }); },
    surge()  { noise(0.3, { from: 900, to: 220, vol: 0.2 }); tone(130, 0.3, { type: 'sawtooth', vol: 0.08, slideTo: 90 }); },
    tick(t)  { tone(300 + t * 420, 0.025, { type: 'square', vol: 0.03 }); },
    snap()   { noise(0.12, { from: 5000, to: 1500, vol: 0.3, type: 'highpass' }); tone(1200, 0.12, { slideTo: 200, vol: 0.16 }); },
    miss()   { tone(300, 0.26, { type: 'triangle', slideTo: 170, vol: 0.14 }); },
    caught() {
      noise(0.42, { from: 2200, to: 300, vol: 0.2 });
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.34, { type: 'triangle', vol: 0.2, delay: 0.12 + i * 0.11 }));
    },
  };
})();

// 振動。Androidは本物の振動、iPhoneのSafariには振動の機能がないので小さな手応えだけ試す
const Buzz = (() => {
  const canVibrate = typeof navigator.vibrate === 'function';
  let iosSwitch = null;

  function tapIos() {
    if (!iosSwitch) {
      iosSwitch = document.createElement('label');
      iosSwitch.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      iosSwitch.appendChild(input);
      document.body.appendChild(iosSwitch);
    }
    iosSwitch.click();
  }

  return {
    pulse(pattern) {
      if (!canVibrate) return;
      try { navigator.vibrate(pattern); } catch (err) { /* 振動できなくても続ける */ }
    },
    // 指で押した瞬間だけ呼ぶ
    tap() {
      if (canVibrate) this.pulse(10);
      else if (navigator.maxTouchPoints > 0) tapIos();
    },
  };
})();

// スマホを振った動きを見つける
const Motion = (() => {
  const THRESHOLD = 15;      // これより強く動いたら「振った」とする（m/s²）
  const PEAK_WINDOW = 160;   // いちばん強いところを探す時間（ミリ秒）
  const COOLDOWN = 500;      // 1回振ったあと、次を受けつけない時間（ミリ秒）
  const supported = 'DeviceMotionEvent' in window && navigator.maxTouchPoints > 0;
  let listening = false;
  let callback = null;
  let peak = 0;
  let peakEnd = 0;
  let coolUntil = 0;

  function strengthOf(event) {
    const a = event.acceleration;
    if (a && a.x !== null && a.x !== undefined) return Math.hypot(a.x, a.y, a.z);
    const g = event.accelerationIncludingGravity;
    if (g && g.x !== null && g.x !== undefined) return Math.abs(Math.hypot(g.x, g.y, g.z) - 9.8);
    return 0;
  }

  function onMotion(event) {
    const now = performance.now();
    if (now < coolUntil) return;
    const m = strengthOf(event);
    if (peak === 0) {
      if (m >= THRESHOLD) { peak = m; peakEnd = now + PEAK_WINDOW; }
      return;
    }
    peak = Math.max(peak, m);
    if (now >= peakEnd) {
      const strength = Math.min(1, (peak - THRESHOLD) / 25);
      peak = 0;
      coolUntil = now + COOLDOWN;
      if (callback) callback(strength);
    }
  }

  return {
    supported,
    // iPhoneは、ボタンを押した流れの中で許可を求める必要がある
    async request() {
      try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          const answer = await DeviceMotionEvent.requestPermission();
          if (answer !== 'granted') return false;
        }
        if (!listening) {
          window.addEventListener('devicemotion', onMotion);
          listening = true;
        }
        return true;
      } catch (err) {
        return false;  // 許可されなくても、ボタンで遊べる
      }
    },
    onSwing(fn) { callback = fn; peak = 0; },
  };
})();

/* ============================================================
   5. 図形の絵（水彩風の絵は、最初に一度だけ描いてとっておく）
   ============================================================ */

// 同じ絵が毎回同じように描けるよう、種つきの乱数を使う
function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function bake(scene, key, width, height, draw) {
  if (scene.textures.exists(key)) return;
  const texture = scene.textures.createCanvas(key, width, height);
  draw(texture.getContext(), width, height);
  texture.refresh();
}

// ふちがぼけた、にじみの丸
function blob(ctx, x, y, rx, ry, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, rgba(color, alpha));
  g.addColorStop(0.7, rgba(color, alpha * 0.6));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// 少しずつ形を変えて薄く重ね塗りし、水彩のにじんだふちを作る
function wash(ctx, rnd, cx, cy, rx, ry, color, passes, alpha) {
  const count = 20;
  const base = Array.from({ length: count }, () => 1 + (rnd() - 0.5) * 0.36);
  ctx.fillStyle = rgba(color, alpha);
  for (let p = 0; p < passes; p++) {
    const pts = base.map((r, k) => {
      const a = (k / count) * TAU;
      const j = r * (1 + (rnd() - 0.5) * 0.26);
      return [cx + Math.cos(a) * rx * j, cy + Math.sin(a) * ry * j];
    });
    ctx.beginPath();
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const start = mid(pts[count - 1], pts[0]);
    ctx.moveTo(start[0], start[1]);
    for (let k = 0; k < count; k++) {
      const m = mid(pts[k], pts[(k + 1) % count]);
      ctx.quadraticCurveTo(pts[k][0], pts[k][1], m[0], m[1]);
    }
    ctx.closePath();
    ctx.fill();
  }
}

// 朝焼けの空と、海の下地
function paintDawn(ctx, w, h) {
  const rnd = seeded(11);

  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#46548a');
  sky.addColorStop(0.3, '#6d74aa');
  sky.addColorStop(0.56, '#b794b6');
  sky.addColorStop(0.78, '#eea898');
  sky.addColorStop(0.93, '#f8cb94');
  sky.addColorStop(1, '#fde5b4');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, HORIZON);

  // 空のにじみ
  const tints = ['#8c86c0', '#f3b8a8', '#5f6ca6', '#f9d7ae'];
  for (let i = 0; i < 70; i++) {
    const y = rnd() * HORIZON;
    const tint = tints[Math.min(3, Math.floor((y / HORIZON) * 3 + rnd() * 1.4))];
    blob(ctx, rnd() * w, y, 120 + rnd() * 220, 50 + rnd() * 100, tint, 0.08);
  }

  // 太陽（水平線から半分だけ出ている）
  const sunY = HORIZON - 8;
  blob(ctx, SUN_X, sunY, 430, 300, '#ffd9a0', 0.55);
  blob(ctx, SUN_X, sunY, 200, 150, '#fff0c4', 0.7);
  ctx.fillStyle = '#fff4d2';
  ctx.beginPath();
  ctx.arc(SUN_X, sunY, 62, 0, TAU);
  ctx.fill();

  // 朝日に照らされた雲（下側ほど明るい）
  const clouds = [
    [0.18, 0.60, 300, 26, '#c98fae'],
    [0.86, 0.66, 260, 22, '#f2a596'],
    [0.40, 0.76, 340, 20, '#f6a78e'],
    [0.08, 0.84, 240, 16, '#f7b48f'],
    [0.82, 0.86, 280, 15, '#fbc690'],
    [0.50, 0.46, 240, 18, '#a58ab9'],
  ];
  for (const [fx, fy, rx, ry, color] of clouds) {
    const x = fx * w;
    const y = fy * HORIZON;
    wash(ctx, rnd, x, y, rx, ry, color, 16, 0.06);
    wash(ctx, rnd, x + rx * 0.28, y + ry * 0.5, rx * 0.56, ry * 0.5, '#ffe2c4', 12, 0.06);
  }

  // 遠くの山
  ctx.beginPath();
  ctx.moveTo(0, HORIZON + 2);
  for (let x = 0; x <= w * 0.5; x += 8) {
    const fade = 1 - x / (w * 0.5);
    const lift = (46 + 26 * Math.sin(x / 70) + 12 * Math.sin(x / 23)) * fade;
    ctx.lineTo(x, HORIZON - lift);
  }
  ctx.lineTo(w * 0.5, HORIZON + 2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(133,112,168,0.72)';
  ctx.fill();

  // 海の下地
  const sea = ctx.createLinearGradient(0, HORIZON, 0, h);
  sea.addColorStop(0, '#f2c3a5');
  sea.addColorStop(0.22, '#bda6bb');
  sea.addColorStop(0.55, '#6d84aa');
  sea.addColorStop(1, '#2d5478');
  ctx.fillStyle = sea;
  ctx.fillRect(0, HORIZON, w, SEA_H);

  // 海に映る朝日
  for (let i = 0; i < 26; i++) {
    const t = i / 26;
    const y = HORIZON + t * SEA_H * 0.55;
    blob(ctx, SUN_X + (rnd() - 0.5) * 40, y, 50 + t * 170, 16, '#ffdcae', 0.16 * (1 - t * 0.7));
  }
}

// 波1枚。横の長さは画面2つ分で、1画面ごとに同じ形がくり返す（つなぎ目が出ない）
function paintWave(ctx, w, h, seed, top, deep, amp) {
  const rnd = seeded(seed);
  const period = w / 2;
  const parts = [2, 3, 5, 8].map((n) => ({ n, phase: rnd() * TAU, size: 1 / n }));
  const crest = (x) => parts.reduce(
    (sum, p) => sum + Math.sin((p.n * TAU * x) / period + p.phase) * p.size * amp,
    amp + 16
  );
  const fill = ctx.createLinearGradient(0, 0, 0, h);
  fill.addColorStop(0, top);
  fill.addColorStop(0.5, deep);
  fill.addColorStop(1, rgba(deep, 0));

  ctx.globalAlpha = 0.2;
  ctx.fillStyle = fill;
  for (let pass = 0; pass < 7; pass++) {
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 10) {
      const bleed = pass * 2.2 + 3 * Math.sin(((3 + pass) * TAU * x) / period + pass);
      ctx.lineTo(x, crest(x) + bleed);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 堤防と、釣りをしている人
const SHORE_TOP = Math.round(H * 0.74) - 300;

function paintShore(ctx, w, h, noRod) {

  // 人（立って、竿を持っている）

function paintFloat(ctx, w, h) {
  ctx.fillStyle = '#d9564a';
  ctx.beginPath();
  ctx.arc(w / 2, 20, 11, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#fff6e6';
  ctx.beginPath();
  ctx.arc(w / 2, 20, 11, 0, Math.PI);
  ctx.fill();
  ctx.strokeStyle = '#3b3f63';

}

function paintGull(ctx, w, h) {
  ctx.strokeStyle = '#1e2036';
  ctx.lineWidth = 3.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(4, h * 0.65);
  ctx.quadraticCurveTo(w * 0.25, 2, w / 2, h * 0.75);
  ctx.quadraticCurveTo(w * 0.75, 2, w - 4, h * 0.65);
  ctx.stroke();
}

/* ---------- 写実の絵のための道具 ---------- */
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function sstep(a, b, v) { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerp3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// 同じ場所なら毎回同じ値になる、なめらかなでこぼこ
function hash2(ix, iy) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx);
  fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function fbm(x, y, octaves) {
  let sum = 0, amp = 0.5, total = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * vnoise(x, y);
    total += amp;
    x = x * 2.03 + 17.1;
    y = y * 2.03 - 9.7;
    amp *= 0.5;
  }
  return sum / total;
}

// 1点ずつ色を計算して描く。shade(x, y, out) が out に [赤, 緑, 青, 不透明度] を入れる
function paintPixels(ctx, w, h, shade) {
  const image = ctx.createImageData(w, h);
  const data = image.data;
  const out = [0, 0, 0, 255];
  let i = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      out[3] = 255;
      shade(x, y, out);
      data[i++] = out[0];
      data[i++] = out[1];
      data[i++] = out[2];
      data[i++] = out[3];
    }
  }
  ctx.putImageData(image, 0, 0);
}

function offscreen(w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  return canvas;
}

// 点の列を通る、なめらかな線を作る
function curveFrom(points) {
  const n = points.length;
  const slope = (i) => {
    const a = points[Math.max(0, i - 1)], b = points[Math.min(n - 1, i + 1)];
    return (b[1] - a[1]) / (b[0] - a[0]);
  };
  return (x) => {
    const v = Math.min(points[n - 1][0], Math.max(points[0][0], x));
    let i = 0;
    while (i < n - 2 && v > points[i + 1][0]) i++;
    const [x0, y0] = points[i];
    const [x1, y1] = points[i + 1];
    const d = x1 - x0, t = (v - x0) / d, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * d * slope(i)
      + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * d * slope(i + 1);
  };
}

/* ---------- 魚の絵 ---------- */

// 魚の形。x は口先0〜尾の付け根1、top と bot は体の中心線から背中・おなかまでの高さ（体長に対する割合）
const FISH_SHAPE = {
  // マアジ：先のとがった平たい体で、尾の付け根がとても細い
  aji: {
    x0: 22, L: 418, gill: 0.265, eye: [0.105, -0.28], eyeR: 12.5,
    top: [[0, 0], [0.03, 0.052], [0.1, 0.108], [0.2, 0.142], [0.3, 0.152], [0.45, 0.142], [0.6, 0.108], [0.75, 0.062], [0.88, 0.028], [1, 0.022]],
    bot: [[0, 0], [0.03, 0.03], [0.1, 0.076], [0.2, 0.122], [0.3, 0.138], [0.45, 0.132], [0.6, 0.102], [0.75, 0.06], [0.88, 0.028], [1, 0.022]],
  },
  // マサバ：太い魚雷の形
  saba: {
    x0: 22, L: 430, gill: 0.235, eye: [0.095, -0.22], eyeR: 12.5,
    top: [[0, 0], [0.03, 0.034], [0.1, 0.082], [0.2, 0.114], [0.32, 0.127], [0.5, 0.117], [0.7, 0.082], [0.88, 0.034], [1, 0.022]],
    bot: [[0, 0], [0.03, 0.03], [0.1, 0.072], [0.2, 0.102], [0.32, 0.116], [0.5, 0.11], [0.7, 0.076], [0.88, 0.032], [1, 0.022]],
  },
  // カサゴ：頭が大きく、尾の付け根が太い
  kasago: {
    x0: 26, L: 392, gill: 0.33, eye: [0.135, -0.5], eyeR: 15,
    top: [[0, 0], [0.02, 0.05], [0.08, 0.128], [0.18, 0.178], [0.3, 0.192], [0.45, 0.178], [0.6, 0.142], [0.75, 0.108], [0.9, 0.088], [1, 0.082]],
    bot: [[0, 0.01], [0.02, 0.058], [0.08, 0.1], [0.18, 0.138], [0.3, 0.155], [0.45, 0.148], [0.6, 0.114], [0.75, 0.088], [0.9, 0.072], [1, 0.068]],
  },
};

function fishGeometry(id) {
  const shape = FISH_SHAPE[id] || FISH_SHAPE.aji;
  const top = curveFrom(shape.top);
  const bot = curveFrom(shape.bot);
  const cy = 140;
  return {
    ...shape, id, cy,
    px: (x) => shape.x0 + x * shape.L,
    upY: (x) => cy - top(x) * shape.L,
    lowY: (x) => cy + bot(x) * shape.L,
  };
}

// 体の輪かくの線
function fishOutline(ctx, g) {
  ctx.beginPath();
  ctx.moveTo(g.px(0), g.upY(0));
  for (let x = 0.01; x <= 1.0001; x += 0.01) ctx.lineTo(g.px(x), g.upY(x));
  for (let x = 1; x >= 0; x -= 0.01) ctx.lineTo(g.px(x), g.lowY(x));
  ctx.closePath();
}

// 各魚の、生のときの体の色
function rawFishColor(id, g, x, s, bx, half) {
  if (id === 'aji') {
    const n = fbm(bx * 0.02, s * 2.2, 3);
    let c = lerp3([44, 74, 78], [186, 196, 188], sstep(-0.9, -0.08, s + (n - 0.5) * 0.2));
    c = lerp3(c, [240, 240, 232], sstep(-0.1, 0.62, s));
    // 体の横に、うっすら黄金色の帯
    const band = Math.exp(-Math.pow((s + 0.16) / 0.24, 2)) * 0.5;
    c = lerp3(c, [204, 176, 92], band);
    // ぜいご（尾に向かう、とげのあるうろこの列）
    const line = lerp(-0.46, -0.03, sstep(0.3, 0.62, x));
    if (x > g.gill + 0.02) {
      const dy = Math.abs((s - line) * half);
      const height = lerp(2, 8.5, sstep(0.42, 0.72, x)) * (1 - sstep(0.93, 1, x) * 0.4);
      const period = lerp(6, 11, sstep(0.4, 0.8, x));
      const u = (bx / period) % 1;
      const shield = dy / height + Math.abs(u - 0.5) * 0.85;
      if (shield < 1) {
        const face = lerp3([214, 208, 180], [108, 98, 78], u);
        c = lerp3(c, face, sstep(1, 0.72, shield) * lerp(0.28, 0.7, sstep(0.42, 0.7, x)));
      }
    }
    // エラの上の黒い点
    const sx = (x - (g.gill - 0.012)) / 0.024, sy = (s + 0.62) / 0.14;
    c = lerp3(c, [20, 24, 28], sstep(1.2, 0.5, sx * sx + sy * sy) * 0.92);
    return c;
  }
  if (id === 'saba') {
    const n = fbm(bx * 0.018 + 3, s * 2, 3);
    let c = lerp3([22, 82, 104], [42, 118, 124], n);
    c = lerp3(c, [204, 212, 212], sstep(-0.16, 0.26, s + (n - 0.5) * 0.12));
    c = lerp3(c, [246, 244, 238], sstep(0.2, 0.75, s));
    // 背中の、くねくねした黒い模様
    if (s < 0.08 && x > g.gill - 0.04) {
      const warp = fbm(x * 12, s * 4 + 5, 3);
      const wave = Math.sin(x * 92 + warp * 13 + s * 11);
      const zone = sstep(0.06, -0.3, s);
      c = lerp3(c, [12, 30, 40], sstep(0.05, 0.55, wave) * zone * 0.95);
    }
    // おなかのピンクがかった光
    c = lerp3(c, [236, 196, 200], Math.exp(-Math.pow((s - 0.34) / 0.2, 2)) * 0.2 * n * 2);
    return c;
  }
  // カサゴ：赤茶色で、暗い帯とまだら、小さな白い点
  const n = fbm(bx * 0.03, s * 3 + 8, 4);
  let c = lerp3([150, 62, 40], [108, 44, 30], n);
  c = lerp3(c, [226, 164, 124], sstep(0.12, 0.92, s + (n - 0.5) * 0.3));
  let bar = 0;
  for (const center of [0.36, 0.5, 0.64, 0.78, 0.93]) {
    bar += Math.exp(-Math.pow((x - center + (fbm(s * 3, center * 20, 3) - 0.5) * 0.09) / 0.042, 2));
  }
  c = lerp3(c, [48, 22, 18], clamp01(bar) * sstep(0.62, -0.2, s) * 0.86);
  const blotch = sstep(0.54, 0.74, fbm(bx * 0.075, s * half * 0.075 + 4, 3));
  c = lerp3(c, [64, 28, 20], blotch * sstep(0.7, -0.1, s) * 0.5);
  const cellX = Math.floor(bx / 13), cellY = Math.floor((s * half) / 13);
  if (hash2(cellX + 3, cellY) > 0.86 && s < 0.5) {
    const px = bx / 13 - cellX - 0.5 + (hash2(cellX, cellY + 2) - 0.5) * 0.5;
    const py = (s * half) / 13 - cellY - 0.5 + (hash2(cellX + 9, cellY) - 0.5) * 0.5;
    const size = 0.02 + hash2(cellX, cellY) * 0.05;
    c = lerp3(c, [222, 190, 158], sstep(size, size * 0.4, px * px + py * py) * 0.55);
  }
  return c;
}

// 焼いたときの体の色
const ROAST_RAMP = [
  [0, [240, 196, 116]],
  [0.36, [205, 138, 58]],
  [0.64, [128, 72, 28]],
  [0.86, [58, 32, 16]],
  [1, [26, 16, 10]],
];
function roastColor(v) {
  for (let i = 1; i < ROAST_RAMP.length; i++) {
    if (v <= ROAST_RAMP[i][0]) {
      const [a, ca] = ROAST_RAMP[i - 1], [b, cb] = ROAST_RAMP[i];
      return lerp3(ca, cb, (v - a) / (b - a));
    }
  }
  return ROAST_RAMP[ROAST_RAMP.length - 1][1];
}

function grilledFishColor(id, g, x, s, bx, by, raw) {
  const rough = fbm(bx * 0.04, by * 0.06, 4);
  // 網の焦げ目は、まっすぐでなく、ところどころ途切れる
  const grid = (bx * 0.0165 + s * 0.14 + (rough - 0.5) * 0.3) % 1;
  const mark = Math.exp(-Math.pow((grid - 0.5) / 0.075, 2)) * sstep(0.34, 0.5, fbm(by * 0.03, bx * 0.012, 2));
  let burn = 0.1 + sstep(0.55, -0.85, s) * 0.34 + (rough - 0.42) * 1.05 + mark * 0.62;
  burn += sstep(0.13, 0.02, x) * 0.32;                   // 顔のあたりはよく焼ける
  burn += sstep(0.82, 1, x) * 0.18;
  // 生のときの模様は、焼いても少し残る
  const rawLum = (raw[0] + raw[1] + raw[2]) / 765;
  burn += (0.55 - rawLum) * 0.34;
  let c = roastColor(clamp01(burn));
  c = lerp3(c, [188, 170, 142], 0.3 * (1 - clamp01(burn)));
  if (id === 'kasago') c = lerp3(c, [168, 74, 40], 0.22);
  // 皮がふくらんだところ
  const bumpX = bx * 0.2, bumpY = by * 0.2;
  const bump = vnoise(bumpX, bumpY);
  if (bump > 0.7) c = lerp3(c, [248, 208, 140], sstep(0.7, 0.86, bump) * 0.65);
  else if (bump < 0.22) c = lerp3(c, [60, 32, 14], sstep(0.22, 0.08, bump) * 0.55);
  return c;
}

function fishBodyCanvas(id, w, h, cooked) {
  const scale = w / 560;
  const g = fishGeometry(id);
  const canvas = offscreen(w, h);
  const scaleFreq = id === 'kasago' ? 0.5 : id === 'saba' ? 1.1 : 0.82;

  paintPixels(canvas.getContext('2d'), w, h, (px, py, o) => {
    const bx = px / scale, by = py / scale;
    const x = (bx - g.x0) / g.L;
    if (x <= 0 || x >= 1.012) { o[3] = 0; return; }
    const up = g.upY(x), low = g.lowY(x);
    const half = (low - up) / 2;
    if (half <= 0.2) { o[3] = 0; return; }
    const s = (by - (up + low) / 2) / half;
    const edge = (1 - Math.abs(s)) * half * scale;
    if (edge <= -0.5) { o[3] = 0; return; }

    const raw = rawFishColor(id, g, x, s, bx, half);
    let c = cooked ? grilledFishColor(id, g, x, s, bx, by, raw) : raw;

    // 体の丸みに合わせた明るさ。上から光が当たる
    const round = Math.sqrt(Math.max(0, 1 - s * s));
    let light = 0.42 + 0.72 * clamp01(round * 0.72 - s * 0.42);

    // エラぶたのふち
    const gillAt = g.gill - 0.05 * s * s;
    const fromGill = x - gillAt;
    if (fromGill < 0) {
      if (fromGill > -0.016) light *= lerp(0.62, 1, sstep(0, -0.016, fromGill));
      if (id === 'kasago') {
        c = lerp3(c, [44, 20, 16], sstep(0.5, 0.74, fbm(bx * 0.09, by * 0.09, 3)) * 0.55);
      }
    } else if (!cooked || id === 'kasago') {
      // うろこ。光の当たり方でチラチラする
      const size = id === 'kasago' ? 8.5 : id === 'saba' ? 3.2 : 4.2;
      const v = (s * half) / size + fbm(bx * 0.02, by * 0.02, 2) * 0.8;
      const row = Math.floor(v);
      const u = bx / (size * 1.25) + (row % 2) * 0.5;
      const cell = Math.floor(u);
      const fu = u - cell - 0.5, fv = v - row - 0.5;
      // うろこ1枚の後ろのふちだけ、うすく影を落とす
      const rim = sstep(0.05, 0.42, fu + fv * fv * 0.9);
      const strength = id === 'kasago' ? 0.2 : 0.07;
      light *= 1 - rim * (cooked ? strength * 0.3 : strength);
      if (!cooked) {
        const glitter = hash2(cell, row * 7);
        const band = clamp01(1 - Math.abs(s + 0.08) * 1.25);
        if (glitter > 0.7) c = lerp3(c, [255, 255, 248], (glitter - 0.7) * (id === 'kasago' ? 0.2 : 1.3) * band);
      }
    }

    // 銀色の体に映り込む、長くのびた濃淡
    if (!cooked && id !== 'kasago') {
      const streak = fbm(bx * 0.009 + 5, s * 5.5, 3);
      light *= 0.82 + streak * 0.42;
    }

    // 虹色の光（生の魚のぬめりと銀色）
    if (!cooked && id !== 'kasago') {
      const tint = fbm(bx * 0.012 + 40, by * 0.02, 2);
      c = lerp3(c, tint > 0.5 ? [150, 210, 214] : [226, 186, 214], Math.abs(tint - 0.5) * 0.7 * clamp01(1 - Math.abs(s)));
    }

    o[0] = c[0] * light;
    o[1] = c[1] * light;
    o[2] = c[2] * light;

    // 背中側に細く走る光
    const specBand = Math.exp(-Math.pow((s + 0.42) / 0.13, 2));
    const specNoise = fbm(bx * 0.05 + 11, by * 0.05, 2);
    const spec = specBand * (cooked ? 0.1 + specNoise * 0.3 : id === 'kasago' ? 0.14 : 0.42) * 255 * (cooked ? 0.42 : 0.6);
    o[0] += spec;
    o[1] += spec * 0.95;
    o[2] += spec * (cooked ? 0.72 : 0.92);

    o[3] = 255 * clamp01(edge + 0.5) * clamp01((1.012 - x) * g.L * scale * 0.4);
  });
  return canvas;
}

// ヒレ1枚。rays は [付け根x, 付け根y, 先x, 先y] の列
function drawFin(ctx, rays, opts) {
  const { color, edge, alpha = 0.86, spiny = false, cooked = false, rnd } = opts;
  const first = rays[0], last = rays[rays.length - 1];
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(first[0], first[1]);
  ctx.lineTo(first[2], first[3]);
  for (let i = 1; i < rays.length; i++) {
    const a = rays[i - 1], b = rays[i];
    if (spiny) {
      // トゲとトゲの間の膜は、内側にくぼむ
      ctx.quadraticCurveTo((a[2] + b[2] + a[0] + b[0]) / 4, lerp((a[3] + b[3]) / 2, (a[1] + b[1]) / 2, 0.42), b[2], b[3]);
    } else {
      ctx.lineTo(b[2], b[3]);
    }
  }
  ctx.lineTo(last[0], last[1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(first[0], first[1], first[2], first[3]);
  g.addColorStop(0, rgba(color, Math.min(1, alpha + 0.1)));
  g.addColorStop(1, rgba(edge, alpha * 0.82));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.clip();
  // すじ（鰭条）
  ctx.lineCap = 'round';
  for (let i = 0; i < rays.length; i++) {
    const r = rays[i];
    ctx.strokeStyle = rgba(edge, 0.75);
    ctx.lineWidth = spiny ? 1.9 : 1.1;
    ctx.beginPath();
    ctx.moveTo(r[0], r[1]);
    ctx.lineTo(r[2], r[3]);
    ctx.stroke();
    if (i < rays.length - 1) {
      const n = rays[i + 1];
      ctx.strokeStyle = rgba(edge, 0.3);
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo((r[0] + n[0]) / 2, (r[1] + n[1]) / 2);
      ctx.lineTo((r[2] + n[2]) / 2, (r[3] + n[3]) / 2);
      ctx.stroke();
    }
  }
  if (cooked) {
    // 焦げと、ふった塩
    for (let i = 0; i < 10; i++) {
      const a = rays[Math.floor(rnd() * rays.length)];
      const t = 0.55 + rnd() * 0.45;
      blob(ctx, lerp(a[0], a[2], t), lerp(a[1], a[3], t), 8 + rnd() * 14, 6 + rnd() * 10, '#23120a', 0.5);
    }
    for (let i = 0; i < 7 * rays.length; i++) {
      const a = rays[Math.floor(rnd() * rays.length)];
      const t = rnd();
      ctx.fillStyle = `rgba(255,252,244,${0.35 + rnd() * 0.55})`;
      ctx.beginPath();
      ctx.arc(lerp(a[0], a[2], t) + (rnd() - 0.5) * 8, lerp(a[1], a[3], t) + (rnd() - 0.5) * 8, 0.4 + rnd() * 1.1, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

// x の範囲に、背びれ・しりびれのすじを並べる
function raysAlong(g, from, to, count, side, height, lean) {
  const rays = [];
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0 : i / (count - 1);
    const x = lerp(from, to, t);
    const bx = g.px(x);
    const by = side < 0 ? g.upY(x) + 3 : g.lowY(x) - 3;
    const len = height(t) * g.L;
    rays.push([bx, by, bx + len * lean, by + side * len]);
  }
  return rays;
}

// 尾びれ。付け根から tips の点へ広げる
function tailRays(g, tipFn, count) {
  const rays = [];
  const baseX = g.px(1) - 4;
  const up = g.upY(1), low = g.lowY(1);
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const tip = tipFn(t);
    rays.push([baseX, lerp(up, low, t), tip[0], tip[1]]);
  }
  return rays;
}

function fanRays(cx, cy, from, to, count, length, wobble) {
  const rays = [];
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const a = lerp(from, to, t);
    const len = length * wobble(t);
    rays.push([cx, cy + t * 8, cx + Math.cos(a) * len, cy + Math.sin(a) * len]);
  }
  return rays;
}

function drawFishEye(ctx, g, cooked) {
  const x = g.px(g.eye[0]);
  const up = g.upY(g.eye[0]), low = g.lowY(g.eye[0]);
  const y = (up + low) / 2 + g.eye[1] * (low - up) / 2;
  const r = g.eyeR;
  if (cooked) {
    blob(ctx, x, y, r * 1.5, r * 1.5, '#2a160a', 0.7);
    const pale = ctx.createRadialGradient(x - r * 0.15, y - r * 0.2, 1, x, y, r * 0.78);
    pale.addColorStop(0, '#f4ecd9');
    pale.addColorStop(0.6, '#d8cbb0');
    pale.addColorStop(1, '#7c6548');
    ctx.fillStyle = pale;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.78, 0, TAU);
    ctx.fill();
    blob(ctx, x, y, r * 0.3, r * 0.3, '#6a5a44', 0.65);
    return;
  }
  // 目のまわりのくぼみ
  blob(ctx, x, y, r * 1.5, r * 1.5, '#10141c', 0.42);
  const iris = ctx.createRadialGradient(x, y, r * 0.4, x, y, r);
  if (g.id === 'kasago') {
    iris.addColorStop(0, '#b98745');
    iris.addColorStop(0.75, '#7a4326');
    iris.addColorStop(1, '#3a1b12');
  } else {
    iris.addColorStop(0, '#c8c4ae');
    iris.addColorStop(0.7, '#8d8768');
    iris.addColorStop(1, '#34332a');
  }
  ctx.fillStyle = iris;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  const pupil = ctx.createRadialGradient(x - r * 0.1, y - r * 0.1, 0, x, y, r * 0.7);
  pupil.addColorStop(0, '#1a2432');
  pupil.addColorStop(1, '#05070c');
  ctx.fillStyle = pupil;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.68, 0, TAU);
  ctx.fill();
  // 目の表面の光
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.36, r * 0.13, r * 0.08, -0.5, 0, TAU);
  ctx.fill();
  const film = ctx.createLinearGradient(x, y - r, x, y + r);
  film.addColorStop(0, 'rgba(255,255,255,0.2)');
  film.addColorStop(0.5, 'rgba(255,255,255,0)');
  film.addColorStop(1, 'rgba(190,210,230,0.24)');
  ctx.fillStyle = film;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

// 魚1匹を描く。cooked が true なら塩焼きにする
function paintFish(ctx, w, h, id, cooked = false) {
  const scale = w / 560;
  const g = fishGeometry(id);
  const cy = g.cy;
  const rnd = seeded(id.length * 211 + (cooked ? 7 : 0));
  const palette = {
    aji: { fin: '#8f9471', edge: '#4d5140', tail: '#b09c4d', tailEdge: '#544b24' },
    saba: { fin: '#3d5c68', edge: '#16242c', tail: '#2c4a58', tailEdge: '#0f1b22' },
    kasago: { fin: '#a84a2c', edge: '#4c2016', tail: '#993f26', tailEdge: '#3f1a12' },
  }[id];
  const baked = cooked ? { color: '#a06a30', edge: '#3a2110' } : null;
  const fin = (rays, tone, spiny, alpha) => drawFin(ctx, rays, {
    color: baked ? baked.color : tone[0],
    edge: baked ? baked.edge : tone[1],
    spiny, alpha, cooked, rnd,
  });
  const finTone = [palette.fin, palette.edge];
  const tailTone = [palette.tail, palette.tailEdge];

  ctx.save();
  ctx.scale(scale, scale);

  const L = g.L;
  const tailX = g.px(1);
  if (id === 'aji') {
    fin(tailRays(g, (t) => {
      const fork = Math.abs(t - 0.5) * 2;
      return [tailX + lerp(38, 108, Math.pow(fork, 1.2)), cy + (t - 0.5) * 2 * lerp(6, 74, Math.pow(fork, 0.85))];
    }, 18), tailTone);
    fin(raysAlong(g, 0.36, 0.5, 8, -1, (t) => 0.1 * (1 - t * 0.68) + 0.014, 0.42), finTone, true);
    fin(raysAlong(g, 0.53, 0.88, 26, -1, (t) => 0.07 * Math.pow(1 - t, 1.3) + 0.02, 0.36), finTone);
    fin(raysAlong(g, 0.57, 0.88, 22, 1, (t) => 0.06 * Math.pow(1 - t, 1.3) + 0.018, 0.36), finTone);
    fin(raysAlong(g, 0.3, 0.335, 5, 1, () => 0.05, 0.75), finTone);
  } else if (id === 'saba') {
    fin(tailRays(g, (t) => {
      const fork = Math.abs(t - 0.5) * 2;
      return [tailX + lerp(22, 92, Math.pow(fork, 1.1)), cy + (t - 0.5) * 2 * lerp(5, 66, fork)];
    }, 18), tailTone);
    fin(raysAlong(g, 0.33, 0.53, 10, -1, (t) => 0.062 * (1 - t * 0.55), 0.34), finTone, true);
    fin(raysAlong(g, 0.63, 0.73, 9, -1, (t) => 0.06 * (1 - t * 0.6), 0.5), finTone);
    fin(raysAlong(g, 0.66, 0.76, 9, 1, (t) => 0.056 * (1 - t * 0.6), 0.5), finTone);
    // 尾の近くに並ぶ小さなヒレ
    for (let i = 0; i < 5; i++) {
      const x = 0.76 + i * 0.05;
      fin(raysAlong(g, x, x + 0.03, 3, -1, () => 0.024, 0.9), finTone);
      fin(raysAlong(g, x + 0.012, x + 0.04, 3, 1, () => 0.024, 0.9), finTone);
    }
    fin(raysAlong(g, 0.28, 0.31, 5, 1, () => 0.05, 0.7), finTone);
  } else {
    fin(tailRays(g, (t) => {
      const a = lerp(-0.62, 0.62, t);
      return [tailX + Math.cos(a) * 92, cy + Math.sin(a) * 92];
    }, 16), tailTone);
    // とげの背びれ（12本）と、やわらかい後ろの背びれ
    fin(raysAlong(g, 0.26, 0.74, 12, -1, (t) => 0.13 - 0.03 * t + 0.008 * Math.sin(t * 19), 0.1), finTone, true, 0.9);
    fin(raysAlong(g, 0.76, 0.97, 13, -1, (t) => 0.125 * Math.sin(0.5 + t * 2.3), 0.34), finTone);
    fin(raysAlong(g, 0.74, 0.92, 11, 1, (t) => 0.135 * Math.sin(0.45 + t * 2.3), 0.3), finTone);
    fin(raysAlong(g, 0.34, 0.4, 6, 1, () => 0.1, 0.6), finTone);
  }

  ctx.drawImage(fishBodyCanvas(id, w, h, cooked), 0, 0, w / scale, h / scale);

  // 胸びれは体の上に乗る
  if (id === 'aji') {
    const bx = g.px(0.27), by = cy + 14;
    fin(fanRays(bx, by, -0.1, 0.32, 13, 0.25 * L, (t) => 1 - t * 0.55), finTone, false, cooked ? 0.4 : 0.7);
  } else if (id === 'saba') {
    const bx = g.px(0.245), by = cy + 2;
    fin(fanRays(bx, by, -0.1, 0.5, 11, 0.135 * L, (t) => 1 - t * 0.3), finTone, false, 0.74);
  } else {
    const bx = g.px(0.335), by = cy + 2;
    fin(fanRays(bx, by, -0.55, 1.05, 18, 0.26 * L, (t) => 0.86 + Math.sin(t * Math.PI) * 0.18), finTone, false, 0.92);
    if (!cooked) {
      ctx.save();
      for (let i = 0; i < 16; i++) {
        const a = lerp(-0.5, 1, rnd());
        const r = lerp(0.08, 0.24, rnd()) * L;
        blob(ctx, bx + Math.cos(a) * r, by + Math.sin(a) * r, 8 + rnd() * 6, 5 + rnd() * 5, '#3f1a12', 0.5);
      }
      ctx.restore();
    }
    // 頭のトゲ
    ctx.fillStyle = cooked ? '#4a2810' : '#5b2a1c';
    for (const [x, s, h2] of [[0.1, -0.86, 13], [0.16, -0.94, 15], [0.21, -0.97, 13], [0.26, -0.72, 13], [0.3, -0.42, 14], [0.32, -0.16, 12]]) {
      const bx2 = g.px(x), up = g.upY(x), low = g.lowY(x);
      const y = (up + low) / 2 + s * (low - up) / 2;
      ctx.beginPath();
      ctx.moveTo(bx2 - 5, y + 2);
      ctx.lineTo(bx2 + 7, y - h2);
      ctx.lineTo(bx2 + 6, y + 3);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 飾り包丁の切り目（焼いたときだけ）
  if (cooked) {
    ctx.save();
    fishOutline(ctx, g);
    ctx.clip();
    for (const x of [0.46, 0.6]) {
      const bx = g.px(x), mid = (g.upY(x) + g.lowY(x)) / 2 - 6;
      const half = (g.lowY(x) - g.upY(x)) * 0.3;
      ctx.save();
      ctx.translate(bx, mid);
      ctx.rotate(0.24);
      ctx.fillStyle = '#4a2711';
      ctx.beginPath();
      ctx.moveTo(0, -half);
      ctx.quadraticCurveTo(11, 0, 0, half);
      ctx.quadraticCurveTo(-10, 0, 0, -half);
      ctx.closePath();
      ctx.fill();
      const flesh = ctx.createLinearGradient(-6, 0, 7, 0);
      flesh.addColorStop(0, '#dfb67c');
      flesh.addColorStop(0.55, '#eedcbb');
      flesh.addColorStop(1, '#e6c38f');
      ctx.fillStyle = flesh;
      ctx.beginPath();
      ctx.moveTo(0, -half * 0.8);
      ctx.quadraticCurveTo(6.5, 0, 0, half * 0.8);
      ctx.quadraticCurveTo(-5, 0, 0, -half * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // 体にふった塩
    for (let i = 0; i < 240; i++) {
      const x = 0.04 + rnd() * 0.94;
      const y = lerp(g.upY(x), g.lowY(x), Math.pow(rnd(), 1.7));
      ctx.fillStyle = `rgba(255,254,248,${0.3 + rnd() * 0.5})`;
      ctx.beginPath();
      ctx.arc(g.px(x), y, 0.35 + rnd() * 0.75, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // 頭のつくり（ほおの線と鼻の穴）
  {
    const eyeX = g.px(g.eye[0]);
    const eyeUp = g.upY(g.eye[0]), eyeLow = g.lowY(g.eye[0]);
    const eyeY = (eyeUp + eyeLow) / 2 + g.eye[1] * (eyeLow - eyeUp) / 2;
    ctx.save();
    fishOutline(ctx, g);
    ctx.clip();
    ctx.strokeStyle = cooked ? 'rgba(50,26,10,0.32)' : 'rgba(30,36,44,0.22)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(eyeX + g.eyeR * 2.1, eyeY - g.eyeR * 0.3);
    ctx.quadraticCurveTo(eyeX + g.eyeR * 3.2, eyeY + g.eyeR * 2, eyeX + g.eyeR * 0.6, eyeY + g.eyeR * 3.1);
    ctx.stroke();
    blob(ctx, eyeX + g.eyeR * 1.2, eyeY + g.eyeR * 1.7, g.eyeR * 2, g.eyeR * 1.1, '#ffffff', cooked ? 0.06 : 0.14);
    ctx.fillStyle = 'rgba(14,16,20,0.55)';
    ctx.beginPath();
    ctx.ellipse(eyeX - g.eyeR * 1.45, eyeY + g.eyeR * 0.1, 1.8, 1.2, 0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 口
  const mouthEnd = id === 'kasago' ? 0.13 : id === 'saba' ? 0.085 : 0.08;
  const my = (g.upY(0.02) + g.lowY(0.02)) / 2 + (id === 'kasago' ? 4 : 2);
  ctx.strokeStyle = cooked ? 'rgba(36,18,8,0.8)' : 'rgba(24,24,30,0.72)';
  ctx.lineWidth = id === 'kasago' ? 3.2 : 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(g.px(0.004), my);
  ctx.quadraticCurveTo(g.px(mouthEnd * 0.55), my + (id === 'kasago' ? 14 : 7), g.px(mouthEnd), my + (id === 'kasago' ? 20 : 11));
  ctx.stroke();

  drawFishEye(ctx, g, cooked);
  ctx.restore();
}

function paintGlint(ctx, w, h) {
  blob(ctx, w / 2, h / 2, w / 2, h / 2, '#fff3d4', 1);
}

// 紙のざらつき
function paintGrain(ctx, w, h) {
  const rnd = seeded(5);
  const image = ctx.createImageData(w, h);
  for (let i = 0; i < image.data.length; i += 4) {
    const dark = rnd() < 0.5;
    image.data[i] = image.data[i + 1] = image.data[i + 2] = dark ? 40 : 255;
    image.data[i + 3] = Math.floor(rnd() * 22);
  }
  ctx.putImageData(image, 0, 0);
}

function paintButton(ctx, w, h) {
  const m = 14;
  const r = (h - m * 2) / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(26,40,80,0.35)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = COLOR.cream;
  ctx.beginPath();
  ctx.moveTo(m + r, m);
  ctx.lineTo(w - m - r, m);
  ctx.arc(w - m - r, h / 2, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(m + r, h - m);
  ctx.arc(m + r, h / 2, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ---------- 料理の絵 ---------- */

// 木のテーブル（低い解像度で作って広げ、奥がぼけたように見せる）
function paintTable(ctx, w, h) {
  const plank = 118;
  paintPixels(ctx, w, h, (x, y, o) => {
    const row = Math.floor(y / plank);
    const yy = y + row * 37;
    const warp = fbm(x * 0.006 + row * 9, yy * 0.05, 4);
    const ring = Math.sin(yy * 0.24 + warp * 22);
    const fine = fbm(x * 0.03 + row, yy * 0.8, 3);
    const tone = lerp(0.74, 1.08, hash2(row, 5));
    let c = lerp3([52, 30, 18], [122, 78, 46], clamp01(ring * 0.28 + 0.46 + (fine - 0.5) * 0.9));
    c = lerp3(c, [146, 96, 58], sstep(0.62, 0.84, fine) * 0.26);
    const seam = y - row * plank;
    const groove = Math.min(seam, plank - seam);
    const dark = lerp(0.3, 1, sstep(0, 2.4, groove));
    // 明かりは手前の真ん中に集まり、まわりは暗い
    const dx = (x / w - 0.5) * 1.3, dy = (y / h - 0.5) * 1.65;
    const lamp = 1.2 - sstep(0.12, 0.92, Math.sqrt(dx * dx + dy * dy)) * 0.95;
    o[0] = c[0] * tone * dark * lamp * 1.04;
    o[1] = c[1] * tone * dark * lamp * 0.97;
    o[2] = c[2] * tone * dark * lamp * 0.88;
  });
}

// 魚の絵の大きさ（写真も同じ大きさにそろえている）
const FISH_BAKE = { w: 840, h: 420 };

// 湯気のひとすじ。形がくずれながら上がる
function paintSteam(ctx, w, h) {
  paintPixels(ctx, w, h, (x, y, o) => {
    const v = 1 - y / h;
    const sway = Math.sin(v * 5.8) * 0.17 + (fbm(y * 0.012, 3, 2) - 0.5) * 0.26;
    const dx = (x / w - 0.5 - sway) / lerp(0.1, 0.26, v);
    const fall = Math.exp(-dx * dx) * sstep(0, 0.1, v) * sstep(1, 0.5, v);
    const n = fbm(x * 0.024, y * 0.018, 4);
    o[0] = 255; o[1] = 248; o[2] = 236;
    o[3] = 150 * fall * sstep(0.32, 0.72, n);
  });
}

/* ---------- 空と海 ---------- */

// 朝焼けの空（低い解像度で作って広げる。雲はやわらかいのでこれで十分）
function paintRealSky(ctx, w, h) {
  const stops = [
    [0, [34, 48, 104]], [0.32, [70, 84, 146]], [0.58, [146, 118, 164]],
    [0.78, [232, 148, 124]], [0.92, [252, 192, 134]], [1, [255, 226, 176]],
  ];
  const sunX = SUN_X / 2, sunY = h - 3;
  paintPixels(ctx, w, h, (x, y, o) => {
    const v = y / h;
    let c = stops[stops.length - 1][1];
    for (let i = 1; i < stops.length; i++) {
      if (v <= stops[i][0]) {
        c = lerp3(stops[i - 1][1], stops[i][1], (v - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
        break;
      }
    }
    const dx = (x - sunX) / w, dy = (y - sunY) / h;
    const dist2 = dx * dx * 2.2 + dy * dy;
    const glow = Math.exp(-dist2 * 9);
    c = lerp3(c, [255, 206, 142], glow * 0.72);

    // 雲。高いところは大きく、水平線に近いほど平たくつぶれて見える
    const depth = 1 / (1.07 - v);
    const cu = (x / w - 0.5) * depth * 1.5 + 2.7;
    const cv = Math.pow(depth, 0.72) * 2.8;
    const n = fbm(cu * 2.1, cv * 2.2, 5);
    const toward = fbm((cu + (sunX / w - x / w) * 0.2) * 2.1, (cv + 0.16) * 2.2, 5);
    const density = sstep(0.52, 0.76, n) * sstep(0, 0.2, v) * sstep(1, 0.8, v);
    if (density > 0) {
      const lit = clamp01((toward - n) * 5 + 0.62 + glow * 0.5);
      const shadowTone = lerp3([56, 58, 112], [146, 98, 128], v);
      const lightTone = lerp3([232, 158, 166], [255, 196, 140], sstep(0.45, 0.95, v));
      c = lerp3(c, lerp3(shadowTone, lightTone, lit), density * 0.92);
    }

    // 太陽
    const sx = x - sunX, sy = y - sunY;
    const sunD = Math.sqrt(sx * sx + sy * sy);
    c = lerp3(c, [255, 246, 214], sstep(23, 19, sunD));

    // 遠くの山
    const ground = h - (fbm(x * 0.022, 3.3, 4) * 62 + 6) * sstep(0.56, 0.02, x / w);
    if (y > ground - 1) {
      const mist = sstep(ground, h, y);
      c = lerp3(c, lerp3([74, 68, 112], [196, 142, 136], mist * 0.7), clamp01(y - ground + 1));
    }
    o[0] = c[0]; o[1] = c[1]; o[2] = c[2];
  });
}

// 海。波の高さから1点ずつ面の向きを出して、空の映り込みと日の光を計算する
const SEA_SHADER = `
precision highp float;
uniform vec2 resolution;
uniform float uT;
uniform float uSunX;
varying vec2 fragCoord;

const float CAM = 9.0;
const float VIEW = 0.5;

vec3 skyColor(vec3 r, vec3 sun) {
  float e = clamp(r.y, 0.0, 1.0);
  vec3 c = mix(vec3(1.0, 0.72, 0.46), vec3(0.88, 0.50, 0.48), smoothstep(0.0, 0.13, e));
  c = mix(c, vec3(0.42, 0.38, 0.62), smoothstep(0.1, 0.36, e));
  c = mix(c, vec3(0.14, 0.20, 0.42), smoothstep(0.3, 0.85, e));
  float g = max(dot(r, sun), 0.0);
  c += vec3(1.0, 0.6, 0.3) * (pow(g, 8.0) * 0.32 + pow(g, 90.0) * 0.5);
  return c;
}

// 向きの違う波を重ねる。とがった山と広い谷にして、前の波で次の波の場所をずらす
void waves(vec2 p, float foot, float t, out float h, out vec2 g) {
  float freq = 0.42, amp = 0.34, speed = 0.9;
  h = 0.0;
  g = vec2(0.0);
  for (int i = 0; i < 16; i++) {
    float angle = 0.5 + sin(float(i) * 2.4) * (0.55 + float(i) * 0.05);
    vec2 d = vec2(sin(angle), cos(angle));
    float x = dot(d, p) * freq + t * speed + float(i) * 1.7;
    float w = exp(sin(x) - 1.0);
    float dw = w * cos(x);
    float keep = 1.0 - smoothstep(0.5, 1.6, freq * foot);
    h += w * amp * keep;
    g += d * dw * freq * amp * keep;
    p -= d * dw * amp * 0.22;
    freq *= 1.26;
    amp *= 0.83;
    speed *= 1.09;
  }
}

vec3 toneMap(vec3 c) {
  return clamp((c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = fragCoord / resolution;
  float v = 1.0 - uv.y;
  float aspect = resolution.x / resolution.y;
  vec3 rd = normalize(vec3((uv.x - 0.5) * aspect * VIEW, -(v * VIEW + 0.002), 1.0));
  vec3 sun = normalize(vec3((uSunX - 0.5) * aspect * VIEW, 0.012, 1.0));

  float dist = CAM / -rd.y;
  vec2 p = rd.xz * dist;
  float foot = dist * dist * VIEW / (resolution.y * CAM) + dist * VIEW / resolution.y;

  float h;
  vec2 g;
  waves(p, foot, uT, h, g);
  vec3 n = normalize(vec3(-g.x * 0.62, 1.0, -g.y * 0.62));
  if (n.y < 0.0) n.y = -n.y;

  vec3 r = reflect(rd, n);
  r.y = abs(r.y);
  float fres = 0.02 + 0.98 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);

  vec3 reflected = skyColor(r, sun);
  // 水の色。波の山は光が透けて少し青緑になる
  vec3 water = mix(vec3(0.012, 0.055, 0.105), vec3(0.03, 0.17, 0.20), smoothstep(0.3, 1.5, h));
  vec3 c = mix(water, reflected, min(fres * 1.15, 1.0));

  // 日の光。遠くは面がならされるので、光の道を広くする
  float far = smoothstep(25.0, 500.0, dist);
  float power = mix(520.0, 46.0, far);
  float sp = pow(max(dot(r, sun), 0.0), power);
  c += vec3(1.0, 0.72, 0.42) * sp * mix(5.0, 1.6, far);

  // 波がくずれて白くなるところ
  float foam = smoothstep(1.75, 2.35, h + 0.3 * sin(p.x * 1.3 + p.y * 1.7)) * (1.0 - far);
  c = mix(c, vec3(0.86, 0.80, 0.76), foam * 0.5);

  // 遠くはかすんで、水平線の空の色に溶ける
  float haze = 1.0 - exp(-dist * 0.0028);
  c = mix(c, vec3(1.0, 0.70, 0.46) * 0.96, haze * 0.82);

  gl_FragColor = vec4(toneMap(c * 1.05), 1.0);
}
`;

// 海と空の背景を作る。2つの画面で同じものを使う
const WAVE_LAYERS = [
  { key: 'wave1', from: 0.02, size: 0.36, top: '#f4cdb0', deep: '#c9abbb', amp: 7,  speed: 0.006,  bob: 3 },
  { key: 'wave2', from: 0.12, size: 0.42, top: '#c7a9c0', deep: '#94a0bf', amp: 11, speed: -0.009, bob: 5 },
  { key: 'wave3', from: 0.30, size: 0.48, top: '#90a3c2', deep: '#5f80a8', amp: 16, speed: 0.013,  bob: 8 },
  { key: 'wave4', from: 0.52, size: 0.48, top: '#6189ad', deep: '#3e6a92', amp: 22, speed: -0.018, bob: 11 },
  { key: 'wave5', from: 0.76, size: 0.34, top: '#47769c', deep: '#2b5277', amp: 28, speed: 0.026,  bob: 14 },
];

function createDawn(scene) {
  // 光の計算ができる端末では、写実の海にする
  if (scene.sys.game.renderer.type === Phaser.WEBGL) {
    bake(scene, 'real-sky', Math.round(W / 2), Math.round(HORIZON / 2), paintRealSky);
    scene.add.image(0, 0, 'real-sky').setOrigin(0).setDepth(0).setDisplaySize(W, HORIZON);
    if (!scene.cache.shader.exists('sea')) {
      scene.cache.shader.add('sea', new Phaser.Display.BaseShader('sea', SEA_SHADER, undefined, {
        uT: { type: '1f', value: 0 },
        uSunX: { type: '1f', value: SUN_X / W },
      }));
    }
    const sea = scene.add.shader('sea', 0, HORIZON, W, SEA_H).setOrigin(0).setDepth(1);
    const speed = REDUCE_MOTION ? 0.15 : 1;
    return {
      real: true,
      update(time) { sea.setUniform('uT.value', (time * 0.001 * speed) % 3600); },
    };
  }

  bake(scene, 'dawn', W, H, paintDawn);
  scene.add.image(0, 0, 'dawn').setOrigin(0).setDepth(0);

  const depths = [1, 2, 4, 7, 8];
  const waves = WAVE_LAYERS.map((layer, i) => {
    const height = Math.round(SEA_H * layer.size) + 60;
    bake(scene, layer.key, W * 2, height, (ctx, w, h) =>
      paintWave(ctx, w, h, 31 + i * 7, layer.top, layer.deep, layer.amp));
    const y = HORIZON + SEA_H * layer.from - layer.amp;
    const image = scene.add.image(0, y, layer.key).setOrigin(0).setDepth(depths[i]);
    return { image, y, layer, phase: i * 1.7 };
  });

  bake(scene, 'grain', 256, 256, paintGrain);
  scene.add.tileSprite(0, 0, W, H, 'grain').setOrigin(0).setDepth(50).setTileScale(2);

  const pace = REDUCE_MOTION ? 0.15 : 1;
  return {
    update(time) {
      for (const wave of waves) {
        const shift = ((time * wave.layer.speed * pace) % W + W) % W;
        wave.image.x = -shift;
        wave.image.y = wave.y + Math.sin(time * 0.0009 * pace + wave.phase) * wave.layer.bob;
      }
    },
  };
}

// 丸いボタン。押すと少し沈む
function createButton(scene, x, y, label, onPress, fontSize = 50) {
  bake(scene, 'button', 420, 136, paintButton);
  const box = scene.add.container(x, y).setDepth(40);
  box.add(scene.add.image(0, 0, 'button'));
  box.add(scene.add.text(0, -2, label, {
    fontFamily: FONT_BODY, fontSize: `${fontSize}px`, fontStyle: 'bold', color: COLOR.ink,
  }).setOrigin(0.5));
  box.setSize(420, 136);
  box.setInteractive({ useHandCursor: true });
  box.on('pointerdown', () => box.setScale(0.96));
  box.on('pointerout', () => box.setScale(1));
  box.on('pointerup', () => {
    box.setScale(1);
    Sound.unlock();
    onPress();
  });
  return box;
}

// 文字だけの小さいボタン（「港へ」「音」など）
function createTextButton(scene, x, y, label, onPress, originX = 0) {
  const text = scene.add.text(x, y, label, {
    fontFamily: FONT_BODY, fontSize: '30px', color: COLOR.cream, padding: { x: 14, y: 12 },
  }).setOrigin(originX, 0.5).setDepth(45).setShadow(0, 2, 'rgba(40,44,96,0.5)', 6);
  text.setInteractive({ useHandCursor: true });
  text.on('pointerup', () => {
    Sound.unlock();
    onPress(text);
  });
  return text;
}

// 横に2つ並べられる小さめのボタン
function createSmallButton(scene, x, y, label, onPress, fontSize = 34) {
  bake(scene, 'button-s', 360, 108, paintButton);
  const box = scene.add.container(x, y).setDepth(40);
  box.add(scene.add.image(0, 0, 'button-s'));
  box.label = scene.add.text(0, -2, label, {
    fontFamily: FONT_BODY, fontSize: `${fontSize}px`, fontStyle: 'bold', color: COLOR.ink,
  }).setOrigin(0.5);
  box.add(box.label);
  box.setSize(360, 108);
  box.setInteractive({ useHandCursor: true });
  box.on('pointerdown', () => box.setScale(0.96));
  box.on('pointerout', () => box.setScale(1));
  box.on('pointerup', () => {
    box.setScale(1);
    Sound.unlock();
    onPress();
  });
  return box;
}

// 図鑑のごほうびを、画面の上に少しのあいだ出す
function rewardToast(scene, notes) {
  if (!notes || !notes.length) return;
  if (scene.toast) scene.toast.destroy();
  const text = scene.add.text(W / 2, Math.round(H * 0.075) + 56, notes.join('\n'), {
    fontFamily: FONT_BODY, fontSize: '32px', fontStyle: 'bold', color: '#ffe0a6', align: 'center',
    backgroundColor: 'rgba(20,28,60,0.88)', padding: { x: 24, y: 14 }, lineSpacing: 8,
  }).setOrigin(0.5, 0).setDepth(90);
  scene.toast = text;
  scene.tweens.add({ targets: text, alpha: 0, delay: 2800, duration: 500, onComplete: () => text.destroy() });
}

function changeScene(scene, nextKey, data) {
  scene.cameras.main.fadeOut(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
  scene.cameras.main.once('camerafadeoutcomplete', () => scene.scene.start(nextKey, data));
}

// 投げた距離（0〜1くらい）を、画面の海の上の場所に直す。遠いほど上で小さい
function waterPoint(d) {
  const t = Math.min(1.15, Math.max(0, d));
  return { x: 470 + t * 150, y: HORIZON + SEA_H * (0.55 - 0.45 * t), scale: 1.15 - 0.6 * t };
}

// 投げた距離に合う魚が来やすいように、くじを引く
function pickFish(d) {
  const list = window.fishData.fish;
  const weights = list.map((f) => (d >= f.game.bestRange[0] && d <= f.game.bestRange[1] ? 1 : 0.15));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
}

// Phaser が読み込めなかったときに止まらないよう、起動の中で画面を組み立てる
function makeScenes() {

class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }

  create() {
    this.leaving = false;
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 400, 60, 71, 112);
    this.dawn = createDawn(this);

    // 太陽のきらめき
    bake(this, 'glint', 44, 8, paintGlint);
    const rnd = seeded(47);
    this.glints = Array.from({ length: this.dawn.real ? 0 : 36 }, () => {
      const t = rnd();
      const spread = (rnd() + rnd() - 1) * (30 + t * 150);
      const image = this.add.image(SUN_X + spread, HORIZON + 14 + t * SEA_H * 0.42, 'glint')
        .setDepth(3)
        .setScale(0.6 + t * 0.9, 1);
      return { image, speed: 0.0012 + rnd() * 0.002, phase: rnd() * TAU };
    });

    // 堤防と釣り人、ウキと糸
    bake(this, 'shore', W, 500, paintShore);
    this.add.image(0, SHORE_TOP, 'shore').setOrigin(0).setDepth(5);
    bake(this, 'float', 26, 56, paintFloat);
    this.float = this.add.image(Math.round(W * 0.76), HORIZON + SEA_H * 0.3, 'float').setDepth(6);
    this.floatY = this.float.y;
    this.line = this.add.graphics().setDepth(6);

    // カモメ
    bake(this, 'gull', 84, 34, paintGull);
    this.gulls = [
      { x: 180, y: H * 0.46, scale: 0.7, speed: 0.014, phase: 0 },
      { x: 300, y: H * 0.43, scale: 0.5, speed: 0.012, phase: 1.3 },
      { x: 660, y: H * 0.5, scale: 0.42, speed: 0.009, phase: 2.2 },
    ].map((gull) => ({ ...gull, image: this.add.image(gull.x, gull.y, 'gull').setDepth(9) }));

    this.addVerticalTitle();

    createButton(this, W / 2, Math.round(H * 0.875), 'はじめる', () => this.start());

    const plays = Save.data.plays;
    if (plays > 0) {
      this.add.text(W / 2, Math.round(H * 0.875) + 96, `これまでに ${plays}回、海へ行きました`, {
        fontFamily: FONT_BODY, fontSize: '26px', color: COLOR.cream,
      }).setOrigin(0.5).setDepth(40);
    }
    this.add.text(W - 22, H - 18, Save.available ? GAME_VERSION : `${GAME_VERSION} 保存オフ`, {
      fontFamily: FONT_BODY, fontSize: '20px', color: COLOR.cream,
    }).setOrigin(1, 1).setAlpha(0.65).setDepth(40);
    this.add.text(22, H - 18, '魚と料理の絵はAIで作成しました', {
      fontFamily: FONT_BODY, fontSize: '22px', color: COLOR.cream,
    }).setOrigin(0, 1).setAlpha(0.65).setDepth(40);

    this.input.keyboard.once('keydown-ENTER', () => this.start());
  }

  // 題字を、右から左へ縦書きで並べる
  addVerticalTitle() {
    const size = 112;
    const pitch = 122;
    const columns = [
      { text: 'つって', x: W * 0.76, y: H * 0.075 },
      { text: 'さばいて', x: W * 0.5, y: H * 0.075 + 66 },
      { text: 'たべる', x: W * 0.24, y: H * 0.075 + 190 },
    ];
    let order = 0;
    for (const column of columns) {
      [...column.text].forEach((char, i) => {
        // 小さい「っ」は、縦書きでは右上に寄せる
        const small = 'っゃゅょぁぃぅぇぉ'.includes(char);
        const x = column.x + (small ? size * 0.14 : 0);
        const y = column.y + i * pitch - (small ? size * 0.14 : 0);
        const glyph = this.add.text(x, y, char, {
          fontFamily: FONT_TITLE, fontSize: `${size}px`, fontStyle: '600', color: COLOR.cream,
          padding: { x: 14, y: 14 },
        }).setOrigin(0.5).setDepth(30).setShadow(0, 3, 'rgba(40,44,96,0.45)', 12);
        if (!REDUCE_MOTION) {
          glyph.setAlpha(0);
          this.tweens.add({ targets: glyph, alpha: 1, duration: 620, delay: 220 + order * 90, ease: 'Sine.easeOut' });
        }
        order += 1;
      });
    }
  }

  start() {
    if (this.leaving) return;
    this.leaving = true;
    Save.data.plays += 1;
    Save.commit();
    changeScene(this, 'Harbor');
  }

  update(time) {
    this.dawn.update(time);
    const pace = REDUCE_MOTION ? 0.15 : 1;

    for (const glint of this.glints) {
      glint.image.setAlpha(0.2 + 0.7 * Math.abs(Math.sin(time * glint.speed * pace + glint.phase)));
    }

    this.float.y = this.floatY + Math.sin(time * 0.0016 * pace) * 6;
    this.line.clear();
    this.line.lineStyle(1.5, 0x3b3f63, 0.55);
    this.line.lineBetween(ROD_TIP.x, ROD_TIP.y, this.float.x, this.float.y - 26);

    for (const gull of this.gulls) {
      gull.x += gull.speed * this.game.loop.delta * pace;
      if (gull.x > W + 80) gull.x = -80;
      gull.image.x = gull.x;
      gull.image.setScale(gull.scale, gull.scale * (0.7 + 0.35 * Math.sin(time * 0.004 * pace + gull.phase)));
    }
  }
}

    this.keepButton.label.setText(`冷蔵庫（${Keep.items().length}）`);
    const worry = Keep.worryCount();

      if (this.leaving) return;
      this.leaving = true;

        fish, sizeCm: item.sizeCm, weight: item.weight, fresh: info.fresh,
        days: info.days, frozen: info.frozen, stockId: item.id,
