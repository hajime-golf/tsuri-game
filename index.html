/* ---------- 写実の絵のための道具 ---------- */
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function sstep(a, b, v) { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerp3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// 同じ場所なら毎回同じ値になる、なめらかなでこぼこ
function hash2(ix, iy) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx);
  fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function fbm(x, y, octaves) {
  let sum = 0, amp = 0.5, total = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * vnoise(x, y);
    total += amp;
    x = x * 2.03 + 17.1;
    y = y * 2.03 - 9.7;
    amp *= 0.5;
  }
  return sum / total;
}

// 1点ずつ色を計算して描く。shade(x, y, out) が out に [赤, 緑, 青, 不透明度] を入れる
function paintPixels(ctx, w, h, shade) {
  const image = ctx.createImageData(w, h);
  const data = image.data;
  const out = [0, 0, 0, 255];
  let i = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      out[3] = 255;
      shade(x, y, out);
      data[i++] = out[0];
      data[i++] = out[1];
      data[i++] = out[2];
      data[i++] = out[3];
    }
  }
  ctx.putImageData(image, 0, 0);
}

function offscreen(w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  return canvas;
}

// 点の列を通る、なめらかな線を作る
function curveFrom(points) {
  const n = points.length;
  const slope = (i) => {
    const a = points[Math.max(0, i - 1)], b = points[Math.min(n - 1, i + 1)];
    return (b[1] - a[1]) / (b[0] - a[0]);
  };
  return (x) => {
    const v = Math.min(points[n - 1][0], Math.max(points[0][0], x));
    let i = 0;
    while (i < n - 2 && v > points[i + 1][0]) i++;
    const [x0, y0] = points[i];
    const [x1, y1] = points[i + 1];
    const d = x1 - x0, t = (v - x0) / d, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * d * slope(i)
      + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * d * slope(i + 1);
  };
}

/* ---------- 魚の絵 ---------- */

// 魚の形。x は口先0〜尾の付け根1、top と bot は体の中心線から背中・おなかまでの高さ（体長に対する割合）
const FISH_SHAPE = {
  // マアジ：先のとがった平たい体で、尾の付け根がとても細い
  aji: {
    x0: 22, L: 418, gill: 0.265, eye: [0.105, -0.28], eyeR: 12.5,
    top: [[0, 0], [0.03, 0.052], [0.1, 0.108], [0.2, 0.142], [0.3, 0.152], [0.45, 0.142], [0.6, 0.108], [0.75, 0.062], [0.88, 0.028], [1, 0.022]],
    bot: [[0, 0], [0.03, 0.03], [0.1, 0.076], [0.2, 0.122], [0.3, 0.138], [0.45, 0.132], [0.6, 0.102], [0.75, 0.06], [0.88, 0.028], [1, 0.022]],
  },
  // マサバ：太い魚雷の形
  saba: {
    x0: 22, L: 430, gill: 0.235, eye: [0.095, -0.22], eyeR: 12.5,
    top: [[0, 0], [0.03, 0.034], [0.1, 0.082], [0.2, 0.114], [0.32, 0.127], [0.5, 0.117], [0.7, 0.082], [0.88, 0.034], [1, 0.022]],
    bot: [[0, 0], [0.03, 0.03], [0.1, 0.072], [0.2, 0.102], [0.32, 0.116], [0.5, 0.11], [0.7, 0.076], [0.88, 0.032], [1, 0.022]],
  },
  // カサゴ：頭が大きく、尾の付け根が太い
  kasago: {
    x0: 26, L: 392, gill: 0.33, eye: [0.135, -0.5], eyeR: 15,
    top: [[0, 0], [0.02, 0.05], [0.08, 0.128], [0.18, 0.178], [0.3, 0.192], [0.45, 0.178], [0.6, 0.142], [0.75, 0.108], [0.9, 0.088], [1, 0.082]],
    bot: [[0, 0.01], [0.02, 0.058], [0.08, 0.1], [0.18, 0.138], [0.3, 0.155], [0.45, 0.148], [0.6, 0.114], [0.75, 0.088], [0.9, 0.072], [1, 0.068]],
  },
};

function fishGeometry(id) {
  const shape = FISH_SHAPE[id] || FISH_SHAPE.aji;
  const top = curveFrom(shape.top);
  const bot = curveFrom(shape.bot);
  const cy = 140;
  return {
    ...shape, id, cy,
    px: (x) => shape.x0 + x * shape.L,
    upY: (x) => cy - top(x) * shape.L,
    lowY: (x) => cy + bot(x) * shape.L,
  };
}

// 体の輪かくの線
function fishOutline(ctx, g) {
  ctx.beginPath();
  ctx.moveTo(g.px(0), g.upY(0));
  for (let x = 0.01; x <= 1.0001; x += 0.01) ctx.lineTo(g.px(x), g.upY(x));
  for (let x = 1; x >= 0; x -= 0.01) ctx.lineTo(g.px(x), g.lowY(x));
  ctx.closePath();
}

// 各魚の、生のときの体の色
function rawFishColor(id, g, x, s, bx, half) {
  if (id === 'aji') {
    const n = fbm(bx * 0.02, s * 2.2, 3);
    let c = lerp3([44, 74, 78], [186, 196, 188], sstep(-0.9, -0.08, s + (n - 0.5) * 0.2));
    c = lerp3(c, [240, 240, 232], sstep(-0.1, 0.62, s));
    // 体の横に、うっすら黄金色の帯
    const band = Math.exp(-Math.pow((s + 0.16) / 0.24, 2)) * 0.5;
    c = lerp3(c, [204, 176, 92], band);
    // ぜいご（尾に向かう、とげのあるうろこの列）
    const line = lerp(-0.46, -0.03, sstep(0.3, 0.62, x));
    if (x > g.gill + 0.02) {
      const dy = Math.abs((s - line) * half);
      const height = lerp(2, 8.5, sstep(0.42, 0.72, x)) * (1 - sstep(0.93, 1, x) * 0.4);
      const period = lerp(6, 11, sstep(0.4, 0.8, x));
      const u = (bx / period) % 1;
      const shield = dy / height + Math.abs(u - 0.5) * 0.85;
      if (shield < 1) {
        const face = lerp3([214, 208, 180], [108, 98, 78], u);
        c = lerp3(c, face, sstep(1, 0.72, shield) * lerp(0.28, 0.7, sstep(0.42, 0.7, x)));
      }
    }
    // エラの上の黒い点
    const sx = (x - (g.gill - 0.012)) / 0.024, sy = (s + 0.62) / 0.14;
    c = lerp3(c, [20, 24, 28], sstep(1.2, 0.5, sx * sx + sy * sy) * 0.92);
    return c;
  }
  if (id === 'saba') {
    const n = fbm(bx * 0.018 + 3, s * 2, 3);
    let c = lerp3([22, 82, 104], [42, 118, 124], n);
    c = lerp3(c, [204, 212, 212], sstep(-0.16, 0.26, s + (n - 0.5) * 0.12));
    c = lerp3(c, [246, 244, 238], sstep(0.2, 0.75, s));
    // 背中の、くねくねした黒い模様
    if (s < 0.08 && x > g.gill - 0.04) {
      const warp = fbm(x * 12, s * 4 + 5, 3);
      const wave = Math.sin(x * 92 + warp * 13 + s * 11);
      const zone = sstep(0.06, -0.3, s);
      c = lerp3(c, [12, 30, 40], sstep(0.05, 0.55, wave) * zone * 0.95);
    }
    // おなかのピンクがかった光
    c = lerp3(c, [236, 196, 200], Math.exp(-Math.pow((s - 0.34) / 0.2, 2)) * 0.2 * n * 2);
    return c;
  }
  // カサゴ：赤茶色で、暗い帯とまだら、小さな白い点
  const n = fbm(bx * 0.03, s * 3 + 8, 4);
  let c = lerp3([150, 62, 40], [108, 44, 30], n);
  c = lerp3(c, [226, 164, 124], sstep(0.12, 0.92, s + (n - 0.5) * 0.3));
  let bar = 0;
  for (const center of [0.36, 0.5, 0.64, 0.78, 0.93]) {
    bar += Math.exp(-Math.pow((x - center + (fbm(s * 3, center * 20, 3) - 0.5) * 0.09) / 0.042, 2));
  }
  c = lerp3(c, [48, 22, 18], clamp01(bar) * sstep(0.62, -0.2, s) * 0.86);
  const blotch = sstep(0.54, 0.74, fbm(bx * 0.075, s * half * 0.075 + 4, 3));
  c = lerp3(c, [64, 28, 20], blotch * sstep(0.7, -0.1, s) * 0.5);
  const cellX = Math.floor(bx / 13), cellY = Math.floor((s * half) / 13);
  if (hash2(cellX + 3, cellY) > 0.86 && s < 0.5) {
    const px = bx / 13 - cellX - 0.5 + (hash2(cellX, cellY + 2) - 0.5) * 0.5;
    const py = (s * half) / 13 - cellY - 0.5 + (hash2(cellX + 9, cellY) - 0.5) * 0.5;
    const size = 0.02 + hash2(cellX, cellY) * 0.05;
    c = lerp3(c, [222, 190, 158], sstep(size, size * 0.4, px * px + py * py) * 0.55);
  }
  return c;
}

// 焼いたときの体の色
const ROAST_RAMP = [
  [0, [240, 196, 116]],
  [0.36, [205, 138, 58]],
  [0.64, [128, 72, 28]],
  [0.86, [58, 32, 16]],
  [1, [26, 16, 10]],
];
function roastColor(v) {
  for (let i = 1; i < ROAST_RAMP.length; i++) {
    if (v <= ROAST_RAMP[i][0]) {
      const [a, ca] = ROAST_RAMP[i - 1], [b, cb] = ROAST_RAMP[i];
      return lerp3(ca, cb, (v - a) / (b - a));
    }
  }
  return ROAST_RAMP[ROAST_RAMP.length - 1][1];
}

function grilledFishColor(id, g, x, s, bx, by, raw) {
  const rough = fbm(bx * 0.04, by * 0.06, 4);
  // 網の焦げ目は、まっすぐでなく、ところどころ途切れる
  const grid = (bx * 0.0165 + s * 0.14 + (rough - 0.5) * 0.3) % 1;
  const mark = Math.exp(-Math.pow((grid - 0.5) / 0.075, 2)) * sstep(0.34, 0.5, fbm(by * 0.03, bx * 0.012, 2));
  let burn = 0.1 + sstep(0.55, -0.85, s) * 0.34 + (rough - 0.42) * 1.05 + mark * 0.62;
  burn += sstep(0.13, 0.02, x) * 0.32;                   // 顔のあたりはよく焼ける
  burn += sstep(0.82, 1, x) * 0.18;
  // 生のときの模様は、焼いても少し残る
  const rawLum = (raw[0] + raw[1] + raw[2]) / 765;
  burn += (0.55 - rawLum) * 0.34;
  let c = roastColor(clamp01(burn));
  c = lerp3(c, [188, 170, 142], 0.3 * (1 - clamp01(burn)));
  if (id === 'kasago') c = lerp3(c, [168, 74, 40], 0.22);
  // 皮がふくらんだところ
  const bumpX = bx * 0.2, bumpY = by * 0.2;
  const bump = vnoise(bumpX, bumpY);
  if (bump > 0.7) c = lerp3(c, [248, 208, 140], sstep(0.7, 0.86, bump) * 0.65);
  else if (bump < 0.22) c = lerp3(c, [60, 32, 14], sstep(0.22, 0.08, bump) * 0.55);
  return c;
}

function fishBodyCanvas(id, w, h, cooked) {
  const scale = w / 560;
  const g = fishGeometry(id);
  const canvas = offscreen(w, h);
  const scaleFreq = id === 'kasago' ? 0.5 : id === 'saba' ? 1.1 : 0.82;

  paintPixels(canvas.getContext('2d'), w, h, (px, py, o) => {
    const bx = px / scale, by = py / scale;
    const x = (bx - g.x0) / g.L;
    if (x <= 0 || x >= 1.012) { o[3] = 0; return; }
    const up = g.upY(x), low = g.lowY(x);
    const half = (low - up) / 2;
    if (half <= 0.2) { o[3] = 0; return; }
    const s = (by - (up + low) / 2) / half;
    const edge = (1 - Math.abs(s)) * half * scale;
    if (edge <= -0.5) { o[3] = 0; return; }

    const raw = rawFishColor(id, g, x, s, bx, half);
    let c = cooked ? grilledFishColor(id, g, x, s, bx, by, raw) : raw;

    // 体の丸みに合わせた明るさ。上から光が当たる
    const round = Math.sqrt(Math.max(0, 1 - s * s));
    let light = 0.42 + 0.72 * clamp01(round * 0.72 - s * 0.42);

    // エラぶたのふち
    const gillAt = g.gill - 0.05 * s * s;
    const fromGill = x - gillAt;
    if (fromGill < 0) {
      if (fromGill > -0.016) light *= lerp(0.62, 1, sstep(0, -0.016, fromGill));
      if (id === 'kasago') {
        c = lerp3(c, [44, 20, 16], sstep(0.5, 0.74, fbm(bx * 0.09, by * 0.09, 3)) * 0.55);
      }
    } else if (!cooked || id === 'kasago') {
      // うろこ。光の当たり方でチラチラする
      const size = id === 'kasago' ? 8.5 : id === 'saba' ? 3.2 : 4.2;
      const v = (s * half) / size + fbm(bx * 0.02, by * 0.02, 2) * 0.8;
      const row = Math.floor(v);
      const u = bx / (size * 1.25) + (row % 2) * 0.5;
      const cell = Math.floor(u);
      const fu = u - cell - 0.5, fv = v - row - 0.5;
      // うろこ1枚の後ろのふちだけ、うすく影を落とす
      const rim = sstep(0.05, 0.42, fu + fv * fv * 0.9);
      const strength = id === 'kasago' ? 0.2 : 0.07;
      light *= 1 - rim * (cooked ? strength * 0.3 : strength);
      if (!cooked) {
        const glitter = hash2(cell, row * 7);
        const band = clamp01(1 - Math.abs(s + 0.08) * 1.25);
        if (glitter > 0.7) c = lerp3(c, [255, 255, 248], (glitter - 0.7) * (id === 'kasago' ? 0.2 : 1.3) * band);
      }
    }

    // 銀色の体に映り込む、長くのびた濃淡
    if (!cooked && id !== 'kasago') {
      const streak = fbm(bx * 0.009 + 5, s * 5.5, 3);
      light *= 0.82 + streak * 0.42;
    }

    // 虹色の光（生の魚のぬめりと銀色）
    if (!cooked && id !== 'kasago') {
      const tint = fbm(bx * 0.012 + 40, by * 0.02, 2);
      c = lerp3(c, tint > 0.5 ? [150, 210, 214] : [226, 186, 214], Math.abs(tint - 0.5) * 0.7 * clamp01(1 - Math.abs(s)));
    }

    o[0] = c[0] * light;
    o[1] = c[1] * light;
    o[2] = c[2] * light;

    // 背中側に細く走る光
    const specBand = Math.exp(-Math.pow((s + 0.42) / 0.13, 2));
    const specNoise = fbm(bx * 0.05 + 11, by * 0.05, 2);
    const spec = specBand * (cooked ? 0.1 + specNoise * 0.3 : id === 'kasago' ? 0.14 : 0.42) * 255 * (cooked ? 0.42 : 0.6);
    o[0] += spec;
    o[1] += spec * 0.95;
    o[2] += spec * (cooked ? 0.72 : 0.92);

    o[3] = 255 * clamp01(edge + 0.5) * clamp01((1.012 - x) * g.L * scale * 0.4);
  });
  return canvas;
}

// ヒレ1枚。rays は [付け根x, 付け根y, 先x, 先y] の列
function drawFin(ctx, rays, opts) {
  const { color, edge, alpha = 0.86, spiny = false, cooked = false, rnd } = opts;
  const first = rays[0], last = rays[rays.length - 1];
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(first[0], first[1]);
  ctx.lineTo(first[2], first[3]);
  for (let i = 1; i < rays.length; i++) {
    const a = rays[i - 1], b = rays[i];
    if (spiny) {
      // トゲとトゲの間の膜は、内側にくぼむ
      ctx.quadraticCurveTo((a[2] + b[2] + a[0] + b[0]) / 4, lerp((a[3] + b[3]) / 2, (a[1] + b[1]) / 2, 0.42), b[2], b[3]);
    } else {
      ctx.lineTo(b[2], b[3]);
    }
  }
  ctx.lineTo(last[0], last[1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(first[0], first[1], first[2], first[3]);
  g.addColorStop(0, rgba(color, Math.min(1, alpha + 0.1)));
  g.addColorStop(1, rgba(edge, alpha * 0.82));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.clip();
  // すじ（鰭条）
  ctx.lineCap = 'round';
  for (let i = 0; i < rays.length; i++) {
    const r = rays[i];
    ctx.strokeStyle = rgba(edge, 0.75);
    ctx.lineWidth = spiny ? 1.9 : 1.1;
    ctx.beginPath();
    ctx.moveTo(r[0], r[1]);
    ctx.lineTo(r[2], r[3]);
    ctx.stroke();
    if (i < rays.length - 1) {
      const n = rays[i + 1];
      ctx.strokeStyle = rgba(edge, 0.3);
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo((r[0] + n[0]) / 2, (r[1] + n[1]) / 2);
      ctx.lineTo((r[2] + n[2]) / 2, (r[3] + n[3]) / 2);
      ctx.stroke();
    }
  }
  if (cooked) {
    // 焦げと、ふった塩
    for (let i = 0; i < 10; i++) {
      const a = rays[Math.floor(rnd() * rays.length)];
      const t = 0.55 + rnd() * 0.45;
      blob(ctx, lerp(a[0], a[2], t), lerp(a[1], a[3], t), 8 + rnd() * 14, 6 + rnd() * 10, '#23120a', 0.5);
    }
    for (let i = 0; i < 7 * rays.length; i++) {
      const a = rays[Math.floor(rnd() * rays.length)];
      const t = rnd();
      ctx.fillStyle = `rgba(255,252,244,${0.35 + rnd() * 0.55})`;
      ctx.beginPath();
      ctx.arc(lerp(a[0], a[2], t) + (rnd() - 0.5) * 8, lerp(a[1], a[3], t) + (rnd() - 0.5) * 8, 0.4 + rnd() * 1.1, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

// x の範囲に、背びれ・しりびれのすじを並べる
function raysAlong(g, from, to, count, side, height, lean) {
  const rays = [];
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0 : i / (count - 1);
    const x = lerp(from, to, t);
    const bx = g.px(x);
    const by = side < 0 ? g.upY(x) + 3 : g.lowY(x) - 3;
    const len = height(t) * g.L;
    rays.push([bx, by, bx + len * lean, by + side * len]);
  }
  return rays;
}

// 尾びれ。付け根から tips の点へ広げる
function tailRays(g, tipFn, count) {
  const rays = [];
  const baseX = g.px(1) - 4;
  const up = g.upY(1), low = g.lowY(1);
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const tip = tipFn(t);
    rays.push([baseX, lerp(up, low, t), tip[0], tip[1]]);
  }
  return rays;
}

function fanRays(cx, cy, from, to, count, length, wobble) {
  const rays = [];
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const a = lerp(from, to, t);
    const len = length * wobble(t);
    rays.push([cx, cy + t * 8, cx + Math.cos(a) * len, cy + Math.sin(a) * len]);
  }
  return rays;
}

function drawFishEye(ctx, g, cooked) {
  const x = g.px(g.eye[0]);
  const up = g.upY(g.eye[0]), low = g.lowY(g.eye[0]);
  const y = (up + low) / 2 + g.eye[1] * (low - up) / 2;
  const r = g.eyeR;
  if (cooked) {
    blob(ctx, x, y, r * 1.5, r * 1.5, '#2a160a', 0.7);
    const pale = ctx.createRadialGradient(x - r * 0.15, y - r * 0.2, 1, x, y, r * 0.78);
    pale.addColorStop(0, '#f4ecd9');
    pale.addColorStop(0.6, '#d8cbb0');
    pale.addColorStop(1, '#7c6548');
    ctx.fillStyle = pale;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.78, 0, TAU);
    ctx.fill();
    blob(ctx, x, y, r * 0.3, r * 0.3, '#6a5a44', 0.65);
    return;
  }
  // 目のまわりのくぼみ
  blob(ctx, x, y, r * 1.5, r * 1.5, '#10141c', 0.42);
  const iris = ctx.createRadialGradient(x, y, r * 0.4, x, y, r);
  if (g.id === 'kasago') {
    iris.addColorStop(0, '#b98745');
    iris.addColorStop(0.75, '#7a4326');
    iris.addColorStop(1, '#3a1b12');
  } else {
    iris.addColorStop(0, '#c8c4ae');
    iris.addColorStop(0.7, '#8d8768');
    iris.addColorStop(1, '#34332a');
  }
  ctx.fillStyle = iris;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  const pupil = ctx.createRadialGradient(x - r * 0.1, y - r * 0.1, 0, x, y, r * 0.7);
  pupil.addColorStop(0, '#1a2432');
  pupil.addColorStop(1, '#05070c');
  ctx.fillStyle = pupil;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.68, 0, TAU);
  ctx.fill();
  // 目の表面の光
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.36, r * 0.13, r * 0.08, -0.5, 0, TAU);
  ctx.fill();
  const film = ctx.createLinearGradient(x, y - r, x, y + r);
  film.addColorStop(0, 'rgba(255,255,255,0.2)');
  film.addColorStop(0.5, 'rgba(255,255,255,0)');
  film.addColorStop(1, 'rgba(190,210,230,0.24)');
  ctx.fillStyle = film;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

// 魚1匹を描く。cooked が true なら塩焼きにする
/* ---------- 仮の絵（Geminiの絵ができるまでの代わり） ----------
   kind：体の形。back・side・belly：背中、横、おなかの色。fin：ヒレの色。spots：点の色 */
const STAND_IN = {
  kurodai: { kind: 'tai', back: '#3a3f44', side: '#7f8a8f', belly: '#cfd4d2', fin: '#2b2f33' },
  kisu: { kind: 'slim', back: '#c9b89a', side: '#e9e1cf', belly: '#f7f3ea', fin: '#e2d6bb' },
  karei: { kind: 'flat', back: '#6b5a3f', side: '#8a7552', belly: '#a08b63', fin: '#5d4d35', spots: '#4a3c28' },
  aoriika: { kind: 'squid', back: '#c9b6a6', side: '#e3d6cb', belly: '#efe6dd', fin: '#d7c6b8', spots: '#8a5e4c' },
  madai: { kind: 'tai', back: '#d8606a', side: '#ef9aa0', belly: '#f8dcd9', fin: '#d4646c', spots: '#5fb6d8' },
  buri: { kind: 'long', back: '#2f5466', side: '#b9c4c6', belly: '#eef0ec', fin: '#c9b04a', stripe: '#d8c25a' },
  hirame: { kind: 'flat', back: '#5a4b37', side: '#7a6648', belly: '#927b56', fin: '#4e412f', spots: '#3e3324' },
  onikasago: { kind: 'kasago', back: '#d4552a', side: '#ef7d3c', belly: '#f6b07a', fin: '#d4552a', spots: '#9e2f14' },
  torafugu: { kind: 'fugu', back: '#3a3d3c', side: '#5d6160', belly: '#f2f0ea', fin: '#3a3d3c', mark: '#141616' },
  suzuki: { kind: 'long', back: '#53636e', side: '#b8c3c8', belly: '#eef1ef', fin: '#7d8a91' },
  amadai: { kind: 'tai', back: '#e3877c', side: '#f0b2a3', belly: '#f8e2d6', fin: '#f2c25a' },
  isaki: { kind: 'tai', back: '#5c5a3c', side: '#a39e78', belly: '#ddd8bf', fin: '#6e6a48', stripe: '#3e3c28' },
  yamame: { kind: 'trout', back: '#6d6a3f', side: '#d9c79c', belly: '#f4ece0', fin: '#a39368', spots: '#3a3826', parr: '#5c5e64' },
  nijimasu: { kind: 'trout', back: '#5f6a4c', side: '#c9c3ae', belly: '#f1ede4', fin: '#8c8a6c', spots: '#262620', stripe: '#d9736c' },
  ayu: { kind: 'slim', back: '#6b6a48', side: '#cfc8a8', belly: '#f2ede0', fin: '#a89c62', mark: '#e8c84a' },
  gonzui: { kind: 'catfish', back: '#3b2c25', side: '#4e3a30', belly: '#7a6a5c', fin: '#33261f', stripe: '#e6c75a' },
  kusafugu: { kind: 'fugu', back: '#3d5040', side: '#56685a', belly: '#f2f0e6', fin: '#3d5040', spots: '#e8ecdf', mark: '#141814' },
};

// 形ごとの体の輪郭（横向き、頭が左）。上半分と下半分の高さを、頭からの割合で返す
function standInProfile(kind, t) {
  const bump = (a, b) => Math.sin(Math.PI * Math.min(1, Math.max(0, (t - a) / (b - a))));
  switch (kind) {
    case 'tai': return [0.9 * Math.pow(bump(-0.02, 0.86), 0.8), 0.62 * Math.pow(bump(-0.02, 0.86), 0.9)];
    case 'slim': return [0.42 * Math.pow(bump(-0.02, 0.88), 0.7), 0.36 * Math.pow(bump(-0.02, 0.88), 0.7)];
    case 'long': return [0.5 * Math.pow(bump(-0.02, 0.86), 0.75), 0.42 * Math.pow(bump(-0.02, 0.86), 0.75)];
    case 'trout': return [0.5 * Math.pow(bump(-0.02, 0.86), 0.72), 0.42 * Math.pow(bump(-0.02, 0.86), 0.72)];
    case 'kasago': return [0.72 * Math.pow(bump(-0.04, 0.84), 0.6), 0.55 * Math.pow(bump(-0.04, 0.84), 0.7)];
    case 'fugu': return [0.66 * Math.pow(bump(-0.04, 0.82), 0.55), 0.6 * Math.pow(bump(-0.04, 0.82), 0.55)];
    case 'catfish': return [0.4 * Math.pow(bump(-0.02, 0.97), 0.5), 0.36 * Math.pow(bump(-0.02, 0.97), 0.5)];
    case 'flat': return [0.92 * Math.pow(bump(-0.02, 0.86), 0.65), 0.92 * Math.pow(bump(-0.02, 0.86), 0.65)];
    default: return [0.5 * bump(0, 0.86), 0.42 * bump(0, 0.86)];
  }
}

function paintStandIn(ctx, w, h, id, cooked = false) {
  const p = STAND_IN[id] || STAND_IN.suzuki;
  const s = w / 840;
  ctx.save();
  ctx.scale(s, s);
  const L = 90, R = 750, cy = 210, base = 130;
  if (p.kind === 'squid') { paintStandInSquid(ctx, p, cooked); ctx.restore(); return; }
  const tailX = p.kind === 'catfish' ? R + 20 : R - 30;

  // 体の輪郭を点でたどる
  const top = [], bottom = [];
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    const [up, down] = standInProfile(p.kind, t);
    const x = L + (tailX - L) * t;
    top.push([x, cy - base * Math.max(0.04, up)]);
    bottom.push([x, cy + base * Math.max(0.04, down)]);
  }
  const tailEnd = tailX + (p.kind === 'catfish' ? 40 : 90);
  const outline = () => {
    ctx.beginPath();
    ctx.moveTo(top[0][0], top[0][1]);
    top.forEach(([x, y]) => ctx.lineTo(x, y));
    for (let i = bottom.length - 1; i >= 0; i--) ctx.lineTo(bottom[i][0], bottom[i][1]);
    ctx.closePath();
  };

  // ヒレ（背ビレ、尾ビレ、しりビレ）
  ctx.fillStyle = cooked ? '#7a4a20' : p.fin;
  ctx.globalAlpha = 0.85;
  const fin = (pts) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(([x, y]) => ctx.lineTo(x, y)); ctx.closePath(); ctx.fill(); };
  const at = (arr, t) => arr[Math.round(t * 60)];
  if (p.kind === 'flat') {
    // カレイやヒラメは、体のまわりをヒレが囲む
    fin([at(top, 0.12), [at(top, 0.5)[0], at(top, 0.5)[1] - 26], at(top, 0.86), at(top, 0.5)]);
    fin([at(bottom, 0.18), [at(bottom, 0.5)[0], at(bottom, 0.5)[1] + 26], at(bottom, 0.86), at(bottom, 0.5)]);
  } else if (p.kind === 'catfish') {
    fin([at(top, 0.2), [at(top, 0.25)[0], at(top, 0.25)[1] - 50], at(top, 0.3)]);
    fin([at(top, 0.45), [at(top, 0.6)[0], at(top, 0.6)[1] - 22], at(top, 1), [tailEnd, cy], at(bottom, 1), [at(bottom, 0.6)[0], at(bottom, 0.6)[1] + 22], at(bottom, 0.4)]);
  } else {
    const high = p.kind === 'kasago' || p.kind === 'tai' ? 46 : 26;
    fin([at(top, 0.3), [at(top, 0.38)[0], at(top, 0.38)[1] - high], [at(top, 0.62)[0], at(top, 0.62)[1] - high * 0.7], at(top, 0.72)]);
    fin([at(bottom, 0.55), [at(bottom, 0.64)[0], at(bottom, 0.64)[1] + high * 0.55], at(bottom, 0.74)]);
  }
  if (p.kind !== 'catfish') {
    const fork = p.kind === 'long' || p.kind === 'slim' || p.kind === 'tai' ? 46 : 8;
    fin([[tailX - 4, cy - 10], [tailEnd, cy - 84], [tailEnd - fork, cy], [tailEnd, cy + 84], [tailX - 4, cy + 10]]);
  }
  ctx.globalAlpha = 1;

  // 体の色（背中→横→おなか）
  outline();
  const g = ctx.createLinearGradient(0, cy - base, 0, cy + base);
  if (cooked) {
    g.addColorStop(0, '#6e3c18'); g.addColorStop(0.5, '#b47a3e'); g.addColorStop(1, '#d6a66a');
  } else {
    g.addColorStop(0, p.back); g.addColorStop(0.45, p.side); g.addColorStop(1, p.belly);
  }
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  outline();
  ctx.clip();
  const rnd = seeded(id.length * 97 + id.charCodeAt(0));
  if (!cooked) {
    if (p.stripe) {
      ctx.fillStyle = p.stripe;
      ctx.globalAlpha = p.kind === 'tai' ? 0.35 : 0.6;
      if (p.kind === 'tai') { for (let i = 0; i < 3; i++) ctx.fillRect(L, cy - base * 0.55 + i * 52, tailX - L, 12); }
      else ctx.fillRect(L + 60, cy - 8, tailX - L - 60, p.kind === 'catfish' ? 10 : 16);
      if (p.kind === 'catfish') ctx.fillRect(L + 40, cy - 48, tailX - L - 40, 9);
    }
    if (p.parr) {
      ctx.fillStyle = p.parr;
      ctx.globalAlpha = 0.45;
      for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.ellipse(L + 170 + i * 58, cy + 4, 15, 30, 0, 0, TAU); ctx.fill(); }
    }
    if (p.spots) {
      ctx.fillStyle = p.spots;
      ctx.globalAlpha = 0.75;
      for (let i = 0; i < 70; i++) {
        const x = L + 60 + rnd() * (tailX - L - 40);
        const y = cy - base + rnd() * base * (p.kind === 'flat' ? 2 : 1.2);
        ctx.beginPath(); ctx.arc(x, y, 3 + rnd() * (p.kind === 'flat' ? 9 : 5), 0, TAU); ctx.fill();
      }
    }
    if (p.mark) {
      ctx.fillStyle = p.mark;
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.ellipse(L + 210, cy - 4, p.kind === 'fugu' ? 34 : 14, p.kind === 'fugu' ? 30 : 10, 0, 0, TAU); ctx.fill();
    }
  }
  // 上からの光
  ctx.globalAlpha = 1;
  const shine = ctx.createLinearGradient(0, cy - base, 0, cy);
  shine.addColorStop(0, 'rgba(255,255,255,0.28)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(L, cy - base, tailX - L, base);
  ctx.restore();

  // エラのふちと目
  ctx.strokeStyle = 'rgba(30,24,20,0.45)';
  ctx.lineWidth = 4;
  const gx = L + (p.kind === 'kasago' || p.kind === 'fugu' ? 175 : 140);
  ctx.beginPath(); ctx.moveTo(gx, cy - base * 0.5); ctx.quadraticCurveTo(gx + 26, cy, gx, cy + base * 0.48); ctx.stroke();
  const ex = L + (p.kind === 'flat' ? 70 : 72), ey = cy - base * (p.kind === 'flat' ? 0.42 : 0.18);
  ctx.fillStyle = cooked ? '#e8e0cc' : '#f4ecd2';
  ctx.beginPath(); ctx.arc(ex, ey, 19, 0, TAU); ctx.fill();
  ctx.fillStyle = cooked ? '#b8ab90' : '#151515';
  ctx.beginPath(); ctx.arc(ex + 2, ey, 11, 0, TAU); ctx.fill();
  if (p.kind === 'catfish') {
    // ゴンズイのひげ
    ctx.strokeStyle = p.fin; ctx.lineWidth = 4;
    for (const [dx, dy] of [[-60, -30], [-70, 0], [-60, 30], [-40, 50]]) { ctx.beginPath(); ctx.moveTo(L + 6, cy + 10); ctx.lineTo(L + dx, cy + 10 + dy); ctx.stroke(); }
  }
  ctx.restore();
}

// イカの仮の絵（胴が左、足が右）
function paintStandInSquid(ctx, p, cooked) {
  const cy = 210;
  ctx.fillStyle = cooked ? '#c99460' : p.fin;
  ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.ellipse(250, cy, 200, 120, 0, 0, TAU); ctx.fill();   // エンペラ（胴のまわりのヒレ）
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, cy - 90, 0, cy + 90);
  g.addColorStop(0, cooked ? '#b67b45' : p.back);
  g.addColorStop(1, cooked ? '#e0b47c' : p.belly);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(300, cy, 250, 88, 0, 0, TAU); ctx.fill();
  if (!cooked) {
    const rnd = seeded(5);
    ctx.fillStyle = p.spots; ctx.globalAlpha = 0.35;
    for (let i = 0; i < 90; i++) { ctx.beginPath(); ctx.arc(80 + rnd() * 440, cy - 70 + rnd() * 140, 2 + rnd() * 4, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = cooked ? '#a86c38' : p.side;
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    ctx.lineWidth = 14 - i * 0.6;
    ctx.beginPath(); ctx.moveTo(560, cy - 40 + i * 11);
    ctx.quadraticCurveTo(650, cy - 60 + i * 16, 700 + (i % 3) * 20, cy - 70 + i * 20); ctx.stroke();
  }
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(560, cy); ctx.quadraticCurveTo(700, cy - 10, 790, cy + 30); ctx.stroke();
  ctx.fillStyle = '#f2eadb'; ctx.beginPath(); ctx.arc(565, cy - 24, 18, 0, TAU); ctx.fill();
  ctx.fillStyle = '#151515'; ctx.beginPath(); ctx.arc(568, cy - 24, 10, 0, TAU); ctx.fill();
}

// 料理の仮の絵。木のテーブルにお皿をのせて、まん中に魚を置く
function paintStandInDish(ctx, w, h, fish, dish) {
  paintTable(ctx, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(w / 2 + 10, h / 2 + 18, w * 0.42, h * 0.3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = dish.raw ? '#2c3e5c' : '#f2ece0';
  ctx.beginPath(); ctx.ellipse(w / 2, h / 2, w * 0.42, h * 0.3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = dish.raw ? '#3b5276' : '#e2d9c8';
  ctx.beginPath(); ctx.ellipse(w / 2, h / 2, w * 0.33, h * 0.22, 0, 0, TAU); ctx.fill();
  const art = offscreen(840, 420);
  if (dish.raw) {
    // 刺身は切り身を並べる
    const p = STAND_IN[fish.id] || STAND_IN.suzuki;
    for (let i = 0; i < 7; i++) {
      const x = w * 0.3 + i * w * 0.065, y = h / 2 - 10 + Math.sin(i) * 6;
      ctx.fillStyle = fish.id === 'madai' || fish.id === 'amadai' ? '#f6dcd2' : fish.id === 'buri' ? '#f1d0c4' : '#f4ede2';
      ctx.beginPath(); ctx.ellipse(x, y, w * 0.045, h * 0.1, -0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = p.back; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.ellipse(x - w * 0.03, y - h * 0.04, w * 0.012, h * 0.06, -0.4, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#5f9a4a';
    ctx.beginPath(); ctx.ellipse(w * 0.72, h * 0.56, w * 0.05, h * 0.03, 0.4, 0, TAU); ctx.fill();
  } else {
    const actx = art.getContext('2d');
    paintStandIn(actx, 840, 420, fish.id, true);
    ctx.drawImage(art, w * 0.16, h * 0.3, w * 0.68, w * 0.34);
    ctx.fillStyle = '#f0e7d0';
    ctx.beginPath(); ctx.arc(w * 0.74, h * 0.62, w * 0.04, 0, TAU); ctx.fill();
  }
  ctx.font = `bold ${Math.round(w * 0.045)}px ${FONT_BODY}`;
  ctx.fillStyle = 'rgba(255,246,230,0.85)';
  ctx.textAlign = 'right';
  ctx.fillText('仮の絵', w - 18, h - 18);
}

// HTMLの図鑑などで使う、仮の魚の絵のURL（1回作ったら使い回す）
const standInUrls = {};
function standInUrl(id) {
  if (!standInUrls[id]) {
    const c = offscreen(420, 210);
    paintStandIn(c.getContext('2d'), 420, 210, id);
    standInUrls[id] = c.toDataURL();
  }
  return standInUrls[id];
}

function paintFish(ctx, w, h, id, cooked = false) {
  if (!FISH_SHAPE[id]) { paintStandIn(ctx, w, h, id, cooked); return; }   // 段階6で増えた魚は仮の絵
  const scale = w / 560;
  const g = fishGeometry(id);
  const cy = g.cy;
  const rnd = seeded(id.length * 211 + (cooked ? 7 : 0));
  const palette = {
    aji: { fin: '#8f9471', edge: '#4d5140', tail: '#b09c4d', tailEdge: '#544b24' },
    saba: { fin: '#3d5c68', edge: '#16242c', tail: '#2c4a58', tailEdge: '#0f1b22' },
    kasago: { fin: '#a84a2c', edge: '#4c2016', tail: '#993f26', tailEdge: '#3f1a12' },
  }[id];
  const baked = cooked ? { color: '#a06a30', edge: '#3a2110' } : null;
  const fin = (rays, tone, spiny, alpha) => drawFin(ctx, rays, {
    color: baked ? baked.color : tone[0],
    edge: baked ? baked.edge : tone[1],
    spiny, alpha, cooked, rnd,
  });
  const finTone = [palette.fin, palette.edge];
  const tailTone = [palette.tail, palette.tailEdge];

  ctx.save();
  ctx.scale(scale, scale);

  const L = g.L;
  const tailX = g.px(1);
  if (id === 'aji') {
    fin(tailRays(g, (t) => {
      const fork = Math.abs(t - 0.5) * 2;
      return [tailX + lerp(38, 108, Math.pow(fork, 1.2)), cy + (t - 0.5) * 2 * lerp(6, 74, Math.pow(fork, 0.85))];
    }, 18), tailTone);
    fin(raysAlong(g, 0.36, 0.5, 8, -1, (t) => 0.1 * (1 - t * 0.68) + 0.014, 0.42), finTone, true);
    fin(raysAlong(g, 0.53, 0.88, 26, -1, (t) => 0.07 * Math.pow(1 - t, 1.3) + 0.02, 0.36), finTone);
    fin(raysAlong(g, 0.57, 0.88, 22, 1, (t) => 0.06 * Math.pow(1 - t, 1.3) + 0.018, 0.36), finTone);
    fin(raysAlong(g, 0.3, 0.335, 5, 1, () => 0.05, 0.75), finTone);
  } else if (id === 'saba') {
    fin(tailRays(g, (t) => {
      const fork = Math.abs(t - 0.5) * 2;
      return [tailX + lerp(22, 92, Math.pow(fork, 1.1)), cy + (t - 0.5) * 2 * lerp(5, 66, fork)];
    }, 18), tailTone);
    fin(raysAlong(g, 0.33, 0.53, 10, -1, (t) => 0.062 * (1 - t * 0.55), 0.34), finTone, true);
    fin(raysAlong(g, 0.63, 0.73, 9, -1, (t) => 0.06 * (1 - t * 0.6), 0.5), finTone);
    fin(raysAlong(g, 0.66, 0.76, 9, 1, (t) => 0.056 * (1 - t * 0.6), 0.5), finTone);
    // 尾の近くに並ぶ小さなヒレ
    for (let i = 0; i < 5; i++) {
      const x = 0.76 + i * 0.05;
      fin(raysAlong(g, x, x + 0.03, 3, -1, () => 0.024, 0.9), finTone);
      fin(raysAlong(g, x + 0.012, x + 0.04, 3, 1, () => 0.024, 0.9), finTone);
    }
    fin(raysAlong(g, 0.28, 0.31, 5, 1, () => 0.05, 0.7), finTone);
  } else {
    fin(tailRays(g, (t) => {
      const a = lerp(-0.62, 0.62, t);
      return [tailX + Math.cos(a) * 92, cy + Math.sin(a) * 92];
    }, 16), tailTone);
    // とげの背びれ（12本）と、やわらかい後ろの背びれ
    fin(raysAlong(g, 0.26, 0.74, 12, -1, (t) => 0.13 - 0.03 * t + 0.008 * Math.sin(t * 19), 0.1), finTone, true, 0.9);
    fin(raysAlong(g, 0.76, 0.97, 13, -1, (t) => 0.125 * Math.sin(0.5 + t * 2.3), 0.34), finTone);
    fin(raysAlong(g, 0.74, 0.92, 11, 1, (t) => 0.135 * Math.sin(0.45 + t * 2.3), 0.3), finTone);
    fin(raysAlong(g, 0.34, 0.4, 6, 1, () => 0.1, 0.6), finTone);
  }

  ctx.drawImage(fishBodyCanvas(id, w, h, cooked), 0, 0, w / scale, h / scale);

  // 胸びれは体の上に乗る
  if (id === 'aji') {
    const bx = g.px(0.27), by = cy + 14;
    fin(fanRays(bx, by, -0.1, 0.32, 13, 0.25 * L, (t) => 1 - t * 0.55), finTone, false, cooked ? 0.4 : 0.7);
  } else if (id === 'saba') {
    const bx = g.px(0.245), by = cy + 2;
    fin(fanRays(bx, by, -0.1, 0.5, 11, 0.135 * L, (t) => 1 - t * 0.3), finTone, false, 0.74);
  } else {
    const bx = g.px(0.335), by = cy + 2;
    fin(fanRays(bx, by, -0.55, 1.05, 18, 0.26 * L, (t) => 0.86 + Math.sin(t * Math.PI) * 0.18), finTone, false, 0.92);
    if (!cooked) {
      ctx.save();
      for (let i = 0; i < 16; i++) {
        const a = lerp(-0.5, 1, rnd());
        const r = lerp(0.08, 0.24, rnd()) * L;
        blob(ctx, bx + Math.cos(a) * r, by + Math.sin(a) * r, 8 + rnd() * 6, 5 + rnd() * 5, '#3f1a12', 0.5);
      }
      ctx.restore();
    }
    // 頭のトゲ
    ctx.fillStyle = cooked ? '#4a2810' : '#5b2a1c';
    for (const [x, s, h2] of [[0.1, -0.86, 13], [0.16, -0.94, 15], [0.21, -0.97, 13], [0.26, -0.72, 13], [0.3, -0.42, 14], [0.32, -0.16, 12]]) {
      const bx2 = g.px(x), up = g.upY(x), low = g.lowY(x);
      const y = (up + low) / 2 + s * (low - up) / 2;
      ctx.beginPath();
      ctx.moveTo(bx2 - 5, y + 2);
      ctx.lineTo(bx2 + 7, y - h2);
      ctx.lineTo(bx2 + 6, y + 3);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 飾り包丁の切り目（焼いたときだけ）
  if (cooked) {
    ctx.save();
    fishOutline(ctx, g);
    ctx.clip();
    for (const x of [0.46, 0.6]) {
      const bx = g.px(x), mid = (g.upY(x) + g.lowY(x)) / 2 - 6;
      const half = (g.lowY(x) - g.upY(x)) * 0.3;
      ctx.save();
      ctx.translate(bx, mid);
      ctx.rotate(0.24);
      ctx.fillStyle = '#4a2711';
      ctx.beginPath();
      ctx.moveTo(0, -half);
      ctx.quadraticCurveTo(11, 0, 0, half);
      ctx.quadraticCurveTo(-10, 0, 0, -half);
      ctx.closePath();
      ctx.fill();
      const flesh = ctx.createLinearGradient(-6, 0, 7, 0);
      flesh.addColorStop(0, '#dfb67c');
      flesh.addColorStop(0.55, '#eedcbb');
      flesh.addColorStop(1, '#e6c38f');
      ctx.fillStyle = flesh;
      ctx.beginPath();
      ctx.moveTo(0, -half * 0.8);
      ctx.quadraticCurveTo(6.5, 0, 0, half * 0.8);
      ctx.quadraticCurveTo(-5, 0, 0, -half * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // 体にふった塩
    for (let i = 0; i < 240; i++) {
      const x = 0.04 + rnd() * 0.94;
      const y = lerp(g.upY(x), g.lowY(x), Math.pow(rnd(), 1.7));
      ctx.fillStyle = `rgba(255,254,248,${0.3 + rnd() * 0.5})`;
      ctx.beginPath();
      ctx.arc(g.px(x), y, 0.35 + rnd() * 0.75, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // 頭のつくり（ほおの線と鼻の穴）
  {
    const eyeX = g.px(g.eye[0]);
    const eyeUp = g.upY(g.eye[0]), eyeLow = g.lowY(g.eye[0]);
    const eyeY = (eyeUp + eyeLow) / 2 + g.eye[1] * (eyeLow - eyeUp) / 2;
    ctx.save();
    fishOutline(ctx, g);
    ctx.clip();
    ctx.strokeStyle = cooked ? 'rgba(50,26,10,0.32)' : 'rgba(30,36,44,0.22)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(eyeX + g.eyeR * 2.1, eyeY - g.eyeR * 0.3);
    ctx.quadraticCurveTo(eyeX + g.eyeR * 3.2, eyeY + g.eyeR * 2, eyeX + g.eyeR * 0.6, eyeY + g.eyeR * 3.1);
    ctx.stroke();
    blob(ctx, eyeX + g.eyeR * 1.2, eyeY + g.eyeR * 1.7, g.eyeR * 2, g.eyeR * 1.1, '#ffffff', cooked ? 0.06 : 0.14);
    ctx.fillStyle = 'rgba(14,16,20,0.55)';
    ctx.beginPath();
    ctx.ellipse(eyeX - g.eyeR * 1.45, eyeY + g.eyeR * 0.1, 1.8, 1.2, 0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 口
  const mouthEnd = id === 'kasago' ? 0.13 : id === 'saba' ? 0.085 : 0.08;
  const my = (g.upY(0.02) + g.lowY(0.02)) / 2 + (id === 'kasago' ? 4 : 2);
  ctx.strokeStyle = cooked ? 'rgba(36,18,8,0.8)' : 'rgba(24,24,30,0.72)';
  ctx.lineWidth = id === 'kasago' ? 3.2 : 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(g.px(0.004), my);
  ctx.quadraticCurveTo(g.px(mouthEnd * 0.55), my + (id === 'kasago' ? 14 : 7), g.px(mouthEnd), my + (id === 'kasago' ? 20 : 11));
  ctx.stroke();

  drawFishEye(ctx, g, cooked);
  ctx.restore();
}

function paintGlint(ctx, w, h) {
  blob(ctx, w / 2, h / 2, w / 2, h / 2, '#fff3d4', 1);
}

// 紙のざらつき
function paintGrain(ctx, w, h) {
  const rnd = seeded(5);
  const image = ctx.createImageData(w, h);
  for (let i = 0; i < image.data.length; i += 4) {
    const dark = rnd() < 0.5;
    image.data[i] = image.data[i + 1] = image.data[i + 2] = dark ? 40 : 255;
    image.data[i + 3] = Math.floor(rnd() * 22);
  }
  ctx.putImageData(image, 0, 0);
}

function paintButton(ctx, w, h) {
  const m = 14;
  const r = (h - m * 2) / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(26,40,80,0.35)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = COLOR.cream;
  ctx.beginPath();
  ctx.moveTo(m + r, m);
  ctx.lineTo(w - m - r, m);
  ctx.arc(w - m - r, h / 2, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(m + r, h - m);
  ctx.arc(m + r, h / 2, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ---------- 料理の絵 ---------- */

// 木のテーブル（低い解像度で作って広げ、奥がぼけたように見せる）
function paintTable(ctx, w, h) {
  const plank = 118;
  paintPixels(ctx, w, h, (x, y, o) => {
    const row = Math.floor(y / plank);
    const yy = y + row * 37;
    const warp = fbm(x * 0.006 + row * 9, yy * 0.05, 4);
    const ring = Math.sin(yy * 0.24 + warp * 22);
    const fine = fbm(x * 0.03 + row, yy * 0.8, 3);
    const tone = lerp(0.74, 1.08, hash2(row, 5));
    let c = lerp3([52, 30, 18], [122, 78, 46], clamp01(ring * 0.28 + 0.46 + (fine - 0.5) * 0.9));
    c = lerp3(c, [146, 96, 58], sstep(0.62, 0.84, fine) * 0.26);
    const seam = y - row * plank;
    const groove = Math.min(seam, plank - seam);
    const dark = lerp(0.3, 1, sstep(0, 2.4, groove));
    // 明かりは手前の真ん中に集まり、まわりは暗い
    const dx = (x / w - 0.5) * 1.3, dy = (y / h - 0.5) * 1.65;
    const lamp = 1.2 - sstep(0.12, 0.92, Math.sqrt(dx * dx + dy * dy)) * 0.95;
    o[0] = c[0] * tone * dark * lamp * 1.04;
    o[1] = c[1] * tone * dark * lamp * 0.97;
    o[2] = c[2] * tone * dark * lamp * 0.88;
  });
}

// 魚の絵の大きさ（写真も同じ大きさにそろえている）
const FISH_BAKE = { w: 840, h: 420 };

// 湯気のひとすじ。形がくずれながら上がる
function paintSteam(ctx, w, h) {
  paintPixels(ctx, w, h, (x, y, o) => {
    const v = 1 - y / h;
    const sway = Math.sin(v * 5.8) * 0.17 + (fbm(y * 0.012, 3, 2) - 0.5) * 0.26;
    const dx = (x / w - 0.5 - sway) / lerp(0.1, 0.26, v);
    const fall = Math.exp(-dx * dx) * sstep(0, 0.1, v) * sstep(1, 0.5, v);
    const n = fbm(x * 0.024, y * 0.018, 4);
    o[0] = 255; o[1] = 248; o[2] = 236;
    o[3] = 150 * fall * sstep(0.32, 0.72, n);
  });
}

/* ---------- 空と海 ---------- */

// 朝焼けの空（低い解像度で作って広げる。雲はやわらかいのでこれで十分）
function paintRealSky(ctx, w, h) {
  const stops = [
    [0, [34, 48, 104]], [0.32, [70, 84, 146]], [0.58, [146, 118, 164]],
    [0.78, [232, 148, 124]], [0.92, [252, 192, 134]], [1, [255, 226, 176]],
  ];
  const sunX = SUN_X / 2, sunY = h - 3;
  paintPixels(ctx, w, h, (x, y, o) => {
    const v = y / h;
    let c = stops[stops.length - 1][1];
    for (let i = 1; i < stops.length; i++) {
      if (v <= stops[i][0]) {
        c = lerp3(stops[i - 1][1], stops[i][1], (v - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
        break;
      }
    }
    const dx = (x - sunX) / w, dy = (y - sunY) / h;
    const dist2 = dx * dx * 2.2 + dy * dy;
    const glow = Math.exp(-dist2 * 9);
    c = lerp3(c, [255, 206, 142], glow * 0.72);

    // 雲。高いところは大きく、水平線に近いほど平たくつぶれて見える
    const depth = 1 / (1.07 - v);
    const cu = (x / w - 0.5) * depth * 1.5 + 2.7;
    const cv = Math.pow(depth, 0.72) * 2.8;
    const n = fbm(cu * 2.1, cv * 2.2, 5);
    const toward = fbm((cu + (sunX / w - x / w) * 0.2) * 2.1, (cv + 0.16) * 2.2, 5);
    const density = sstep(0.52, 0.76, n) * sstep(0, 0.2, v) * sstep(1, 0.8, v);
    if (density > 0) {
      const lit = clamp01((toward - n) * 5 + 0.62 + glow * 0.5);
      const shadowTone = lerp3([56, 58, 112], [146, 98, 128], v);
      const lightTone = lerp3([232, 158, 166], [255, 196, 140], sstep(0.45, 0.95, v));
      c = lerp3(c, lerp3(shadowTone, lightTone, lit), density * 0.92);
    }

    // 太陽
    const sx = x - sunX, sy = y - sunY;
    const sunD = Math.sqrt(sx * sx + sy * sy);
    c = lerp3(c, [255, 246, 214], sstep(23, 19, sunD));

    // 遠くの山
    const ground = h - (fbm(x * 0.022, 3.3, 4) * 62 + 6) * sstep(0.56, 0.02, x / w);
    if (y > ground - 1) {
      const mist = sstep(ground, h, y);
      c = lerp3(c, lerp3([74, 68, 112], [196, 142, 136], mist * 0.7), clamp01(y - ground + 1));
    }
    o[0] = c[0]; o[1] = c[1]; o[2] = c[2];
  });
}

// 海。波の高さから1点ずつ面の向きを出して、空の映り込みと日の光を計算する
const SEA_SHADER = `
precision highp float;
uniform vec2 resolution;
uniform float uT;
uniform float uSunX;
varying vec2 fragCoord;

const float CAM = 9.0;
const float VIEW = 0.5;

vec3 skyColor(vec3 r, vec3 sun) {
  float e = clamp(r.y, 0.0, 1.0);
  vec3 c = mix(vec3(1.0, 0.72, 0.46), vec3(0.88, 0.50, 0.48), smoothstep(0.0, 0.13, e));
  c = mix(c, vec3(0.42, 0.38, 0.62), smoothstep(0.1, 0.36, e));
  c = mix(c, vec3(0.14, 0.20, 0.42), smoothstep(0.3, 0.85, e));
  float g = max(dot(r, sun), 0.0);
  c += vec3(1.0, 0.6, 0.3) * (pow(g, 8.0) * 0.32 + pow(g, 90.0) * 0.5);
  return c;
}

// 向きの違う波を重ねる。とがった山と広い谷にして、前の波で次の波の場所をずらす
void waves(vec2 p, float foot, float t, out float h, out vec2 g) {
  float freq = 0.42, amp = 0.34, speed = 0.9;
  h = 0.0;
  g = vec2(0.0);
  for (int i = 0; i < 16; i++) {
    float angle = 0.5 + sin(float(i) * 2.4) * (0.55 + float(i) * 0.05);
    vec2 d = vec2(sin(angle), cos(angle));
    float x = dot(d, p) * freq + t * speed + float(i) * 1.7;
    float w = exp(sin(x) - 1.0);
    float dw = w * cos(x);
    float keep = 1.0 - smoothstep(0.5, 1.6, freq * foot);
    h += w * amp * keep;
    g += d * dw * freq * amp * keep;
    p -= d * dw * amp * 0.22;
    freq *= 1.26;
    amp *= 0.83;
    speed *= 1.09;
  }
}

vec3 toneMap(vec3 c) {
  return clamp((c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = fragCoord / resolution;
  float v = 1.0 - uv.y;
  float aspect = resolution.x / resolution.y;
  vec3 rd = normalize(vec3((uv.x - 0.5) * aspect * VIEW, -(v * VIEW + 0.002), 1.0));
  vec3 sun = normalize(vec3((uSunX - 0.5) * aspect * VIEW, 0.012, 1.0));

  float dist = CAM / -rd.y;
  vec2 p = rd.xz * dist;
  float foot = dist * dist * VIEW / (resolution.y * CAM) + dist * VIEW / resolution.y;

  float h;
  vec2 g;
  waves(p, foot, uT, h, g);
  vec3 n = normalize(vec3(-g.x * 0.62, 1.0, -g.y * 0.62));
  if (n.y < 0.0) n.y = -n.y;

  vec3 r = reflect(rd, n);
  r.y = abs(r.y);
  float fres = 0.02 + 0.98 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);

  vec3 reflected = skyColor(r, sun);
  // 水の色。波の山は光が透けて少し青緑になる
  vec3 water = mix(vec3(0.012, 0.055, 0.105), vec3(0.03, 0.17, 0.20), smoothstep(0.3, 1.5, h));
  vec3 c = mix(water, reflected, min(fres * 1.15, 1.0));

  // 日の光。遠くは面がならされるので、光の道を広くする
  float far = smoothstep(25.0, 500.0, dist);
  float power = mix(520.0, 46.0, far);
  float sp = pow(max(dot(r, sun), 0.0), power);
  c += vec3(1.0, 0.72, 0.42) * sp * mix(5.0, 1.6, far);

  // 波がくずれて白くなるところ
  float foam = smoothstep(1.75, 2.35, h + 0.3 * sin(p.x * 1.3 + p.y * 1.7)) * (1.0 - far);
  c = mix(c, vec3(0.86, 0.80, 0.76), foam * 0.5);

  // 遠くはかすんで、水平線の空の色に溶ける
  float haze = 1.0 - exp(-dist * 0.0028);
  c = mix(c, vec3(1.0, 0.70, 0.46) * 0.96, haze * 0.82);

  gl_FragColor = vec4(toneMap(c * 1.05), 1.0);
}
`;

// 海と空の背景を作る。2つの画面で同じものを使う
const WAVE_LAYERS = [
  { key: 'wave1', from: 0.02, size: 0.36, top: '#f4cdb0', deep: '#c9abbb', amp: 7,  speed: 0.006,  bob: 3 },
  { key: 'wave2', from: 0.12, size: 0.42, top: '#c7a9c0', deep: '#94a0bf', amp: 11, speed: -0.009, bob: 5 },
  { key: 'wave3', from: 0.30, size: 0.48, top: '#90a3c2', deep: '#5f80a8', amp: 16, speed: 0.013,  bob: 8 },
  { key: 'wave4', from: 0.52, size: 0.48, top: '#6189ad', deep: '#3e6a92', amp: 22, speed: -0.018, bob: 11 },
  { key: 'wave5', from: 0.76, size: 0.34, top: '#47769c', deep: '#2b5277', amp: 28, speed: 0.026,  bob: 14 },
];

function createDawn(scene) {
  // 光の計算ができる端末では、写実の海にする
  if (scene.sys.game.renderer.type === Phaser.WEBGL) {
    bake(scene, 'real-sky', Math.round(W / 2), Math.round(HORIZON / 2), paintRealSky);
    scene.add.image(0, 0, 'real-sky').setOrigin(0).setDepth(0).setDisplaySize(W, HORIZON);
    if (!scene.cache.shader.exists('sea')) {
      scene.cache.shader.add('sea', new Phaser.Display.BaseShader('sea', SEA_SHADER, undefined, {
        uT: { type: '1f', value: 0 },
        uSunX: { type: '1f', value: SUN_X / W },
      }));
    }
    const sea = scene.add.shader('sea', 0, HORIZON, W, SEA_H).setOrigin(0).setDepth(1);
    const speed = REDUCE_MOTION ? 0.15 : 1;
    return {
      real: true,
      update(time) { sea.setUniform('uT.value', (time * 0.001 * speed) % 3600); },
    };
  }

  bake(scene, 'dawn', W, H, paintDawn);
  scene.add.image(0, 0, 'dawn').setOrigin(0).setDepth(0);

  const depths = [1, 2, 4, 7, 8];
  const waves = WAVE_LAYERS.map((layer, i) => {
    const height = Math.round(SEA_H * layer.size) + 60;
    bake(scene, layer.key, W * 2, height, (ctx, w, h) =>
      paintWave(ctx, w, h, 31 + i * 7, layer.top, layer.deep, layer.amp));
    const y = HORIZON + SEA_H * layer.from - layer.amp;
    const image = scene.add.image(0, y, layer.key).setOrigin(0).setDepth(depths[i]);
    return { image, y, layer, phase: i * 1.7 };
  });

  bake(scene, 'grain', 256, 256, paintGrain);
  scene.add.tileSprite(0, 0, W, H, 'grain').setOrigin(0).setDepth(50).setTileScale(2);

  const pace = REDUCE_MOTION ? 0.15 : 1;
  return {
    update(time) {
      for (const wave of waves) {
        const shift = ((time * wave.layer.speed * pace) % W + W) % W;
        wave.image.x = -shift;
        wave.image.y = wave.y + Math.sin(time * 0.0009 * pace + wave.phase) * wave.layer.bob;
      }
    },
  };
}

// 丸いボタン。押すと少し沈む
function createButton(scene, x, y, label, onPress, fontSize = 50) {

// 図鑑のごほうびを、画面の上に少しのあいだ出す
function rewardToast(scene, notes) {
  if (!notes || !notes.length) return;
  if (scene.toast) scene.toast.destroy();
  const text = scene.add.text(W / 2, Math.round(H * 0.075) + 56, notes.join('\n'), {
    fontFamily: FONT_BODY, fontSize: '32px', fontStyle: 'bold', color: '#ffe0a6', align: 'center',
    backgroundColor: 'rgba(20,28,60,0.88)', padding: { x: 24, y: 14 }, lineSpacing: 8,
  }).setOrigin(0.5, 0).setDepth(90);
  scene.toast = text;
  scene.tweens.add({ targets: text, alpha: 0, delay: 2800, duration: 500, onComplete: () => text.destroy() });

function changeScene(scene, nextKey, data) {
  scene.cameras.main.fadeOut(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
  scene.cameras.main.once('camerafadeoutcomplete', () => scene.scene.start(nextKey, data));
}

// 投げた距離（0〜1くらい）を、画面の海の上の場所に直す。遠いほど上で小さい
function waterPoint(d) {
  const t = Math.min(1.15, Math.max(0, d));
  return { x: 470 + t * 150, y: HORIZON + SEA_H * (0.55 - 0.45 * t), scale: 1.15 - 0.6 * t };
}

// 投げた距離と、釣り場・季節・時間帯・道具に合う魚が来やすいように、くじを引く
function pickFish(d, rates) {
  const list = window.fishData.fish;
  const weights = list.map((f, i) => (d >= f.game.bestRange[0] && d <= f.game.bestRange[1] ? 1 : 0.15) * rates[i]);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) {
    if (weights[i] <= 0) continue;   // その釣り場にいない魚は選ばない
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  for (let i = list.length - 1; i >= 0; i--) if (weights[i] > 0) return list[i];
  return list[0];
}

// Phaser が読み込めなかったときに止まらないよう、起動の中で画面を組み立てる
function makeScenes() {

class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }

  create() {
    this.leaving = false;
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 400, 60, 71, 112);
    this.dawn = createDawn(this);

    // 太陽のきらめき
    bake(this, 'glint', 44, 8, paintGlint);
    const rnd = seeded(47);
    this.glints = Array.from({ length: this.dawn.real ? 0 : 36 }, () => {
      const t = rnd();
      const spread = (rnd() + rnd() - 1) * (30 + t * 150);
      const image = this.add.image(SUN_X + spread, HORIZON + 14 + t * SEA_H * 0.42, 'glint')
        .setDepth(3)
        .setScale(0.6 + t * 0.9, 1);
      return { image, speed: 0.0012 + rnd() * 0.002, phase: rnd() * TAU };
    });

    // 堤防と釣り人、ウキと糸
    bake(this, 'shore', W, 500, paintShore);
    this.add.image(0, SHORE_TOP, 'shore').setOrigin(0).setDepth(5);
    bake(this, 'float', 26, 56, paintFloat);
    this.float = this.add.image(Math.round(W * 0.76), HORIZON + SEA_H * 0.3, 'float').setDepth(6);
    this.floatY = this.float.y;
    this.line = this.add.graphics().setDepth(6);

    // カモメ
    bake(this, 'gull', 84, 34, paintGull);
    this.gulls = [
      { x: 180, y: H * 0.46, scale: 0.7, speed: 0.014, phase: 0 },
      { x: 300, y: H * 0.43, scale: 0.5, speed: 0.012, phase: 1.3 },
      { x: 660, y: H * 0.5, scale: 0.42, speed: 0.009, phase: 2.2 },
    ].map((gull) => ({ ...gull, image: this.add.image(gull.x, gull.y, 'gull').setDepth(9) }));

    this.addVerticalTitle();

    createButton(this, W / 2, Math.round(H * 0.875), 'はじめる', () => this.start());

    const plays = Save.data.plays;
    if (plays > 0) {
      this.add.text(W / 2, Math.round(H * 0.875) + 96, `これまでに ${plays}回、海へ行きました`, {
        fontFamily: FONT_BODY, fontSize: '26px', color: COLOR.cream,
      }).setOrigin(0.5).setDepth(40);
    }
    this.add.text(W - 22, H - 18, Save.available ? GAME_VERSION : `${GAME_VERSION} 保存オフ`, {
      fontFamily: FONT_BODY, fontSize: '20px', color: COLOR.cream,
    }).setOrigin(1, 1).setAlpha(0.65).setDepth(40);
    this.add.text(22, H - 18, '魚と料理の絵はAIで作成しました', {
      fontFamily: FONT_BODY, fontSize: '22px', color: COLOR.cream,
    }).setOrigin(0, 1).setAlpha(0.65).setDepth(40);

    this.input.keyboard.once('keydown-ENTER', () => this.start());
  }

  // 題字を、右から左へ縦書きで並べる
  addVerticalTitle() {
    const size = 112;
    const pitch = 122;
    const columns = [
      { text: 'つって', x: W * 0.76, y: H * 0.075 },
      { text: 'さばいて', x: W * 0.5, y: H * 0.075 + 66 },
      { text: 'たべる', x: W * 0.24, y: H * 0.075 + 190 },
    ];
    let order = 0;
    for (const column of columns) {
      [...column.text].forEach((char, i) => {
        // 小さい「っ」は、縦書きでは右上に寄せる
        const small = 'っゃゅょぁぃぅぇぉ'.includes(char);
        const x = column.x + (small ? size * 0.14 : 0);
        const y = column.y + i * pitch - (small ? size * 0.14 : 0);
        const glyph = this.add.text(x, y, char, {
          fontFamily: FONT_TITLE, fontSize: `${size}px`, fontStyle: '600', color: COLOR.cream,
          padding: { x: 14, y: 14 },
        }).setOrigin(0.5).setDepth(30).setShadow(0, 3, 'rgba(40,44,96,0.45)', 12);
        if (!REDUCE_MOTION) {
          glyph.setAlpha(0);
          this.tweens.add({ targets: glyph, alpha: 1, duration: 620, delay: 220 + order * 90, ease: 'Sine.easeOut' });
        }
        order += 1;
      });
    }
  }

  start() {
    if (this.leaving) return;
    this.leaving = true;
    Save.data.plays += 1;
    Save.commit();
    changeScene(this, 'Harbor');
  }

  update(time) {
    this.dawn.update(time);
    const pace = REDUCE_MOTION ? 0.15 : 1;

    for (const glint of this.glints) {
      glint.image.setAlpha(0.2 + 0.7 * Math.abs(Math.sin(time * glint.speed * pace + glint.phase)));
    }

    this.float.y = this.floatY + Math.sin(time * 0.0016 * pace) * 6;
    this.line.clear();
    this.line.lineStyle(1.5, 0x3b3f63, 0.55);
    this.line.lineBetween(ROD_TIP.x, ROD_TIP.y, this.float.x, this.float.y - 26);

    for (const gull of this.gulls) {
      gull.x += gull.speed * this.game.loop.delta * pace;
      if (gull.x > W + 80) gull.x = -80;
      gull.image.x = gull.x;
      gull.image.setScale(gull.scale, gull.scale * (0.7 + 0.35 * Math.sin(time * 0.004 * pace + gull.phase)));
    }
  }
}

    this.dawn.update(time);
  }
}

      this.contestBoard = this.add.text(22, 96, '', {
        fontFamily: FONT_BODY, fontSize: '26px', color: COLOR.cream, lineSpacing: 6,
        backgroundColor: 'rgba(20,28,60,0.55)', padding: { x: 14, y: 10 },
      }).setDepth(44);
      this.drawContest();
    }

    // 動きの状態
    this.pressed = false;
    this.rodBack = 0;
    this.bend = 0;
    this.dip = 0;
    this.dipTarget = 0;
    this.side = 0;
    this.sink = 0;
    this.jitter = 0;
    this.overlay = [];

    this.setupInput();
    Sound.startSea();
    this.enterReady();
  }

  /* ---------- 画面の部品 ---------- */

  buildHud() {
    const shadow = (t) => t.setDepth(31).setShadow(0, 2, 'rgba(26,40,80,0.6)', 6);
    this.hud = this.add.graphics().setDepth(30);
    this.message = this.add.text(W / 2, Math.max(330, H * 0.22), '', {
      fontFamily: FONT_BODY, fontSize: '46px', fontStyle: 'bold', color: COLOR.cream, align: 'center', padding: { x: 8, y: 8 },
    }).setOrigin(0.5).setDepth(31).setShadow(0, 3, 'rgba(26,40,80,0.65)', 10);
    this.tensionLabel = shadow(this.add.text(90, 132, '糸の張り', {
      fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream,
    }).setOrigin(0, 0.5));
    this.distLabel = shadow(this.add.text(W - 90, 132, '', {
      fontFamily: FONT_BODY, fontSize: '30px', fontStyle: 'bold', color: COLOR.cream,
    }).setOrigin(1, 0.5));
    this.status = shadow(this.add.text(W / 2, 228, '', {
      fontFamily: FONT_BODY, fontSize: '30px', fontStyle: 'bold', color: COLOR.cream,
    }).setOrigin(0.5));

    createTextButton(this, 22, 56, this.contestKind ? '← 棄権する' : '← 港へ', (t) => {
      if (this.leaving) return;
      // 大会中は、押しまちがいで終わらないよう2回目で棄権する
      if (this.contest && !this.quitAsked) {
        this.quitAsked = true;
        t.setText('← もう一度押すと棄権');
        this.time.delayedCall(2500, () => { this.quitAsked = false; if (t.active) t.setText('← 棄権する'); });
        return;
      }
      if (this.contest) { this.finishContest(true); return; }
      this.leaving = true;
      changeScene(this, 'Harbor');
    });
    const soundLabel = () => (Save.data.sound ? '音：あり' : '音：なし');
    createTextButton(this, W - 22, 56, soundLabel(), (t) => {
      Sound.setEnabled(!Save.data.sound);
      t.setText(soundLabel());
    }, 1);
  }

  // 下の大きいボタン。画面のどこを押しても同じ動きをする
  buildAction() {
    bake(this, 'button', 420, 136, paintButton);
    const y = Math.round(H * 0.875);
    this.actionY = y;
    this.actionBox = this.add.container(W / 2, y).setDepth(40);
    this.actionImage = this.add.image(0, 0, 'button');
    this.actionText = this.add.text(0, -2, '', {
      fontFamily: FONT_BODY, fontSize: '50px', fontStyle: 'bold', color: COLOR.ink,
    }).setOrigin(0.5);
    this.actionBox.add([this.actionImage, this.actionText]);
    this.hint = this.add.text(W / 2, y + 92, '', {
      fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream, align: 'center',
    }).setOrigin(0.5).setDepth(40).setShadow(0, 2, 'rgba(26,40,80,0.7)', 6);
  }

  setAction(label, urgent = false) {
    this.actionText.setText(label);
    this.actionBox.setVisible(true);
    if (urgent) this.actionImage.setTint(0xffc65c);
    else this.actionImage.clearTint();
  }

  say(text) { this.message.setText(text); }

  setupInput() {
    this.input.on('pointerdown', (pointer, over) => {
      if (over.length > 0) return;   // 「港へ」などの上で押したときは、釣りの操作にしない
      this.onPress();
    });
    const release = () => this.onRelease();
    this.input.on('pointerup', release);
    this.input.on('pointerupoutside', release);

    const space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    space.on('down', () => this.onPress());
    space.on('up', release);

    // 途中で別のアプリに切りかえたら、押しっぱなしのままにしない
    const onHidden = () => {
      this.pressed = false;
      if (this.state === 'charging') this.enterReady();
    };
    this.game.events.on('hidden', onHidden);
    this.game.events.on('blur', onHidden);

    if (this.useMotion) Motion.onSwing((s) => this.onSwing(s));

    this.events.once('shutdown', () => {
      this.game.events.off('hidden', onHidden);
      this.game.events.off('blur', onHidden);
      Motion.onSwing(null);
      Sound.stopSea();
    });
  }

  /* ---------- 操作 ---------- */

  onPress() {
    Sound.unlock();
    Sound.startSea();
    if (this.pressed) return;
    this.pressed = true;
    Buzz.tap();
    switch (this.state) {
      case 'ready':
        this.state = 'charging';
        this.chargeT = 0;
        this.charge = 0;
        this.setAction('はなすと飛ぶ');
        this.hint.setText('強いほど遠くへ飛ぶよ');
        break;
      case 'waiting':
      case 'nibble':
        this.earlyStrike();
        break;
      case 'bite':
        this.strike();
        break;
      default:
        break;
    }
  }

  onRelease() {
    if (!this.pressed) return;
    this.pressed = false;
    if (this.state === 'charging') this.cast(this.charge);
  }

  onSwing(strength) {
    if (this.state === 'ready') {
      this.cast(0.35 + 0.65 * strength);
    } else if (this.state === 'bite') {
      this.strike();
    } else if ((this.state === 'waiting' || this.state === 'nibble') && this.fishNear) {
      this.earlyStrike();
    }
  }

  /* ---------- 段取り ---------- */

  enterReady() {
    // 大会で、投げきったかキープがそろったら終わり
    const c = this.contest;
    if (c && !c.over && (c.kept.length >= CONTEST_KEEP || c.cast >= c.def.casts)) { this.finishContest(false); return; }
    this.state = 'ready';
    this.castD = 0;
    this.fish = null;
    this.fishNear = false;
    this.dipTarget = 0;
    this.side = 0;
    this.sink = 0;
    this.float.setAlpha(1);
    this.shadow.setAlpha(0);
    this.say('');
    this.status.setText('');
    this.setFightHud(false);
    this.setAction('投げる');
    this.hint.setText(this.useMotion ? '押してためて、はなす（スマホを振ってもOK）' : '押してためて、はなす');
  }

  cast(power) {
    // 釣りに1回行くと1日進む（港へもどるだけなら進まないよう、最初に投げたときに数える）
    if (!this.dayCounted) {
      this.dayCounted = true;
      Keep.nextDay();
      if (this.contest) { Save.data.contestDay = Save.data.day; Save.commit(); }   // 大会は1日1回
    }
    if (this.contest) { this.contest.cast += 1; this.drawContest(); }
    this.state = 'flying';
    const p = Math.max(0.08, power);
    this.castD = 0.22 + 0.78 * p;
    const tip = this.rodTip(this.time.now);
    this.fly = { t: 0, dur: 0.55 + 0.45 * p, x: tip.x, y: tip.y + 84 };
    this.flyKick = 0.16;
    this.hint.setText('');
    this.setAction('…');
    Sound.cast();
  }

  enterWaiting() {
    this.state = 'waiting';
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 3.2);
    Sound.splash();
    this.fish = pickFish(this.castD, this.rates);
    this.shadow.setTexture(`fish-${this.fish.id}`);
    this.fishNear = false;
    this.nibblesLeft = Phaser.Math.Between(this.fish.game.nibbles[0], this.fish.game.nibbles[1]);
    // 釣れやすい組み合わせほど早くアタリが来て、合わないとアタリがないこともある
    const rate = this.rates[window.fishData.fish.indexOf(this.fish)];
    this.noBite = Math.random() > Trip.biteChance(rate);
    this.waitT = randBetween(2.2, 5.2) / Phaser.Math.Clamp(Math.sqrt(rate), 0.6, 1.5);
    this.say('');
    this.setAction('合わせる');
    this.hint.setText(this.useMotion ? 'ウキがしずんだら、押すか振る' : 'ウキがしずんだら押す');
  }

  startNibble() {
    this.state = 'nibble';
    this.nibbleT = 0.38;
    this.fishNear = true;
    this.dipTarget = 0.34;
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 1.8);
    Sound.nibble();
    Buzz.pulse(15);
    this.say('ピクッ…まだ待って');
  }

  startBite() {
    this.state = 'bite';
    const extra = this.useMotion ? 0.25 : 0;   // 振るのは押すより時間がかかるので少し長く待つ
    this.biteTotal = this.fish.game.biteWindowMs / 1000 + extra;
    this.biteT = this.biteTotal;
    this.dipTarget = 1;
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 4.2);
    Sound.bite();
    Buzz.pulse([60, 30, 90]);
    this.shake(120, 0.008);
    this.say('今だ！');
    this.setAction('合わせる！', true);
  }

  earlyStrike() {
    if (this.fishNear) {
      this.fail('早すぎて、にげられた…');
      return;
    }
    this.say('まだアタリがないよ');
    this.waitT += 0.3;
    this.time.delayedCall(800, () => {
      if (this.state === 'waiting' && this.message.text === 'まだアタリがないよ') this.say('');
    });
  }

  strike() {
    const quick = this.biteT / this.biteTotal > 0.6;
    const game = this.fish.game;
    const style = FIGHT_STYLES[game.fight];
    const r = Math.pow(Math.random(), 1.6);   // 小さめが多く、大物はたまに
    this.sizeRatio = r;
    this.sizeCm = game.sizeCm[0] + (game.sizeCm[1] - game.sizeCm[0]) * r;
    this.pullScale = 0.9 + 0.25 * r;

    this.state = 'fight';
    this.style = style;
    this.D = Math.max(0.18, this.castD - (quick ? 0.06 : 0));
    this.startD = this.D;
    this.T = 0.5;
    this.holdTime = 0;
    this.slack = 0;
    this.over = 0;
    this.phase = 'calm';
    this.phaseT = style.first || randBetween(style.calm[0], style.calm[1]);
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.tickT = 0;
    this.buzzT = 0;
    this.dipTarget = 0;

    Sound.hook();
    Buzz.pulse(70);
    this.shake(160, 0.01);
    this.say(quick ? 'いいタイミング！' : 'かかった！');
    this.setAction('押して巻く');
    this.hint.setText('押すと巻く・はなすと緩む');
    this.setFightHud(true);
  }

  fail(text, snapped = false) {
    this.state = 'failed';
    this.failT = 1.7;
    this.dipTarget = 0;
    this.say(text);
    this.status.setText('');
    this.hint.setText('');
    this.actionBox.setVisible(false);
    this.setFightHud(false);
    this.shadow.setAlpha(0);
    if (snapped) { Sound.snap(); Buzz.pulse(120); this.shake(180, 0.012); }
    else Sound.miss();
  }

  landFish() {
    this.state = 'caught';
    const game = this.fish.game;
    const weight = game.weightA * Math.pow(this.sizeCm, 3);
    const count = (this.registry.get('todayCount') || 0) + 1;
    this.registry.set('todayCount', count);
    const bookNotes = Book.recordCatch(this.fish, this.sizeCm, weight);

    this.setFightHud(false);
    this.say('');
    this.status.setText('');
    this.hint.setText('');
    this.actionBox.setVisible(false);
    this.float.setAlpha(0);
    this.shadow.setAlpha(0);
    Sound.caught();
    Buzz.pulse([40, 40, 40, 40, 160]);
    if (!REDUCE_MOTION) this.cameras.main.flash(260, 255, 246, 230);

    const items = [];
    const add = (obj) => { obj.setDepth(62); items.push(obj); return obj; };
    const dim = this.add.rectangle(0, 0, W, H, 0x24305a, 0.72).setOrigin(0).setDepth(60);
    items.push(dim);

    // 注意文がある魚は、短い画面でもボタンに重ならないよう全体を少し上げる
    const catchNote = this.fish.safety.catchNote;
    const showNote = !!(catchNote && catchNote.status === '確認済み' && catchNote.value);
    const cy = H * 0.42 - (showNote ? 70 : 0);
    add(this.add.text(W / 2, cy - 330, this.sizeRatio >= 0.72 ? '大物だ！' : '釣れた！', {
      fontFamily: FONT_TITLE, fontSize: '84px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
    }).setOrigin(0.5).setShadow(0, 3, 'rgba(20,28,60,0.6)', 12));

    const art = add(this.add.image(W / 2, cy - 60, `fish-${this.fish.id}`));
    const finalScale = (1.05 + this.sizeRatio * 0.2) * (560 / FISH_BAKE.w);
    if (REDUCE_MOTION) {
      art.setScale(finalScale);
    } else {
      art.setScale(0.1).setAngle(-24);
      this.tweens.add({ targets: art, scale: finalScale, angle: 0, duration: 520, ease: 'Back.easeOut' });
      this.tweens.add({ targets: art, y: art.y - 12, duration: 900, delay: 520, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      this.spray(W / 2, cy - 60);
    }

    add(this.add.text(W / 2, cy + 112, this.fish.name, {
      fontFamily: FONT_TITLE, fontSize: '92px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
    }).setOrigin(0.5));
    add(this.add.text(W / 2, cy + 214, `${this.sizeCm.toFixed(1)} cm　/　${Math.round(weight)} g`, {
      fontFamily: FONT_BODY, fontSize: '50px', fontStyle: 'bold', color: '#ffe0a6',
    }).setOrigin(0.5));
    if (this.fish.photo === false) {
      add(this.add.text(W / 2 + 250, cy + 40, '仮の絵', { fontFamily: FONT_BODY, fontSize: '24px', color: COLOR.cream }).setOrigin(0.5).setAlpha(0.7));
    }
    add(this.add.text(W / 2, cy + 278, `今日の${count}ひき目`, {
      fontFamily: FONT_BODY, fontSize: '32px', color: COLOR.cream,
    }).setOrigin(0.5));

    // 釣れた画面の注意。データに catchNote がある魚（今はサバだけ）に出す
    if (showNote) {
      add(bodyText(this, W / 2, cy + 322, catchNote.value, 30, { color: '#ffe0a6', width: W - 120, lineSpacing: 6, depth: 62 }));
    }

    let leaving = false;
    const backTo = () => {
      for (const item of this.overlay) item.destroy();
      this.overlay = [];
      this.enterReady();
    };
    const water = this.trip.spot.id === 'keiryu' ? '川' : '海';
    // ごほうびの知らせを、釣れた画面の文字に重ならない場所に出す
    const toastLow = (notes) => {
      rewardToast(this, notes);
      if (this.toast && notes && notes.length) this.toast.setDepth(75).setY(Math.round(H * 0.7));
    };
    if (this.contestBoard) this.contestBoard.setVisible(false);
    if (this.contest) {
      // 大会：キープかリリースを選ぶ。キープした魚は、あとから帰せない
      const c = this.contest;
      toastLow(bookNotes);
      if (!isNoEat(this.fish)) {
        const keep = createButton(this, W / 2, Math.round(H * 0.82), `キープする（${c.kept.length + 1}/${CONTEST_KEEP}）`, () => {
          if (leaving) return;
          leaving = true;
          c.kept.push({ fishId: this.fish.id, sizeCm: this.sizeCm, weight });
          this.drawContest();
          backTo();
        }, 42);
        keep.setDepth(70);
        items.push(keep);
      }
      const release = createTextButton(this, W / 2, Math.round(H * 0.925),
        isNoEat(this.fish) ? `この魚はキープできない。${water}に帰す` : `リリースして、次を投げる（のこり${c.def.casts - c.cast}投）`, () => {
          if (leaving) return;
          leaving = true;
          backTo();
        }, 0.5);
      release.setDepth(70);
      items.push(release);
      this.overlay = items;
      return;
    }
    if (!isNoEat(this.fish)) {
      const take = createButton(this, W / 2, Math.round(H * 0.82), '持ち帰る', () => {
        if (leaving) return;
        leaving = true;
        changeScene(this, 'Cooler', { fish: this.fish, sizeCm: this.sizeCm, weight, bookNotes });
      }, 48);
      take.setDepth(70);
      items.push(take);
    } else {
      toastLow(bookNotes);   // 食べない魚は持ち帰らないので、ごほうびはここで知らせる
    }
    const again = createTextButton(this, W / 2, Math.round(H * 0.925), `${water}に帰して、もう一回投げる`, () => {
      if (leaving) return;
      backTo();
    }, 0.5);
    again.setDepth(70);
    items.push(again);
    this.overlay = items;
  }

  /* ---------- 釣り大会 ---------- */

  drawContest() {
    const c = this.contest;
    if (!c || !this.contestBoard) return;
    const kg = (g) => `${(g / 1000).toFixed(2)}kg`;
    const mine = c.kept.reduce((s, x) => s + x.weight, 0);
    const lines = [`${c.def.name}　${Math.min(c.cast, c.def.casts)}/${c.def.casts}投`, `あなた　${c.kept.length}匹 ${kg(mine)}`];
    for (const rival of c.rivals) {
      const shown = Contest.shown(c, rival);
      lines.push(shown ? `${rival.name}　${shown.length}匹 ${kg(shown.reduce((s, x) => s + x.weight, 0))}` : `${rival.name}　？？？`);
    }
    if (c.cast >= c.def.reveal) lines.push(c.cast > c.def.reveal ? 'ここから相手の釣果は見えない' : '次の投げから、相手の釣果は見えなくなる');
    this.contestBoard.setText(lines.join('\n'));
  }

  // 大会の結果。キープした魚は冷蔵庫に入れる
  finishContest(quit) {
    const c = this.contest;
    if (!c || c.over) return;
    c.over = true;
    this.state = 'contestEnd';
    this.actionBox.setVisible(false);
    this.hint.setText('');
    this.say('');
    for (const x of c.kept) Keep.add({ fish: fishById(x.fishId), sizeCm: x.sizeCm, weight: x.weight, fresh: 0.75 });
    let total = 0;
    const res = quit ? null : Contest.results(c);
    if (res) {
      total = [...res.weight, ...res.size].filter((p) => p.me).reduce((s, p) => s + p.prize, 0);
      Save.data.money += total;
      Book.pushLog('contestLog', { day: Save.data.day, kind: c.kind, prize: total });
    }
    Save.commit();
    contestResultPanel(c, res, total, quit, () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Harbor');
    });
  }

  /* ---------- 演出 ---------- */

  shake(ms, power) {
    if (!REDUCE_MOTION) this.cameras.main.shake(ms, power);
  }

  ripple(x, y, size) {
    const g = this.add.graphics({ x, y }).setDepth(9);
    g.lineStyle(3, 0xfff6e6, 0.85);
    g.strokeEllipse(0, 0, 52, 15);
    this.tweens.add({
      targets: g, scaleX: size, scaleY: size, alpha: 0, duration: 760, ease: 'Sine.easeOut',
      onComplete: () => g.destroy(),
    });
  }

  // 釣れた瞬間の水しぶき
  spray(x, y) {
    for (let i = 0; i < 22; i++) {
      const dot = this.add.circle(x, y, 4 + Math.random() * 9, 0xfff6e6, 0.9).setDepth(61);
      const a = Math.random() * TAU;
      const r = 180 + Math.random() * 240;
      this.tweens.add({
        targets: dot, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * 0.75 + 70, alpha: 0, scale: 0.3,
        duration: 620 + Math.random() * 300, ease: 'Cubic.easeOut', onComplete: () => dot.destroy(),
      });
    }
  }

  setFightHud(on) {
    this.fightHud = on;
    if (this.contestBoard) this.contestBoard.setVisible(!on);   // やり取りの間は、大会の表を隠す
    this.tensionLabel.setVisible(on);
    this.distLabel.setVisible(on);
    this.status.setVisible(on);
  }

  // 竿の先の場所。ためると後ろへ、魚がかかるとしなる
  rodTip(time) {
    const shakeWarn = this.state === 'fight' && this.phase === 'warn' ? Math.sin(time * 0.07) * 9 : 0;
    return {
      x: ROD_TIP.x - this.rodBack * 190 - this.bend * 12,
      y: ROD_TIP.y - this.rodBack * 60 + this.bend * 85 + shakeWarn,
    };
  }

  /* ---------- 毎フレームの処理 ---------- */

  update(time, delta) {
    this.dawn.update(time);
    const dt = Math.min(delta, 50) / 1000;

    switch (this.state) {
      case 'charging': this.updateCharging(dt); break;
      case 'flying':
        this.fly.t += dt / this.fly.dur;
        this.flyKick -= dt;
        if (this.fly.t >= 1) this.enterWaiting();
        break;
      case 'waiting':
        this.waitT -= dt;
        if (this.waitT <= 0) {
          if (this.noBite) this.fail('アタリがなかった…\n投げ直そう');
          else if (this.nibblesLeft > 0) this.startNibble();
          else this.startBite();
        }
        break;
      case 'nibble':
        this.nibbleT -= dt;
        if (this.nibbleT <= 0) {
          this.nibblesLeft -= 1;
          this.dipTarget = 0;
          this.state = 'waiting';
          this.waitT = randBetween(0.7, 1.6);
          this.say('');
        }
        break;
      case 'bite':
        this.biteT -= dt;
        if (this.biteT <= 0) this.fail('エサだけ取られた…');
        break;
      case 'fight': this.updateFight(dt); break;
      case 'failed':
        this.failT -= dt;
        if (this.failT <= 0) this.enterReady();
        break;
      default: break;
    }

    this.drawWorld(time, dt);
    this.drawHud();
  }

  updateCharging(dt) {
    this.chargeT += dt;
    // 0→1→0 をくり返すので、いちばん強いところではなす楽しみがある
    const phase = (this.chargeT / 1.15) % 2;
    this.charge = phase <= 1 ? phase : 2 - phase;
  }

  updateFight(dt) {
    const style = this.style;
    const power = this.fish.game.power;

    // おとなしい → 合図 → 強く引く、をくり返す
    this.phaseT -= dt;
    if (this.phaseT <= 0) {
      if (this.phase === 'calm') {
        this.phase = 'warn';
        this.phaseT = style.warn;
        this.dir = Math.random() < 0.5 ? -1 : 1;
        this.say(style.warnText);
        Sound.warn();
        Buzz.pulse(30);
      } else if (this.phase === 'warn') {
        this.phase = 'surge';
        this.phaseT = style.surge;
        this.say(style.surgeText);
        Sound.surge();
        Buzz.pulse(Math.round(style.surge * 1000 * 0.5));
        this.shake(style.surge * 400, 0.005);
      } else {
        this.phase = 'calm';
        this.phaseT = randBetween(style.calm[0], style.calm[1]);
        this.say('');
      }
    }

    const surging = this.phase === 'surge';
    const pull = (surging ? 0.55 + power * 0.1 : 0.12 + power * 0.03) * this.pullScale;
    const holding = this.pressed;

    // 糸の張りは、目標の値へなめらかに近づく
    // 押しっぱなしだと張りがじわじわ上がるので、ときどき緩める必要がある
    this.holdTime = holding ? this.holdTime + dt : Math.max(0, this.holdTime - dt * 2.5);
    let target = holding ? 0.5 + pull * 0.6 + this.holdTime * HOLD_STRAIN : pull * 0.45;
    if (surging && style.dive) target = Math.min(target, 0.97);   // 潜るときは、こらえれば切れない
    this.T += (target - this.T) * (1 - Math.exp(-(holding ? 1.6 : 2.2) * dt));
    this.T = Math.min(1, Math.max(0, this.T));

    // 巻くと寄り、緩めると糸が出る
    if (holding) this.D -= style.reel * (surging ? 0.1 : 1) * dt;
    else this.D += style.out * (surging ? 1 : 0.12) * dt;

    // 走る・潜るの見た目
    const follow = 1 - Math.exp(-3.2 * dt);
    this.side += ((surging ? this.dir * style.side : 0) - this.side) * follow;
    this.sink += ((surging && style.dive ? 1 : 0) - this.sink) * follow;

    // リールの音と、引いているときの振動
    if (holding) {
      this.tickT -= dt;
      if (this.tickT <= 0) {
        this.tickT = 0.09 - this.T * 0.04;
        Sound.tick(this.T);
      }
    }
    this.buzzT -= dt;
    if (holding && surging && this.buzzT <= 0) {
      this.buzzT = 0.16;
      Buzz.pulse(60);
    }

    // 切れそう・ゆるいの声かけ
    if (surging && style.dive) this.status.setText('');   // 潜るときは「こらえて」の声かけを優先する
    else if (this.T >= TENSION_DANGER) this.status.setText('切れそう！ はなして！').setColor('#ffb3a0');
    else if (this.T <= TENSION_SLACK) this.status.setText('ゆるい！ 巻いて！').setColor('#bfe0ff');
    else this.status.setText('');

    // 勝ち負けの判定
    this.over = this.T >= 1 ? this.over + dt : 0;
    this.slack = this.T < TENSION_SLACK ? this.slack + dt : Math.max(0, this.slack - dt * 2);

    if (this.over >= 0.25) this.fail('糸が切れた…', true);
    else if (this.slack >= 1.3) this.fail('糸がゆるんで、バレた…');
    else if (this.D > this.startD + style.extra) this.fail(style.escapeText, true);
    else if (this.D <= 0) this.landFish();
  }

  drawWorld(time, dt) {
    // 竿のしなりと、投げるときの動き
    let rodTarget = 0;
    if (this.state === 'charging') rodTarget = 0.25 + this.charge * 0.75;
    else if (this.state === 'flying' && this.flyKick > 0) rodTarget = -0.22;
    this.rodBack += (rodTarget - this.rodBack) * (1 - Math.exp(-(this.state === 'charging' ? 16 : 22) * dt));
    const bendTarget = this.state === 'fight' ? this.T : (this.state === 'bite' ? 0.3 : 0);
    this.bend += (bendTarget - this.bend) * (1 - Math.exp(-9 * dt));
    this.dip += (this.dipTarget - this.dip) * (1 - Math.exp(-26 * dt));

    const tip = this.rodTip(time);
    const bob = Math.sin(time * 0.0016 * this.motionPace);

    // ウキの場所
    let fx;
    let fy;
    let scale = 1;
    let sag = 40;
    let taut = false;
    if (this.state === 'ready' || this.state === 'charging') {
      fx = tip.x + bob * 2;
      fy = tip.y + 84;
      scale = 0.8;
      sag = 0;
      taut = true;
    } else if (this.state === 'flying') {
      const t = Math.min(1, this.fly.t);
      const to = waterPoint(this.castD);
      fx = this.fly.x + (to.x - this.fly.x) * t;
      fy = this.fly.y + (to.y - this.fly.y) * t - Math.sin(t * Math.PI) * (200 + this.castD * 170);
      scale = 0.8 + (to.scale - 0.8) * t;
      sag = 20;
    } else if (this.state === 'fight') {
      const p = waterPoint(this.D);
      const wiggle = this.phase === 'surge' ? Math.sin(time * 0.05) * 6 : Math.sin(time * 0.012) * 3;
      fx = p.x + this.side * 130 + wiggle;
      fy = p.y + this.sink * 26 + bob * 3;
      scale = p.scale;
      sag = Math.pow(1 - this.T, 2) * 90;
      this.float.setAlpha(1 - this.sink * 0.65);
      // 岸に近づくと魚の影が見える
      if (this.D < 0.3) {
        this.shadow.setPosition(fx - 8, fy + 40).setAlpha(((0.3 - this.D) / 0.3) * 0.6);
        this.shadow.setFlipX(this.side > 0.1);
      }
    } else {
      const p = waterPoint(this.castD);
      fx = p.x;
      fy = p.y + bob * 6 + this.dip * 36 * p.scale;
      scale = p.scale;
      this.float.setAlpha(1 - this.dip * 0.55);
    }
    if (this.state === 'failed') this.float.setAlpha(Math.max(0, this.failT / 1.7));
    this.float.setPosition(fx, fy).setScale(scale);

    // 竿と糸
    const g = this.world;
    g.clear();
    if (this.state === 'caught') return;
    const baseX = 270;
    const baseY = SHORE_TOP + 232;
    g.lineStyle(4.5, 0x343757, 1);
    g.beginPath();
    g.moveTo(baseX, baseY);
    const ctrl = { x: 350 - this.rodBack * 110, y: SHORE_TOP + 110 - this.rodBack * 30 - this.bend * 10 };
    for (let i = 1; i <= 14; i++) {
      const t = i / 14;
      const u = 1 - t;
      g.lineTo(u * u * baseX + 2 * u * t * ctrl.x + t * t * tip.x, u * u * baseY + 2 * u * t * ctrl.y + t * t * tip.y);
    }
    g.strokePath();

    const warn = this.state === 'fight' && this.phase !== 'calm';
    g.lineStyle(warn ? 3 : 2, warn ? 0xffb04a : 0xfff6e6, warn ? 1 : 0.75);
    const endY = fy - 26 * scale;
    if (this.state !== 'failed' || this.failT > 1.2) {
      g.beginPath();
      g.moveTo(tip.x, tip.y);
      const midX = (tip.x + fx) / 2;
      const midY = (tip.y + endY) / 2 + (taut ? 0 : sag);
      for (let i = 1; i <= 18; i++) {
        const t = i / 18;
        const u = 1 - t;
        g.lineTo(u * u * tip.x + 2 * u * t * midX + t * t * fx, u * u * tip.y + 2 * u * t * midY + t * t * endY);
      }
      g.strokePath();
    }
  }

  drawHud() {
    const g = this.hud;
    g.clear();

    // 投げる強さのゲージ
    if (this.state === 'charging') {
      const bw = 460;
      const x = (W - bw) / 2;
      const y = this.actionY - 112;
      g.fillStyle(0x24305a, 0.6);
      g.fillRoundedRect(x - 8, y - 8, bw + 16, 42, 21);
      g.fillStyle(0xffc65c, 1);
      g.fillRoundedRect(x, y, Math.max(26, bw * this.charge), 26, 13);
    }

    if (!this.fightHud) return;

    const x = 90;
    const bw = W - 180;
    const y = 158;
    const bh = 34;
    g.fillStyle(0x24305a, 0.62);
    g.fillRoundedRect(x - 30, 104, bw + 60, 150, 20);
    // ゆるい／ちょうどいい／切れそう の3つの帯
    const a = bw * TENSION_SLACK;
    const b = bw * TENSION_DANGER;
    g.fillStyle(0x7fb2e0, 1);
    g.fillRect(x, y, a, bh);
    g.fillStyle(0x8fcf9b, 1);
    g.fillRect(x + a, y, b - a, bh);
    g.fillStyle(0xe2705c, 1);
    g.fillRect(x + b, y, bw - b, bh);
    // 今の張り
    const mx = x + bw * this.T;
    g.fillStyle(0xffffff, 1);
    g.fillRect(mx - 6, y - 9, 12, bh + 18);
    g.lineStyle(2, 0x27406a, 1);
    g.strokeRect(mx - 6, y - 9, 12, bh + 18);

    this.distLabel.setText(`岸まで ${Math.max(0, Math.ceil(this.D * METERS_PER_DIST))} m`);
  }
}
