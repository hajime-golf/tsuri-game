  }

  update(time) {
    this.dawn.update(time);
  }
}

// 堤防での釣り。投げる → アタリ → 合わせる → やり取り → 釣れた
class FishingScene extends Phaser.Scene {
  constructor() { super('Fishing'); }

  preload() { preloadFishPhotos(this); }

  init(data) {
    this.useMotion = !!(data && data.motion);
  }

  create() {
    this.leaving = false;
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 400, 60, 71, 112);
    this.dawn = createDawn(this);
    this.motionPace = REDUCE_MOTION ? 0.15 : 1;

    bake(this, 'shoreNoRod', W, 500, (ctx, w, h) => paintShore(ctx, w, h, true));
    this.add.image(0, SHORE_TOP, 'shoreNoRod').setOrigin(0).setDepth(5);
    bake(this, 'float', 26, 56, paintFloat);
    for (const fish of window.fishData.fish) {
      bake(this, `fish-${fish.id}`, FISH_BAKE.w, FISH_BAKE.h, (ctx, w, h) => paintFish(ctx, w, h, fish.id));
    }

    this.world = this.add.graphics().setDepth(9);
    this.float = this.add.image(0, 0, 'float').setDepth(9);
    this.shadow = this.add.image(0, 0, `fish-${window.fishData.fish[0].id}`)
      .setDepth(9).setTint(0x1c3552).setAlpha(0).setScale(0.22 * (560 / FISH_BAKE.w));

    this.buildHud();
    this.buildAction();

    // 動きの状態
    this.pressed = false;
    this.rodBack = 0;
    this.bend = 0;
    this.dip = 0;
    this.dipTarget = 0;
    this.side = 0;
    this.sink = 0;
    this.jitter = 0;
    this.overlay = [];

    this.setupInput();
    Sound.startSea();
    this.enterReady();
  }

  /* ---------- 画面の部品 ---------- */

  buildHud() {
    const shadow = (t) => t.setDepth(31).setShadow(0, 2, 'rgba(26,40,80,0.6)', 6);
    this.hud = this.add.graphics().setDepth(30);
    this.message = this.add.text(W / 2, Math.max(330, H * 0.22), '', {
      fontFamily: FONT_BODY, fontSize: '46px', fontStyle: 'bold', color: COLOR.cream, align: 'center', padding: { x: 8, y: 8 },
    }).setOrigin(0.5).setDepth(31).setShadow(0, 3, 'rgba(26,40,80,0.65)', 10);
    this.tensionLabel = shadow(this.add.text(90, 132, '糸の張り', {
      fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream,
    }).setOrigin(0, 0.5));
    this.distLabel = shadow(this.add.text(W - 90, 132, '', {
      fontFamily: FONT_BODY, fontSize: '30px', fontStyle: 'bold', color: COLOR.cream,
    }).setOrigin(1, 0.5));
    this.status = shadow(this.add.text(W / 2, 228, '', {
      fontFamily: FONT_BODY, fontSize: '30px', fontStyle: 'bold', color: COLOR.cream,
    }).setOrigin(0.5));

    createTextButton(this, 22, 56, '← 港へ', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Harbor');
    });
    const soundLabel = () => (Save.data.sound ? '音：あり' : '音：なし');
    createTextButton(this, W - 22, 56, soundLabel(), (t) => {
      Sound.setEnabled(!Save.data.sound);
      t.setText(soundLabel());
    }, 1);
  }

  // 下の大きいボタン。画面のどこを押しても同じ動きをする
  buildAction() {
    bake(this, 'button', 420, 136, paintButton);
    const y = Math.round(H * 0.875);
    this.actionY = y;
    this.actionBox = this.add.container(W / 2, y).setDepth(40);
    this.actionImage = this.add.image(0, 0, 'button');
    this.actionText = this.add.text(0, -2, '', {
      fontFamily: FONT_BODY, fontSize: '50px', fontStyle: 'bold', color: COLOR.ink,
    }).setOrigin(0.5);
    this.actionBox.add([this.actionImage, this.actionText]);
    this.hint = this.add.text(W / 2, y + 92, '', {
      fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream, align: 'center',
    }).setOrigin(0.5).setDepth(40).setShadow(0, 2, 'rgba(26,40,80,0.7)', 6);
  }

  setAction(label, urgent = false) {
    this.actionText.setText(label);
    this.actionBox.setVisible(true);
    if (urgent) this.actionImage.setTint(0xffc65c);
    else this.actionImage.clearTint();
  }

  say(text) { this.message.setText(text); }

  setupInput() {
    this.input.on('pointerdown', (pointer, over) => {
      if (over.length > 0) return;   // 「港へ」などの上で押したときは、釣りの操作にしない
      this.onPress();
    });
    const release = () => this.onRelease();
    this.input.on('pointerup', release);
    this.input.on('pointerupoutside', release);

    const space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    space.on('down', () => this.onPress());
    space.on('up', release);

    // 途中で別のアプリに切りかえたら、押しっぱなしのままにしない
    const onHidden = () => {
      this.pressed = false;
      if (this.state === 'charging') this.enterReady();
    };
    this.game.events.on('hidden', onHidden);
    this.game.events.on('blur', onHidden);

    if (this.useMotion) Motion.onSwing((s) => this.onSwing(s));

    this.events.once('shutdown', () => {
      this.game.events.off('hidden', onHidden);
      this.game.events.off('blur', onHidden);
      Motion.onSwing(null);
      Sound.stopSea();
    });
  }

  /* ---------- 操作 ---------- */

  onPress() {
    Sound.unlock();
    Sound.startSea();
    if (this.pressed) return;
    this.pressed = true;
    Buzz.tap();
    switch (this.state) {
      case 'ready':
        this.state = 'charging';
        this.chargeT = 0;
        this.charge = 0;
        this.setAction('はなすと飛ぶ');
        this.hint.setText('強いほど遠くへ飛ぶよ');
        break;
      case 'waiting':
      case 'nibble':
        this.earlyStrike();
        break;
      case 'bite':
        this.strike();
        break;
      default:
        break;
    }
  }

  onRelease() {
    if (!this.pressed) return;
    this.pressed = false;
    if (this.state === 'charging') this.cast(this.charge);
  }

  onSwing(strength) {
    if (this.state === 'ready') {
      this.cast(0.35 + 0.65 * strength);
    } else if (this.state === 'bite') {
      this.strike();
    } else if ((this.state === 'waiting' || this.state === 'nibble') && this.fishNear) {
      this.earlyStrike();
    }
  }

  /* ---------- 段取り ---------- */

  enterReady() {
    this.state = 'ready';
    this.castD = 0;
    this.fish = null;
    this.fishNear = false;
    this.dipTarget = 0;
    this.side = 0;
    this.sink = 0;
    this.float.setAlpha(1);
    this.shadow.setAlpha(0);
    this.say('');
    this.status.setText('');
    this.setFightHud(false);
    this.setAction('投げる');
    this.hint.setText(this.useMotion ? '押してためて、はなす（スマホを振ってもOK）' : '押してためて、はなす');
  }

  cast(power) {
    // 釣りに1回行くと1日進む（港へもどるだけなら進まないよう、最初に投げたときに数える）
    if (!this.dayCounted) {
      this.dayCounted = true;
      Keep.nextDay();
    }
    this.state = 'flying';
    const p = Math.max(0.08, power);
    this.castD = 0.22 + 0.78 * p;
    const tip = this.rodTip(this.time.now);
    this.fly = { t: 0, dur: 0.55 + 0.45 * p, x: tip.x, y: tip.y + 84 };
    this.flyKick = 0.16;
    this.hint.setText('');
    this.setAction('…');
    Sound.cast();
  }

  enterWaiting() {
    this.state = 'waiting';
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 3.2);
    Sound.splash();
    this.fish = pickFish(this.castD);
    this.shadow.setTexture(`fish-${this.fish.id}`);
    this.fishNear = false;
    this.nibblesLeft = Phaser.Math.Between(this.fish.game.nibbles[0], this.fish.game.nibbles[1]);
    this.waitT = randBetween(2.2, 5.2);
    this.say('');
    this.setAction('合わせる');
    this.hint.setText(this.useMotion ? 'ウキがしずんだら、押すか振る' : 'ウキがしずんだら押す');
  }

  startNibble() {
    this.state = 'nibble';
    this.nibbleT = 0.38;
    this.fishNear = true;
    this.dipTarget = 0.34;
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 1.8);
    Sound.nibble();
    Buzz.pulse(15);
    this.say('ピクッ…まだ待って');
  }

  startBite() {
    this.state = 'bite';
    const extra = this.useMotion ? 0.25 : 0;   // 振るのは押すより時間がかかるので少し長く待つ
    this.biteTotal = this.fish.game.biteWindowMs / 1000 + extra;
    this.biteT = this.biteTotal;
    this.dipTarget = 1;
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 4.2);
    Sound.bite();
    Buzz.pulse([60, 30, 90]);
    this.shake(120, 0.008);
    this.say('今だ！');
    this.setAction('合わせる！', true);
  }

  earlyStrike() {
    if (this.fishNear) {
      this.fail('早すぎて、にげられた…');
      return;
    }
    this.say('まだアタリがないよ');
    this.waitT += 0.3;
    this.time.delayedCall(800, () => {
      if (this.state === 'waiting' && this.message.text === 'まだアタリがないよ') this.say('');
    });
  }

  strike() {
    const quick = this.biteT / this.biteTotal > 0.6;
    const game = this.fish.game;
    const style = FIGHT_STYLES[game.fight];
    const r = Math.pow(Math.random(), 1.6);   // 小さめが多く、大物はたまに
    this.sizeRatio = r;
    this.sizeCm = game.sizeCm[0] + (game.sizeCm[1] - game.sizeCm[0]) * r;
    this.pullScale = 0.9 + 0.25 * r;

    this.state = 'fight';
    this.style = style;
    this.D = Math.max(0.18, this.castD - (quick ? 0.06 : 0));
    this.startD = this.D;
    this.T = 0.5;
    this.holdTime = 0;
    this.slack = 0;
    this.over = 0;
    this.phase = 'calm';
    this.phaseT = style.first || randBetween(style.calm[0], style.calm[1]);
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.tickT = 0;
    this.buzzT = 0;
    this.dipTarget = 0;

    Sound.hook();
    Buzz.pulse(70);
    this.shake(160, 0.01);
    this.say(quick ? 'いいタイミング！' : 'かかった！');
    this.setAction('押して巻く');
    this.hint.setText('押すと巻く・はなすと緩む');
    this.setFightHud(true);
  }

  fail(text, snapped = false) {
    this.state = 'failed';
    this.failT = 1.7;
    this.dipTarget = 0;
    this.say(text);
    this.status.setText('');
    this.hint.setText('');
    this.actionBox.setVisible(false);
    this.setFightHud(false);
    this.shadow.setAlpha(0);
    if (snapped) { Sound.snap(); Buzz.pulse(120); this.shake(180, 0.012); }
    else Sound.miss();
  }

  landFish() {
    this.state = 'caught';
    const game = this.fish.game;
    const weight = game.weightA * Math.pow(this.sizeCm, 3);
    const count = (this.registry.get('todayCount') || 0) + 1;
    this.registry.set('todayCount', count);
    const bookNotes = Book.recordCatch(this.fish, this.sizeCm, weight);

    this.setFightHud(false);
    this.say('');
    this.status.setText('');
    this.hint.setText('');
    this.actionBox.setVisible(false);
    this.float.setAlpha(0);
    this.shadow.setAlpha(0);
    Sound.caught();
    Buzz.pulse([40, 40, 40, 40, 160]);
    if (!REDUCE_MOTION) this.cameras.main.flash(260, 255, 246, 230);

    const items = [];
    const add = (obj) => { obj.setDepth(62); items.push(obj); return obj; };
    const dim = this.add.rectangle(0, 0, W, H, 0x24305a, 0.72).setOrigin(0).setDepth(60);
    items.push(dim);

    // 注意文がある魚は、短い画面でもボタンに重ならないよう全体を少し上げる
    const catchNote = this.fish.safety.catchNote;
    const showNote = !!(catchNote && catchNote.status === '確認済み' && catchNote.value);
    const cy = H * 0.42 - (showNote ? 70 : 0);
    add(this.add.text(W / 2, cy - 330, this.sizeRatio >= 0.72 ? '大物だ！' : '釣れた！', {
      fontFamily: FONT_TITLE, fontSize: '84px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
    }).setOrigin(0.5).setShadow(0, 3, 'rgba(20,28,60,0.6)', 12));

    const art = add(this.add.image(W / 2, cy - 60, `fish-${this.fish.id}`));
    const finalScale = (1.05 + this.sizeRatio * 0.2) * (560 / FISH_BAKE.w);
    if (REDUCE_MOTION) {
      art.setScale(finalScale);
    } else {
      art.setScale(0.1).setAngle(-24);
      this.tweens.add({ targets: art, scale: finalScale, angle: 0, duration: 520, ease: 'Back.easeOut' });
      this.tweens.add({ targets: art, y: art.y - 12, duration: 900, delay: 520, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      this.spray(W / 2, cy - 60);
    }

    add(this.add.text(W / 2, cy + 112, this.fish.name, {
      fontFamily: FONT_TITLE, fontSize: '92px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
    }).setOrigin(0.5));
    add(this.add.text(W / 2, cy + 214, `${this.sizeCm.toFixed(1)} cm　/　${Math.round(weight)} g`, {
      fontFamily: FONT_BODY, fontSize: '50px', fontStyle: 'bold', color: '#ffe0a6',
    }).setOrigin(0.5));
    add(this.add.text(W / 2, cy + 278, `今日の${count}ひき目`, {
      fontFamily: FONT_BODY, fontSize: '32px', color: COLOR.cream,
    }).setOrigin(0.5));

    // 釣れた画面の注意。データに catchNote がある魚（今はサバだけ）に出す
    if (showNote) {
      add(bodyText(this, W / 2, cy + 322, catchNote.value, 30, { color: '#ffe0a6', width: W - 120, lineSpacing: 6, depth: 62 }));
    }

    let leaving = false;
    const take = createButton(this, W / 2, Math.round(H * 0.82), '持ち帰る', () => {
      if (leaving) return;
      leaving = true;
      changeScene(this, 'Cooler', { fish: this.fish, sizeCm: this.sizeCm, weight, bookNotes });
    }, 48);
    take.setDepth(70);
    items.push(take);
    const again = createTextButton(this, W / 2, Math.round(H * 0.925), '海に帰して、もう一回投げる', () => {
      if (leaving) return;
      for (const item of this.overlay) item.destroy();
      this.overlay = [];
      this.enterReady();
    }, 0.5);
    again.setDepth(70);
    items.push(again);
    this.overlay = items;
  }

  /* ---------- 演出 ---------- */

  shake(ms, power) {
    if (!REDUCE_MOTION) this.cameras.main.shake(ms, power);
  }

  ripple(x, y, size) {
    const g = this.add.graphics({ x, y }).setDepth(9);
    g.lineStyle(3, 0xfff6e6, 0.85);
    g.strokeEllipse(0, 0, 52, 15);
    this.tweens.add({
      targets: g, scaleX: size, scaleY: size, alpha: 0, duration: 760, ease: 'Sine.easeOut',
      onComplete: () => g.destroy(),
    });
  }

  // 釣れた瞬間の水しぶき
  spray(x, y) {
    for (let i = 0; i < 22; i++) {
      const dot = this.add.circle(x, y, 4 + Math.random() * 9, 0xfff6e6, 0.9).setDepth(61);
      const a = Math.random() * TAU;
      const r = 180 + Math.random() * 240;
      this.tweens.add({
        targets: dot, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * 0.75 + 70, alpha: 0, scale: 0.3,
        duration: 620 + Math.random() * 300, ease: 'Cubic.easeOut', onComplete: () => dot.destroy(),
      });
    }
  }

  setFightHud(on) {
    this.fightHud = on;
    this.tensionLabel.setVisible(on);
    this.distLabel.setVisible(on);
    this.status.setVisible(on);
  }

  // 竿の先の場所。ためると後ろへ、魚がかかるとしなる
  rodTip(time) {
    const shakeWarn = this.state === 'fight' && this.phase === 'warn' ? Math.sin(time * 0.07) * 9 : 0;
    return {
      x: ROD_TIP.x - this.rodBack * 190 - this.bend * 12,
      y: ROD_TIP.y - this.rodBack * 60 + this.bend * 85 + shakeWarn,
    };
  }

  /* ---------- 毎フレームの処理 ---------- */

  update(time, delta) {
    this.dawn.update(time);
    const dt = Math.min(delta, 50) / 1000;

    switch (this.state) {
      case 'charging': this.updateCharging(dt); break;
      case 'flying':
        this.fly.t += dt / this.fly.dur;
        this.flyKick -= dt;
        if (this.fly.t >= 1) this.enterWaiting();
        break;
      case 'waiting':
        this.waitT -= dt;
        if (this.waitT <= 0) {
          if (this.nibblesLeft > 0) this.startNibble();
          else this.startBite();
        }
        break;
      case 'nibble':
        this.nibbleT -= dt;
        if (this.nibbleT <= 0) {
          this.nibblesLeft -= 1;
          this.dipTarget = 0;
          this.state = 'waiting';
          this.waitT = randBetween(0.7, 1.6);
          this.say('');
        }
        break;
      case 'bite':
        this.biteT -= dt;
        if (this.biteT <= 0) this.fail('エサだけ取られた…');
        break;
      case 'fight': this.updateFight(dt); break;
      case 'failed':
        this.failT -= dt;
        if (this.failT <= 0) this.enterReady();
        break;
      default: break;
    }

    this.drawWorld(time, dt);
    this.drawHud();
  }

  updateCharging(dt) {
    this.chargeT += dt;
    // 0→1→0 をくり返すので、いちばん強いところではなす楽しみがある
    const phase = (this.chargeT / 1.15) % 2;
    this.charge = phase <= 1 ? phase : 2 - phase;
  }

  updateFight(dt) {
    const style = this.style;
    const power = this.fish.game.power;

    // おとなしい → 合図 → 強く引く、をくり返す
    this.phaseT -= dt;
    if (this.phaseT <= 0) {
      if (this.phase === 'calm') {
        this.phase = 'warn';
        this.phaseT = style.warn;
        this.dir = Math.random() < 0.5 ? -1 : 1;
        this.say(style.warnText);
        Sound.warn();
        Buzz.pulse(30);
      } else if (this.phase === 'warn') {
        this.phase = 'surge';
        this.phaseT = style.surge;
        this.say(style.surgeText);
        Sound.surge();
        Buzz.pulse(Math.round(style.surge * 1000 * 0.5));
        this.shake(style.surge * 400, 0.005);
      } else {
        this.phase = 'calm';
        this.phaseT = randBetween(style.calm[0], style.calm[1]);
        this.say('');
      }
    }

    const surging = this.phase === 'surge';
    const pull = (surging ? 0.55 + power * 0.1 : 0.12 + power * 0.03) * this.pullScale;
    const holding = this.pressed;

    // 糸の張りは、目標の値へなめらかに近づく
    // 押しっぱなしだと張りがじわじわ上がるので、ときどき緩める必要がある
    this.holdTime = holding ? this.holdTime + dt : Math.max(0, this.holdTime - dt * 2.5);
    let target = holding ? 0.5 + pull * 0.6 + this.holdTime * HOLD_STRAIN : pull * 0.45;
    if (surging && style.dive) target = Math.min(target, 0.97);   // 潜るときは、こらえれば切れない
    this.T += (target - this.T) * (1 - Math.exp(-(holding ? 1.6 : 2.2) * dt));
    this.T = Math.min(1, Math.max(0, this.T));

    // 巻くと寄り、緩めると糸が出る
    if (holding) this.D -= style.reel * (surging ? 0.1 : 1) * dt;
    else this.D += style.out * (surging ? 1 : 0.12) * dt;

    // 走る・潜るの見た目
    const follow = 1 - Math.exp(-3.2 * dt);
    this.side += ((surging ? this.dir * style.side : 0) - this.side) * follow;
    this.sink += ((surging && style.dive ? 1 : 0) - this.sink) * follow;

    // リールの音と、引いているときの振動
    if (holding) {
      this.tickT -= dt;
      if (this.tickT <= 0) {
        this.tickT = 0.09 - this.T * 0.04;
        Sound.tick(this.T);
      }
    }
    this.buzzT -= dt;
    if (holding && surging && this.buzzT <= 0) {
      this.buzzT = 0.16;
      Buzz.pulse(60);
    }

    // 切れそう・ゆるいの声かけ
    if (surging && style.dive) this.status.setText('');   // 潜るときは「こらえて」の声かけを優先する
    else if (this.T >= TENSION_DANGER) this.status.setText('切れそう！ はなして！').setColor('#ffb3a0');
    else if (this.T <= TENSION_SLACK) this.status.setText('ゆるい！ 巻いて！').setColor('#bfe0ff');
    else this.status.setText('');

    // 勝ち負けの判定
    this.over = this.T >= 1 ? this.over + dt : 0;
    this.slack = this.T < TENSION_SLACK ? this.slack + dt : Math.max(0, this.slack - dt * 2);

    if (this.over >= 0.25) this.fail('糸が切れた…', true);
    else if (this.slack >= 1.3) this.fail('糸がゆるんで、バレた…');
    else if (this.D > this.startD + style.extra) this.fail(style.escapeText, true);
    else if (this.D <= 0) this.landFish();
  }

  drawWorld(time, dt) {
    // 竿のしなりと、投げるときの動き
    let rodTarget = 0;
    if (this.state === 'charging') rodTarget = 0.25 + this.charge * 0.75;
    else if (this.state === 'flying' && this.flyKick > 0) rodTarget = -0.22;
    this.rodBack += (rodTarget - this.rodBack) * (1 - Math.exp(-(this.state === 'charging' ? 16 : 22) * dt));
    const bendTarget = this.state === 'fight' ? this.T : (this.state === 'bite' ? 0.3 : 0);
    this.bend += (bendTarget - this.bend) * (1 - Math.exp(-9 * dt));
    this.dip += (this.dipTarget - this.dip) * (1 - Math.exp(-26 * dt));

    const tip = this.rodTip(time);
    const bob = Math.sin(time * 0.0016 * this.motionPace);

    // ウキの場所
    let fx;
    let fy;
    let scale = 1;
    let sag = 40;
    let taut = false;
    if (this.state === 'ready' || this.state === 'charging') {
      fx = tip.x + bob * 2;
      fy = tip.y + 84;
      scale = 0.8;
      sag = 0;
      taut = true;
    } else if (this.state === 'flying') {
      const t = Math.min(1, this.fly.t);
      const to = waterPoint(this.castD);
      fx = this.fly.x + (to.x - this.fly.x) * t;
      fy = this.fly.y + (to.y - this.fly.y) * t - Math.sin(t * Math.PI) * (200 + this.castD * 170);
      scale = 0.8 + (to.scale - 0.8) * t;
      sag = 20;
    } else if (this.state === 'fight') {
      const p = waterPoint(this.D);
      const wiggle = this.phase === 'surge' ? Math.sin(time * 0.05) * 6 : Math.sin(time * 0.012) * 3;
      fx = p.x + this.side * 130 + wiggle;
      fy = p.y + this.sink * 26 + bob * 3;
      scale = p.scale;
      sag = Math.pow(1 - this.T, 2) * 90;
      this.float.setAlpha(1 - this.sink * 0.65);
      // 岸に近づくと魚の影が見える
      if (this.D < 0.3) {
        this.shadow.setPosition(fx - 8, fy + 40).setAlpha(((0.3 - this.D) / 0.3) * 0.6);
        this.shadow.setFlipX(this.side > 0.1);
      }
    } else {
      const p = waterPoint(this.castD);
      fx = p.x;
      fy = p.y + bob * 6 + this.dip * 36 * p.scale;
      scale = p.scale;
      this.float.setAlpha(1 - this.dip * 0.55);
    }
    if (this.state === 'failed') this.float.setAlpha(Math.max(0, this.failT / 1.7));
    this.float.setPosition(fx, fy).setScale(scale);

    // 竿と糸
    const g = this.world;
    g.clear();
    if (this.state === 'caught') return;
    const baseX = 270;
    const baseY = SHORE_TOP + 232;
    g.lineStyle(4.5, 0x343757, 1);
    g.beginPath();
    g.moveTo(baseX, baseY);
    const ctrl = { x: 350 - this.rodBack * 110, y: SHORE_TOP + 110 - this.rodBack * 30 - this.bend * 10 };
    for (let i = 1; i <= 14; i++) {
      const t = i / 14;
      const u = 1 - t;
      g.lineTo(u * u * baseX + 2 * u * t * ctrl.x + t * t * tip.x, u * u * baseY + 2 * u * t * ctrl.y + t * t * tip.y);
    }
    g.strokePath();

    const warn = this.state === 'fight' && this.phase !== 'calm';
    g.lineStyle(warn ? 3 : 2, warn ? 0xffb04a : 0xfff6e6, warn ? 1 : 0.75);
    const endY = fy - 26 * scale;
    if (this.state !== 'failed' || this.failT > 1.2) {
      g.beginPath();
      g.moveTo(tip.x, tip.y);
      const midX = (tip.x + fx) / 2;
      const midY = (tip.y + endY) / 2 + (taut ? 0 : sag);
      for (let i = 1; i <= 18; i++) {
        const t = i / 18;
        const u = 1 - t;
        g.lineTo(u * u * tip.x + 2 * u * t * midX + t * t * fx, u * u * tip.y + 2 * u * t * midY + t * t * endY);
      }
      g.strokePath();
    }
  }

  drawHud() {
    const g = this.hud;
    g.clear();

    // 投げる強さのゲージ
    if (this.state === 'charging') {
      const bw = 460;
      const x = (W - bw) / 2;
      const y = this.actionY - 112;
      g.fillStyle(0x24305a, 0.6);
      g.fillRoundedRect(x - 8, y - 8, bw + 16, 42, 21);
      g.fillStyle(0xffc65c, 1);
      g.fillRoundedRect(x, y, Math.max(26, bw * this.charge), 26, 13);
    }

    if (!this.fightHud) return;

    const x = 90;
    const bw = W - 180;
    const y = 158;
    const bh = 34;
    g.fillStyle(0x24305a, 0.62);
    g.fillRoundedRect(x - 30, 104, bw + 60, 150, 20);
    // ゆるい／ちょうどいい／切れそう の3つの帯
    const a = bw * TENSION_SLACK;
    const b = bw * TENSION_DANGER;
    g.fillStyle(0x7fb2e0, 1);
    g.fillRect(x, y, a, bh);
    g.fillStyle(0x8fcf9b, 1);
    g.fillRect(x + a, y, b - a, bh);
    g.fillStyle(0xe2705c, 1);
    g.fillRect(x + b, y, bw - b, bh);
    // 今の張り
    const mx = x + bw * this.T;
    g.fillStyle(0xffffff, 1);
    g.fillRect(mx - 6, y - 9, 12, bh + 18);
    g.lineStyle(2, 0x27406a, 1);
    g.strokeRect(mx - 6, y - 9, 12, bh + 18);

    this.distLabel.setText(`岸まで ${Math.max(0, Math.ceil(this.D * METERS_PER_DIST))} m`);
  }
}

const FISH_ID_KEYS = ['aji', 'saba', 'kasago'];

// 下の画面で使う写真を読み込む（読めなかったときは、図形の絵で続ける）
function preloadFishPhotos(scene) {
  for (const id of FISH_ID_KEYS) {
    const key = `fish-${id}`;
    if (!scene.textures.exists(key)) scene.load.image(key, `images/${key}.webp`);
  }
}
function preloadDishPhotos(scene, fish) {
  for (const dish of fish.dishes || []) {
    const key = `dish-${fish.id}-${dish.id}`;
    if (!scene.textures.exists(key)) scene.load.image(key, dish.image);
  }
}

// 文章の窓（読むものは画面に重ねたHTMLで出す。スクロールと選択ができる）
function showSheet(title, blocks) {
  const sheet = document.getElementById('sheet');
  sheet.textContent = '';
  const box = document.createElement('div');
  box.className = 'sheet-box';
  const h = document.createElement('h2');
  h.textContent = title;
  box.appendChild(h);
  for (const block of blocks) {
    if (block.heading) {
      const el = document.createElement('h3');
      el.textContent = block.heading;
      box.appendChild(el);
    }
    if (block.text) {
      const el = document.createElement('p');
      el.textContent = block.text;
      box.appendChild(el);
    }
    if (block.list || block.steps) {
      const el = document.createElement(block.steps ? 'ol' : 'ul');
      for (const item of block.list || block.steps) {
        const li = document.createElement('li');
        li.textContent = item;
        el.appendChild(li);
      }
      box.appendChild(el);
    }
    if (block.source) {
      const el = document.createElement('p');
      el.className = 'sheet-source';
      el.textContent = '出典：';
      const a = document.createElement('a');
      a.href = block.source.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = block.source.name;
      el.appendChild(a);
      box.appendChild(el);
    }
  }
  const close = document.createElement('button');
  close.textContent = 'とじる';
  close.addEventListener('click', () => { sheet.style.display = 'none'; });
  box.appendChild(close);
  sheet.appendChild(box);
  sheet.style.display = 'block';
  sheet.scrollTop = 0;
}

function recipeSheet(fish, dish) {
  const s = window.fishData.sources;
  if (!dish.recipe) {
    showSheet(`${dish.name}を実際に作るなら`, [
      { text: 'この料理は、作り方を確かめられる出典がまだ見つかっていません。まちがった手順を伝えないよう、準備中にしています。' },
    ]);
    return;
  }
  const r = dish.recipe;
  const blocks = [
    { heading: `材料（${r.serves}）`, list: r.ingredients },
    { heading: '作り方', steps: r.steps },
  ];
  if (r.note) blocks.push({ text: r.note });
  if (dish.raw) {
    if (dish.rawNote) blocks.push({ text: dish.rawNote });
    blocks.push({ heading: '生で食べるときの注意', list: PARASITE_LIST });
    blocks.push({ text: '新鮮でも、寄生虫がいないとは言えません。' });
    blocks.push({ source: s.mhlw_anisakis });
  } else {
    blocks.push({ text: '魚の中まで火を通してね。' });
  }
  blocks.push({ source: s[r.source] });
  showSheet(`${dish.name}を実際に作るなら`, blocks);
}

/* ---------- 図鑑と冷蔵庫の画面（読むものなので、画面に重ねたHTMLで出す） ---------- */

function makeEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function openPanel(title) {
  const sheet = document.getElementById('sheet');
  sheet.textContent = '';
  const box = makeEl('div', 'sheet-box');
  box.appendChild(makeEl('h2', '', title));
  sheet.appendChild(box);
  sheet.style.display = 'block';
  sheet.scrollTop = 0;
  return box;
}

function closePanel() { document.getElementById('sheet').style.display = 'none'; }

function panelButton(box, label, onClick) {
  const button = makeEl('button', '', label);
  button.addEventListener('click', onClick);
  box.appendChild(button);
  return button;
}

function fishImage(fishId, className) {
  const img = makeEl('img', className);
  img.src = `images/fish-${fishId}.webp`;
  img.alt = '';

}

function stampRow(entry) {

function sourceLine(box, ids) {

  (ids || []).forEach((id, i) => {
    const s = window.fishData.sources[id];

    if (i > 0) line.appendChild(document.createTextNode('、'));

    a.target = '_blank';

  });

}

function keepRow(item, onCook, onClose) {
  const fish = fishById(item.fishId);
  const info = Keep.info(item);
  const row = makeEl('div', 'keep-item');
  row.appendChild(fishImage(item.fishId, info.rotten ? 'card-img unknown' : 'card-img'));
  const body = makeEl('div', 'keep-body');
  body.appendChild(makeEl('div', 'card-name', `${fish ? fish.name : '魚'} ${item.sizeCm.toFixed(1)}cm`));

  let status;
  if (info.rotten) status = info.frozen ? '長く置きすぎた…捨てるしかない' : '腐ってしまった…捨てるしかない';
  else if (info.frozen) status = `冷凍中。あと${info.left}日もつ。生では使えず、味と売値が下がる`;
  else if (info.rawOk) status = `釣ってから${info.days}日。あと${info.left}日で腐る。生の料理はあと${RULES.rawDays - info.days}日`;
  else status = `釣ってから${info.days}日。あと${info.left}日で腐る。もう生では使えない`;
  body.appendChild(makeEl('div', info.rotten || info.left <= 1 ? 'keep-warn' : '', status));

  const actions = makeEl('div', 'keep-actions');
  const redraw = () => keepPanel(onCook, onClose);
  if (info.rotten) {
    panelButton(actions, '捨てる', () => { Keep.remove(item.id); redraw(); });
  } else {
    panelButton(actions, '料理する', () => { closePanel(); onCook(item, fish, info); });
    if (!info.frozen) panelButton(actions, '冷凍する', () => { Keep.freeze(item.id); redraw(); });
  }
  body.appendChild(actions);
  row.appendChild(body);
  return row;
}

function wrapJapanese(text, size, width) {
  const noStart = '、。）」』！？・ー…';
  const lines = [];
  for (const para of text.split('\n')) {
    let line = '', used = 0;
    for (const ch of para) {
      const w = ch.charCodeAt(0) < 128 ? size * 0.55 : size;
      if (used + w > width && line && !noStart.includes(ch)) {
        lines.push(line);
        line = '';
        used = 0;
      }
      line += ch;
      used += w;
    }
    lines.push(line);
  }
  return lines.join('\n');
}

function bodyText(scene, x, y, rawText, size, opts = {}) {
  const text = rawText ? wrapJapanese(rawText, size, opts.width || W - 80) : '';
  return scene.add.text(x, y, text, {
    fontFamily: FONT_BODY, fontSize: `${size}px`, color: opts.color || COLOR.cream, align: opts.align || 'center',
    lineSpacing: opts.lineSpacing === undefined ? 10 : opts.lineSpacing,
  }).setOrigin(opts.originX === undefined ? 0.5 : opts.originX, opts.originY === undefined ? 0 : opts.originY)
    .setDepth(opts.depth || 30).setShadow(0, 2, 'rgba(10,8,8,0.75)', 8);
}

function titleText(scene, y, text) {
  return scene.add.text(W / 2, y, text, {
    fontFamily: FONT_TITLE, fontSize: '68px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
  }).setOrigin(0.5).setDepth(30).setShadow(0, 3, 'rgba(10,8,8,0.75)', 12);
}

// クーラーボックスの中の氷（大きなかけらが、すき間なく並ぶ）
function paintIce(ctx, w, h) {
  const size = 15;
  paintPixels(ctx, w, h, (x, y, o) => {
    const gx = Math.floor(x / size), gy = Math.floor(y / size);
    let d1 = 1e9, d2 = 1e9, id = 0;
    for (let j = -1; j <= 1; j++) {
      for (let i = -1; i <= 1; i++) {
        const cx = (gx + i + hash2(gx + i, gy + j)) * size;
        const cy = (gy + j + hash2(gy + j, gx + i + 7)) * size;
        const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
        if (d < d1) { d2 = d1; d1 = d; id = hash2(gx + i + 3, gy + j + 5); } else if (d < d2) d2 = d;
      }
    }
    const crack = sstep(0, 3, Math.sqrt(d2) - Math.sqrt(d1));
    const cloud = fbm(x * 0.012, y * 0.012, 3);
    const v = lerp(0.8, 1, id) * lerp(0.74, 1.08, cloud) * lerp(0.84, 1, crack);
    const shine = id > 0.9 ? 30 : 0;
    o[0] = 196 * v + 34 + shine; o[1] = 218 * v + 30 + shine; o[2] = 232 * v + 22 + shine;
  });
}

// まな板
function paintBoard(ctx, w, h) {
  paintPixels(ctx, w, h, (x, y, o) => {
    const warp = fbm(x * 0.005, y * 0.03, 3);
    const ring = Math.sin(y * 0.14 + warp * 20) * 0.5 + 0.5;
    const fine = fbm(x * 0.03, y * 0.4, 3);
    const c = lerp3([214, 178, 132], [232, 202, 160], clamp01(ring * 0.28 + fine * 0.62 + 0.08));
    const dx = (x / w - 0.5) * 1.3, dy = (y / h - 0.5) * 1.5;
    const lamp = 1.08 - sstep(0.2, 1, Math.sqrt(dx * dx + dy * dy)) * 0.5;
    o[0] = c[0] * lamp; o[1] = c[1] * lamp; o[2] = c[2] * lamp;
  });
}

function bakeFull(scene, key, paint) {
  bake(scene, key, Math.round(W / 2), Math.round(H / 2), paint);
  return scene.add.image(0, 0, key).setOrigin(0).setDisplaySize(W, H).setDepth(0);
}

// 鮮度のゲージ
function drawMeter(g, x, y, width, value, color) {
  g.clear();
  g.fillStyle(0x10202e, 0.65);
  g.fillRoundedRect(x, y, width, 24, 12);
  g.fillStyle(color, 1);
  g.fillRoundedRect(x + 3, y + 3, Math.max(18, (width - 6) * value), 18, 9);
}

// 魚の絵のどこに何があるか（絵の幅に対する割合）。さばく画面の線の場所に使う
const PREP_ART = {
  aji: { gill: 0.25, half: 100 },
  saba: { gill: 0.24, half: 100 },
  kasago: { gill: 0.35, half: 130 },
};

// 料理ごとのさばき方。順番に進める
function prepPlan(dish) {
  const plans = {
    whole: ['scale', 'guts'],
    hiraki: ['scale', 'head', 'turn', 'hiraki'],
    nimai: ['scale', 'head', 'belly', 'turn', 'back2'],
    sanmai: ['scale', 'head', 'belly', 'turn', 'back', 'flip', 'belly2', 'turn', 'back2'],
  };
  const plan = plans[dish.prep].slice();
  if (dish.raw) plan.push('skin');   // 刺身は皮を引く
  return plan;
}

class PrepScene extends Phaser.Scene {
  constructor() { super('Prep'); }

  init(data) {
    this.catchData = data;
    this.fish = data.fish;
    this.dish = data.dish;
    this.plan = prepPlan(this.dish);
    this.planIndex = -1;
    this.step = '';
    this.scores = [];
    this.leaving = false;
    this.headLeft = true;     // いま頭が左を向いているか
  }

  preload() {
    const path = this.dish.prepImage;
    if (path && !this.textures.exists(path)) this.load.image(path, path);
  }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
    bakeFull(this, 'board', paintBoard);

    this.fishW = 720;
    this.fishScale = this.fishW / FISH_BAKE.w;
    this.fishX = W / 2;
    this.fishY = Math.round(H * 0.44);
    this.left = this.fishX - this.fishW / 2;
    this.art = PREP_ART[this.fish.id] || PREP_ART.aji;
    this.bandTop = this.fishY - this.art.half - 40;
    this.bandBottom = this.fishY + this.art.half + 40;

    this.body = this.add.image(this.fishX, this.fishY, `fish-${this.fish.id}`).setScale(this.fishScale).setDepth(5);

    const dark = '#3b2412';
    this.heading = titleText(this, H * 0.08, '').setColor(dark).setShadow(0, 1, 'rgba(255,240,210,0.7)', 3);
    this.hint = bodyText(this, W / 2, H * 0.13, '', 32, { color: dark }).setShadow(0, 1, 'rgba(255,240,210,0.7)', 3);
    this.progress = this.add.graphics().setDepth(30);

    const cautions = this.fish.safety.cautions.value || [];
    if (this.fish.id === 'kasago' && cautions.length) {
      bodyText(this, W / 2, H * 0.68, cautions[0], 28, { color: '#7a1f10' }).setShadow(0, 1, 'rgba(255,240,210,0.7)', 3);
    }

    this.guide = this.add.graphics().setDepth(20);
    this.trail = this.add.graphics().setDepth(21);
    this.input.on('pointerdown', (p) => this.onDown(p));
    this.input.on('pointermove', (p) => this.onMove(p));
    this.input.on('pointerup', (p) => this.onUp(p));
    this.nextStep();
  }

  say(title, hint) {
    this.heading.setText(title);
    this.setHint(hint);
  }

  // ヒントは毎回折り返しを計算し直す
  setHint(text) {
    this.hint.setText(wrapJapanese(text, 32, W - 80));
  }

  nextStep() {
    this.planIndex++;
    this.trail.clear();
    this.guide.clear();
    this.progress.clear();
    const name = this.plan[this.planIndex];
    if (!name) { this.finishAll(); return; }
    this.step = name;
    const a = this.art;
    const gillX = this.left + this.fishW * a.gill;
    const endX = this.left + this.fishW * 0.88;
    switch (name) {
      case 'scale': this.startScale(); break;
      case 'head': this.startHead(); break;
      case 'guts':
        this.say('内臓を取る', 'おなかの線にそって、左から右へなぞろう');
        this.startTrace(this.fishY + a.half * 0.62, gillX, this.left + this.fishW * 0.6);
        break;
      case 'turn': this.turnFish(); break;
      case 'flip': this.flipFish(); break;
      case 'belly':
        this.say(this.cutTitle(), 'おなか側を、赤い丸から頭→尾へなぞろう');
        this.traceSide(a.gill, 0.88);
        break;
      case 'back':
      case 'back2':
        this.say(this.cutTitle(), '向きを変えて、背中側を赤い丸から尾→頭へなぞろう');
        this.traceSide(0.88, a.gill);
        break;
      case 'belly2':
        this.say(this.cutTitle(), '裏返して、おなか側を赤い丸から頭→尾へなぞろう');
        this.traceSide(a.gill, 0.88);
        break;
      case 'hiraki':
        this.say('背から開く', '背中側を、赤い丸から頭→尾へ切り開こう');
        this.traceSide(a.gill, 0.88);
        break;
      case 'skin':
        this.say('皮を引く', '身と皮のあいだを、左から右へなぞろう');
        this.startTrace(this.fishY - 95, this.left + 120, this.left + this.fishW - 90);
        break;
      default: this.nextStep();
    }
  }

  cutTitle() {
    return this.dish.prep === 'nimai' ? '二枚におろす' : '三枚におろす';
  }

  // 絵の左はしからの割合を、いまの向きでの画面の場所に直す
  xOf(frac) {
    return this.headLeft ? this.left + this.fishW * frac : this.left + this.fishW * (1 - frac);
  }

  // 手前（画面の下側）の線をなぞる。from から to へ
  traceSide(from, to) {
    this.startTrace(this.fishY + this.art.half * 0.72, this.xOf(from), this.xOf(to));
  }

  // 魚を半回転させて、頭と尾、背中とおなかの向きを入れかえる
  turnFish() {
    this.step = '';
    this.setHint('向きを変えるよ');
    this.headLeft = !this.headLeft;
    const done = () => this.nextStep();
    if (REDUCE_MOTION) { this.body.angle += 180; done(); return; }
    this.tweens.add({ targets: this.body, angle: this.body.angle + 180, duration: 480, ease: 'Sine.easeInOut', onComplete: done });
  }

  // 魚を裏返す（頭の向きはそのまま、背中とおなかが入れかわる）
  flipFish() {
    this.step = '';
    this.setHint('裏返すよ');
    const target = -this.body.scaleY;
    const done = () => this.nextStep();
    if (REDUCE_MOTION) { this.body.scaleY = target; done(); return; }
    this.tweens.add({ targets: this.body, scaleY: target, duration: 480, ease: 'Sine.easeInOut', onComplete: done });
  }

  /* ウロコ取り：魚の上をまんべんなくこする */
  startScale() {
    this.say('ウロコを取る', '魚の上を、左右にこすろう');
    this.bins = new Array(14).fill(0);
    this.lastX = null;
    this.drawBins();
  }

  drawBins() {
    const g = this.progress;
    g.clear();
    const y = this.bandBottom + 26;
    const w = this.fishW / this.bins.length;
    this.bins.forEach((v, i) => {
      g.fillStyle(0x3b2412, 0.2);
      g.fillRect(this.left + i * w + 2, y, w - 4, 16);
      g.fillStyle(0xc2562e, 1);
      g.fillRect(this.left + i * w + 2, y, (w - 4) * Math.min(1, v), 16);
    });
  }

  rubScale(p) {
    if (p.y < this.bandTop || p.y > this.bandBottom) { this.lastX = null; return; }
    if (this.lastX !== null) {
      const d = Math.abs(p.x - this.lastX);
      const toBin = (x) => Math.floor(((x - this.left) / this.fishW) * this.bins.length);
      const from = Math.max(0, Math.min(toBin(p.x), toBin(this.lastX)));
      const to = Math.min(this.bins.length - 1, Math.max(toBin(p.x), toBin(this.lastX)));
      if (d > 0) for (let bin = from; bin <= to; bin++) this.bins[bin] += 0.2;
      if (d > 4 && Math.random() < 0.7 && !REDUCE_MOTION) this.flake(p.x, p.y);
    }
    this.lastX = p.x;
    this.drawBins();
    if (this.bins.every((v) => v >= 1)) {
      const worst = Math.max(...this.bins);
      this.finishStep(clamp01(1.2 - (worst - 1) * 0.1));
    }
  }

  flake(x, y) {
    const dot = this.add.ellipse(x, y, 10, 7, 0xeef2f0, 0.9).setDepth(22);
    this.tweens.add({
      targets: dot, x: x + randBetween(-70, 70), y: y - randBetween(30, 110), alpha: 0, angle: randBetween(-180, 180),
      duration: 460, ease: 'Cubic.easeOut', onComplete: () => dot.destroy(),
    });
  }

  /* 頭を落とす：エラの後ろの線を、上から下へ */
  startHead() {
    this.say('頭を落とす', '赤い線にそって、上から下へスッとなぞろう');
    this.cutX = this.left + this.fishW * this.art.gill;
    this.guide.lineStyle(5, 0xd63a26, 0.9);
    for (let y = this.bandTop; y < this.bandBottom; y += 26) this.guide.lineBetween(this.cutX, y, this.cutX, y + 15);
  }

  finishHead(score) {
    const key = `fish-${this.fish.id}`;
    const split = this.art.gill * FISH_BAKE.w;
    const head = this.add.image(this.fishX, this.fishY, key).setScale(this.fishScale).setCrop(0, 0, split, FISH_BAKE.h).setDepth(5);
    this.body.setCrop(split, 0, FISH_BAKE.w - split, FISH_BAKE.h);
    Buzz.pulse(40);
    if (REDUCE_MOTION) head.setAlpha(0);
    else this.tweens.add({ targets: head, x: head.x - 90, y: head.y + 80, angle: -14, alpha: 0, duration: 620, ease: 'Cubic.easeIn' });
    this.finishStep(score);
  }

  /* 線をなぞる工程（内臓、開く、おろす、皮を引く） */
  startTrace(y, x0, x1) {
    this.lineY = y;
    this.lineStart = x0;
    this.lineEnd = x1;
    this.traceAt = x0;
    this.traceDev = 0;
    this.traceCount = 0;
    this.traceDir = x1 >= x0 ? 1 : -1;
    const dir = this.traceDir;
    this.guide.lineStyle(5, 0xd63a26, 0.9);
    for (let x = x0; (x1 - x) * dir > 0; x += 26 * dir) this.guide.lineBetween(x, y, x + 15 * dir, y);
    // なぞり始める場所の印
    this.guide.fillStyle(0xd63a26, 1);
    this.guide.fillCircle(x0, y, 15);
  }

  traceLine(p) {
    const moved = (p.x - this.traceAt) * this.traceDir;
    if (moved <= 0 || moved > 90) return;
    if (Math.abs(p.y - this.lineY) > 90) return;
    this.trail.lineStyle(7, 0xfff4d8, 0.9);
    this.trail.lineBetween(this.traceAt, this.lineY, p.x, p.y);
    this.traceAt = p.x;
    this.traceDev += Math.abs(p.y - this.lineY);
    this.traceCount++;
    if ((this.traceAt - this.lineEnd) * this.traceDir >= 0) this.finishTrace();
  }

  finishTrace() {
    const score = clamp01(1.1 - (this.traceDev / Math.max(1, this.traceCount)) / 55);
    Buzz.pulse(40);
    if (['hiraki', 'back2'].includes(this.step)) this.showResult();
    this.finishStep(score);
  }

  // さばいた後の写真に切りかえる
  showResult() {
    const path = this.dish.prepImage;
    if (!path || !this.textures.exists(path)) return;
    const photo = this.add.image(W / 2, this.fishY, path).setDepth(6).setDisplaySize(W, W * 523 / 780);
    if (REDUCE_MOTION) {
      this.body.setAlpha(0);
    } else {
      photo.setAlpha(0);
      this.tweens.add({ targets: photo, alpha: 1, duration: 500 });
      this.tweens.add({ targets: this.body, alpha: 0, duration: 500 });
    }
  }

  finishStep(score) {
    this.scores.push(score);
    this.step = '';       // 次の工程が始まるまで操作を受けない
    Sound.caught();
    this.setHint(score >= 0.85 ? 'うまい！' : score >= 0.55 ? 'いいね！' : 'できた！');
    this.time.delayedCall(REDUCE_MOTION ? 400 : 850, () => this.nextStep());
  }

  finishAll() {
    const skill = this.scores.reduce((a, b) => a + b, 0) / this.scores.length;
    const dish = this.dish;
    this.say('さばけた！', `${dish.name}にしよう`);
    createButton(this, W / 2, H - 92, dish.raw ? '盛りつける' : '料理する', () => {
      if (this.leaving) return;
      this.leaving = true;
      Buzz.pulse(20);
      const veil = this.add.rectangle(0, 0, W, H, 0x120b07, 0.86).setOrigin(0).setDepth(60);
      const text = bodyText(this, W / 2, H * 0.46, `${dish.name}を作っています…`, 44, { depth: 61 });
      const bar = this.add.graphics().setDepth(61);
      const progress = { v: 0 };
      this.tweens.add({
        targets: progress, v: 1, duration: REDUCE_MOTION ? 300 : 1400,
        onUpdate: () => drawMeter(bar, 180, H * 0.54, W - 360, progress.v, 0xf0a860),
        onComplete: () => {
          veil.setAlpha(1);
          text.setAlpha(0);
          changeScene(this, 'Eat', { ...this.catchData, skill });
        },
      });
    }, 44);
  }

  onDown(p) {
    if (this.step === 'scale') this.lastX = p.x;
    if (this.step === 'head') this.swipe = { x: p.x, y: p.y, sum: p.x, n: 1 };
    if (this.isTrace() && Math.abs(p.x - this.traceAt) > 90) this.setHint('赤い丸から、なぞり始めよう');
  }

  isTrace() {
    return ['guts', 'hiraki', 'belly', 'back', 'belly2', 'back2', 'skin'].includes(this.step);
  }

  onMove(p) {
    if (!p.isDown) return;
    if (this.step === 'scale') this.rubScale(p);
    else if (this.step === 'head' && this.swipe) {
      this.swipe.sum += p.x;
      this.swipe.n++;
      this.trail.lineStyle(7, 0xfff4d8, 0.85);
      this.trail.lineBetween(p.prevPosition.x, p.prevPosition.y, p.x, p.y);
    } else if (this.isTrace()) {
      this.traceLine(p);
    }
  }

  onUp(p) {
    if (this.step === 'scale') this.lastX = null;
    if (this.step === 'head' && this.swipe) {
      const s = this.swipe;
      this.swipe = null;
      const off = Math.abs(s.sum / s.n - this.cutX);
      if (p.y - s.y < this.art.half * 1.1 || off > 150) {
        this.trail.clear();
        this.setHint('赤い線にそって、上から下まで長くなぞろう');
        return;
      }
      this.trail.clear();
      this.guide.clear();
      this.finishHead(clamp01(1.1 - off / 110));
    }
  }
}

// 料理を先に決める（決めた料理で、さばき方が変わる）
class CookScene extends Phaser.Scene {
  constructor() { super('Cook'); }

  init(data) {
    this.catchData = data;
    this.fish = data.fish;
    this.leaving = false;
  }

  preload() {
    preloadFishPhotos(this);   // 冷蔵庫から来たときは、まだ読み込んでいないことがある
    preloadDishPhotos(this, this.fish);
  }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
    for (const fish of window.fishData.fish) {
      bake(this, `fish-${fish.id}`, FISH_BAKE.w, FISH_BAKE.h, (ctx, w, h) => paintFish(ctx, w, h, fish.id));
    }
    bakeFull(this, 'table', paintTable);
    titleText(this, H * 0.075, `${this.fish.name}をどう食べる？`);

    const dishes = this.fish.dishes;
    const gap = 20;
    const hasRaw = dishes.some((d) => d.raw);
    const room = H - H * 0.14 - (hasRaw ? 220 : 40);
    const cardH = Math.min(280, Math.floor((room - gap * (dishes.length - 1)) / dishes.length));
    const top = H * 0.14;
    dishes.forEach((dish, i) => this.addCard(dish, top + i * (cardH + gap), cardH));

    if (hasRaw) {
      bodyText(this, W / 2, H - 205,
        '生の魚には、アニサキスという寄生虫がいることがあります。新鮮でも安全とは限りません。\n釣ってから3日たつか冷凍すると、生の料理は作れません。これはゲームのルールで、現実の日持ちの目安ではありません。',
        24, { color: '#ffd27a', lineSpacing: 6, width: 720 });
      createTextButton(this, W / 2, H - 42, '寄生虫の注意と対策を読む', () => safetySheet(), 0.5);
    }

    // 冷蔵庫から来たときは、料理をやめてもどれる（魚は食べるまで冷蔵庫に残る）
    if (this.catchData.stockId) {
      createTextButton(this, 22, H - 42, '← もどる', () => {
        if (this.leaving) return;
        this.leaving = true;
        changeScene(this, 'Harbor');
      });
    }
  }

  addCard(dish, y, height) {
    const days = this.catchData.days || 0;
    const frozen = !!this.catchData.frozen;
    const blocked = dish.raw && (frozen || days >= RULES.rawDays);   // ゲームのルール
    const box = this.add.container(0, y).setDepth(20);
    const bg = this.add.rectangle(40, 0, W - 80, height, 0x1c120c, 0.72).setOrigin(0).setStrokeStyle(2, 0xd8bc90, 0.5);
    box.add(bg);
    const key = `dish-${this.fish.id}-${dish.id}`;
    if (this.textures.exists(key)) {
      box.add(this.add.image(54, 14, key).setOrigin(0).setDisplaySize(height - 28, height - 28));
    }
    box.add(this.add.text(height + 44, height / 2 - (dish.raw ? 22 : 0), wrapJapanese(dish.name, 46, W - height - 130), {
      fontFamily: FONT_TITLE, fontSize: '46px', fontStyle: '600', color: COLOR.cream,
    }).setOrigin(0, 0.5));
    if (dish.raw) {
      box.add(this.add.text(height + 44, height / 2 + 34, blocked ? (frozen ? '冷凍したので生では作れない' : '3日たったので作れない') : '生の料理：寄生虫に注意', {
        fontFamily: FONT_BODY, fontSize: '26px', color: '#ffd27a',
      }).setOrigin(0, 0.5));
    }
    if (blocked) { box.setAlpha(0.45); return; }
    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerup', () => {
      if (this.leaving) return;
      this.leaving = true;
      Sound.unlock();
      changeScene(this, 'Prep', { ...this.catchData, dish });
    });
  }
}

class EatScene extends Phaser.Scene {
  constructor() { super('Eat'); }

  init(data) {
    this.catchData = data;
    this.fish = data.fish;
    this.dish = data.dish;
    this.leaving = false;
  }

  preload() { preloadDishPhotos(this, this.fish); }

  create() {
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 500, 20, 12, 8);
    this.add.rectangle(0, 0, W, H, 0x170e09).setOrigin(0).setDepth(0);

    const fish = this.fish, dish = this.dish;
    const photoH = Math.min(W, Math.round(H * 0.5));
    const key = `dish-${fish.id}-${dish.id}`;
    const photo = this.add.image(W / 2, photoH / 2, key).setDisplaySize(W, W).setDepth(1);
    if (photoH < W) photo.setCrop(0, (W - photoH) / 2, W, photoH);

    // 写真の下を、背景へなじませる
    bake(this, 'fade-down', 16, 160, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(23,14,9,0)');
      g.addColorStop(1, 'rgba(23,14,9,1)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
    this.add.image(0, photoH - 160, 'fade-down').setOrigin(0).setDisplaySize(W, 160).setDepth(2);

    if (!REDUCE_MOTION) {
      // 湯気がゆっくり立ちのぼる
      bake(this, 'steam', 200, 440, paintSteam);
      [0.34, 0.5, 0.66].forEach((fx, i) => {
        const puff = this.add.image(W * fx, photoH * 0.58, 'steam').setOrigin(0.5, 1).setAlpha(0).setDepth(3).setBlendMode(Phaser.BlendModes.SCREEN);
        const rise = () => {
          puff.setPosition(W * fx + randBetween(-20, 20), photoH * 0.58).setScale(randBetween(0.7, 1)).setAlpha(0);
          this.tweens.add({ targets: puff, y: photoH * 0.58 - 130, duration: 3400, ease: 'Sine.easeOut', onComplete: rise });
          this.tweens.add({ targets: puff, alpha: 0.55, duration: 1300, yoyo: true, hold: 600 });
        };
        this.time.delayedCall(300 + i * 800, rise);
      });
      photo.setAlpha(0);
      this.tweens.add({ targets: photo, alpha: 1, duration: 700 });
    }

    const quality = this.catchData.fresh * 0.5 + this.catchData.skill * 0.5;
    const rank = quality >= 0.85 ? '絶品' : quality >= 0.6 ? '上手にできた' : 'ふつうにおいしい';
    const stars = quality >= 0.85 ? '★★★' : quality >= 0.6 ? '★★☆' : '★☆☆';

    this.add.text(W - 22, photoH - 8, '絵はAIで作成', {
      fontFamily: FONT_BODY, fontSize: '22px', color: COLOR.cream,
    }).setOrigin(1, 1).setAlpha(0.7).setDepth(4);

    titleText(this, photoH + 40, dish.name);
    bodyText(this, W / 2, photoH + 90, `${stars}　${rank}${this.catchData.frozen ? '（冷凍）' : ''}`, 34, { color: '#ffd27a' });

    // ここまで来たら「料理した」。冷蔵庫の魚はここで使い切る
    rewardToast(this, Book.recordCook(fish, dish, stars));
    if (this.catchData.stockId) Keep.remove(this.catchData.stockId);

    // 「いただきます」を押すと「食べた」になり、食レポが出る
    const eat = createButton(this, W / 2, H - 150, 'いただきます', () => {
      eat.setVisible(false).disableInteractive();
      rewardToast(this, Book.recordEat(fish));
      this.showTasting(photoH);
    }, 46).setDepth(40);
  }

  showTasting(photoH) {
    const fish = this.fish, dish = this.dish;
    const report = bodyText(this, W / 2, photoH + 150, dish.foodReport, 32);
    const best = fish.facts.bestWay;
    if (best.status === '確認済み' && !dish.raw) {
      bodyText(this, W / 2, report.y + report.height + 20, `豆知識：${best.value}`, 26, { color: '#e6d3b4' });
    }

    createButton(this, W / 2, H - 212, '実際に作るなら', () => recipeSheet(fish, dish), 40).setDepth(40);
    createSmallButton(this, W / 2 - 185, H - 76, '港へもどる', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Harbor');
    });
    createSmallButton(this, W / 2 + 185, H - 76, 'また釣りに行く', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Fishing', {});
    });
  }
}

return [TitleScene, HarborScene, FishingScene, CoolerScene, PrepScene, CookScene, EatScene];
}

/* ============================================================
   7. 起動
   ============================================================ */
(function boot() {
  if (!window.Phaser) {
    showNotice('ゲームを読み込めませんでした', ['通信のよい場所で、もう一度開いてください。']);
    return;
  }
  const fishData = loadFishData();
  if (!fishData) return;

  window.fishData = fishData;  // 段階2以降の画面から使う
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: W,
    height: H,
    backgroundColor: '#3c4770',
    banner: false,
    audio: { noAudio: true },   // 音は「4. 音と振動」で作るので、Phaserの音は使わない
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: makeScenes(),
  });
})();
</script>
