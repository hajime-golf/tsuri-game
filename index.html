  .keep-item { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; background: #f3e4c8; border-radius: 12px; }
  .keep-body { flex: 1; min-width: 0; font-size: 14px; line-height: 1.6; }
  .keep-warn { color: #a23a1a; font-weight: bold; }
  .keep-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .sheet-box .keep-actions button { display: inline-block; margin: 0; padding: 6px 16px; font-size: 14px; }
  /* 釣りの準備の画面 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .sheet-box .chips button { display: inline-block; margin: 0; padding: 6px 14px; color: #27406a; background: #e6d3b4; font-size: 15px; }
  .sheet-box .chips button.on { color: #fff6e6; background: #27406a; }
  .sheet-box .chips button:disabled { color: #8a7760; background: #eee1c8; }
  .tip { margin: 8px 0 0; padding: 8px 12px; font-size: 14px; line-height: 1.7; background: #f3e4c8; border-radius: 10px; }
  .tip p { margin: 0; }
  .tip .sheet-source { margin-top: 2px; font-size: 12px; }
  .outlook { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: bold; }
  #notice button {
    padding: 12px 24px;
    color: #27406a;
    background: #fff6e6;
    border: 0;
    border-radius: 24px;
    font: inherit;
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="notice" role="alert"></div>
<div id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
'use strict';

/* ============================================================
   2. ゲームの設定
   ============================================================ */
const GAME_VERSION = 'v0.6';
const TAU = Math.PI * 2;

// 横幅は固定し、高さを端末の縦横比に合わせる（スマホで上下左右に余白を出さないため）
const W = 780;
const H = (() => {
  const aspect = window.innerWidth / window.innerHeight;
  if (!(aspect > 0) || aspect >= 1) return 1560;  // PCや横向きは決まった縦長で表示する
  return Math.round(W / Math.min(0.62, Math.max(0.45, aspect)));
})();

const HORIZON = Math.round(H * 0.6);      // 水平線の高さ
const SEA_H = H - HORIZON;
const SUN_X = Math.round(W * 0.63);

const FONT_TITLE = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif';
const FONT_BODY = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif';

const COLOR = {
  cream: '#fff6e6',
  ink: '#27406a',
  shore: '#171a2c',
};

// 動きを減らす設定の端末では、波やふわっと出る動きを控えめにする
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// やり取りの調整用の数字（ゲームの手応えを決めるもので、現実の魚のデータではない）
// calm：おとなしい時間（秒）／warn：合図の時間／surge：強く引く時間／reel：巻いて寄る速さ
// out：緩めたときに糸が出る速さ／extra：どこまで糸を出されるとにげられるか
const FIGHT_STYLES = {
  dart: {
    calm: [0.9, 1.9], warn: 0.38, surge: 0.38, reel: 0.12, out: 0.08, extra: 0.4, side: 0.3, dive: false,
    warnText: 'ピクッときた！', surgeText: '小きざみに引いてる！',
    escapeText: '遠くへにげられた…',
  },
  run: {
    calm: [1.4, 2.8], warn: 0.6, surge: 1.2, reel: 0.15, out: 0.09, extra: 0.6, side: 1, dive: false,
    warnText: '横に走るぞ！', surgeText: '走った！ はなして！',
    escapeText: '糸を出されすぎた…',
  },
  dive: {
    calm: [1.1, 2.2], warn: 0.5, surge: 0.9, reel: 0.09, out: 0.26, extra: 0.3, side: 0, dive: true, first: 0.5,
    warnText: '潜るぞ！', surgeText: 'こらえて！ はなすな！',
    escapeText: '岩のすきまに潜られた…',
  },
};
const TENSION_SLACK = 0.18;   // これより下は「ゆるい」
const TENSION_DANGER = 0.82;  // これより上は「切れそう」
const HOLD_STRAIN = 0.09;     // 押し続けた1秒ごとに、糸の張りの目標が上がる量
const METERS_PER_DIST = 40;   // 画面の距離1が何mに見えるか

function randBetween(a, b) { return a + Math.random() * (b - a); }

// 失敗したときの案内を、画面いっぱいに出す
function showNotice(title, lines, code) {
  const box = document.getElementById('notice');
  box.textContent = '';
  const h = document.createElement('h1');
  h.textContent = title;
  box.appendChild(h);
  for (const line of lines) {
    const p = document.createElement('p');
    p.textContent = line;
    box.appendChild(p);
  }
  if (code) {
    const p = document.createElement('p');
    const c = document.createElement('code');
    c.textContent = code;
    p.appendChild(c);
    box.appendChild(p);
  }
  const button = document.createElement('button');
  button.textContent = 'もう一度読み込む';
  button.addEventListener('click', () => location.reload());
  box.appendChild(button);
  box.style.display = 'block';
}

// エラーの文から「データの何行目か」を取り出す（ブラウザごとに書き方が違う）
function findErrorLine(text, message) {
  let match = /line (\d+) column/.exec(message);
  if (match) return Number(match[1]);
  match = /position (\d+)/.exec(message);
  if (match) return text.slice(0, Number(match[1])).split('\n').length;
  return null;
}

// 先頭の魚データを読む。書き間違いがあれば、場所を案内して null を返す
function loadFishData() {
  const text = document.getElementById('fish-data').textContent;
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    const line = findErrorLine(text, String(err.message));
    const code = line ? text.split('\n')[line - 1].trim() : null;
    showNotice(
      '魚データの書き方に間違いがあります',
      [line
        ? 'index.html の魚データで、次の行か、その1つ上の行を見てください。カンマや「"」の抜けがよくある原因です。'
        : 'index.html の魚データで、カンマや「"」の抜けがないか見てください。'],
      code
    );
    return null;
  }
  if (!data || !Array.isArray(data.fish) || typeof data.sources !== 'object' || data.sources === null) {
    showNotice('魚データの形が違います', ['魚データには「sources」と「fish」の欄が必要です。']);
    return null;
  }
  if (!data.gear || !['spots', 'times', 'rods', 'methods', 'baits'].every((k) => Array.isArray(data.gear[k]) && data.gear[k].length)) {
    showNotice('道具データの形が違います', ['魚データの「gear」に、spots、times、rods、methods、baits が必要です。']);
    return null;
  }
  if (data.fish.length === 0) {
    showNotice('魚データが空です', ['魚データの「fish」に、魚を1種類以上入れてください。']);
    return null;
  }
  // ゲームに必要な数字がそろっているかを、魚ごとに確かめる
  for (const fish of data.fish) {
    const g = fish && fish.game;
    const ok = g && Array.isArray(g.sizeCm) && g.sizeCm.length === 2 && FIGHT_STYLES[g.fight]
      && Number.isFinite(g.power) && Number.isFinite(g.biteWindowMs) && Number.isFinite(g.weightA)
      && Array.isArray(g.nibbles) && g.nibbles.length === 2
      && Array.isArray(g.bestRange) && g.bestRange.length === 2
      && Array.isArray(g.spots) && g.seasonRate && Array.isArray(g.timeRate) && g.timeRate.length === 4
      && Number.isFinite(g.pricePerKg);
    if (!ok) {
      showNotice(
        '魚データの「game」の欄に足りないものがあります',
        ['sizeCm、fight（dart / run / dive）、power、biteWindowMs、nibbles、bestRange、weightA、spots、seasonRate、timeRate、pricePerKg を見てください。'],
        fish && fish.name ? String(fish.name) : null
      );
      return null;
    }
  }
  return data;
}

/* ============================================================
   3. 保存（使えない環境では、開いている間だけ覚えておく）
   ============================================================ */
const Save = (() => {
  const KEY = 'tsuri-game/save/v1';
  const DEFAULTS = {
    version: 1, plays: 0, sound: true,
    day: 1, money: 0, nextStockId: 1,
    book: {},        // 魚ごとの図鑑の記録
    stock: [],       // 冷蔵庫と冷凍庫の魚
    catchLog: [],    // 釣った記録
    cookLog: [],     // 料理した記録
    trip: {},        // 釣りの準備（釣り場、時間帯、竿、仕掛け、エサ）
    requests: [],    // ご近所の依頼
    nextRequestId: 1,
    requestDay: 0,   // 依頼を最後に増やした日
    contestDay: 0,   // 最後に釣り大会に出た日
    contestLog: [],  // 釣り大会の結果
  };
  let state = { ...DEFAULTS };
  let available = false;

  try {
    const storage = window.localStorage;
    storage.setItem(KEY + '/test', '1');
    storage.removeItem(KEY + '/test');
    available = true;
    const raw = storage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') state = { ...DEFAULTS, ...parsed };
    }
  } catch (err) {
    // 保存が使えない、または中身が壊れている場合は、最初の状態で続ける
  }

  // 中身の形がおかしい欄は、その欄だけ最初の状態に戻す（前の版の保存もそのまま使える）
  for (const name of ['stock', 'catchLog', 'cookLog', 'requests', 'contestLog']) {
    if (!Array.isArray(state[name])) state[name] = [];
  }
  for (const name of ['book', 'trip']) {
    if (!state[name] || typeof state[name] !== 'object' || Array.isArray(state[name])) state[name] = {};
  }
  for (const name of ['day', 'money', 'nextStockId', 'nextRequestId', 'requestDay', 'contestDay']) {
    if (!Number.isFinite(state[name])) state[name] = DEFAULTS[name];
  }

  return {
    get data() { return state; },
    get available() { return available; },
    commit() {
      if (!available) return;
      try {
        window.localStorage.setItem(KEY, JSON.stringify(state));
      } catch (err) {
        available = false;  // 容量切れなど。以降は保存せずに続ける
      }
    },
  };
})();

// 魚をとっておくルール（ゲームの調整用の数字で、現実の保存の目安ではない）
const RULES = {
  rawDays: 3,          // 冷蔵で、この日数がたつと生の料理は作れない
  fridgeDays: 7,       // 冷蔵で、この日数がたつと腐る
  freezerDays: 30,     // 冷凍してから、この日数がたつと捨てるしかない
  fridgeFade: 0.1,     // 冷蔵で1日ごとに下がる鮮度の割合
  fridgeFloor: 0.3,    // 冷蔵の鮮度が下がる下限の割合
  frozenTaste: 0.6,    // 冷凍すると、味（鮮度）にかかる割合
  frozenPrice: 0.6,    // 冷凍すると、売値にかかる割合
};
const RULE_NOTE = '生の料理は釣ってから3日まで、冷蔵は7日まで、冷凍は1か月まで、冷凍した魚は生で使えない、というのはゲームのルールです。現実の保存の目安ではありません。';

// 図鑑の達成ごほうび（お金D）。数字はゲーム用で、あとから直してよい
const BOOK_REWARDS = { caught: 100, cooked: 200, eaten: 100, fishComplete: 500, allComplete: 3000 };
const LOG_LIMIT = 200;   // 記録をいくつまで残すか

// 冷蔵庫と冷凍庫
const Keep = {
  items() { return Save.data.stock; },

  add(catchData) {
    const d = Save.data;
    d.stock.push({
      id: d.nextStockId++,
      fishId: catchData.fish.id,
      sizeCm: catchData.sizeCm,
      weight: catchData.weight,
      fresh: catchData.fresh,
      caughtDay: d.day,
      frozenDay: null,
    });
    Save.commit();
  },

  // いまの状態（あと何日もつか、生で使えるか、鮮度はいくつか）
  info(item) {
    const today = Save.data.day;
    const days = today - item.caughtDay;
    if (item.frozenDay !== null) {
      const left = RULES.freezerDays - (today - item.frozenDay);
      return { frozen: true, days, left, rotten: left <= 0, rawOk: false, fresh: item.fresh * RULES.frozenTaste };
    }
    const left = RULES.fridgeDays - days;
    const fade = Math.max(RULES.fridgeFloor, 1 - days * RULES.fridgeFade);
    return { frozen: false, days, left, rotten: left <= 0, rawOk: days < RULES.rawDays, fresh: item.fresh * fade };
  },

  // 冷凍する。凍らせた時点の鮮度をとっておく
  freeze(id) {
    const item = Save.data.stock.find((x) => x.id === id);
    if (!item || item.frozenDay !== null) return;
    item.fresh *= Math.max(RULES.fridgeFloor, 1 - (Save.data.day - item.caughtDay) * RULES.fridgeFade);
    item.frozenDay = Save.data.day;
    Save.commit();
  },

  remove(id) {
    Save.data.stock = Save.data.stock.filter((x) => x.id !== id);
    Save.commit();
  },

  // 腐った魚と、あと1日で腐る魚の数
  worryCount() {
    return Save.data.stock.filter((item) => this.info(item).left <= 1).length;
  },

  nextDay() {
    Save.data.day += 1;
    Save.commit();
  },
};

// 魚の区分（CLAUDE.md の prepType）
function isNoEat(fish) { return !!fish && fish.safety.prepType === 'noEat'; }         // 図鑑で注意を伝えるだけの魚
function isLicensed(fish) { return !!fish && fish.safety.prepType === 'licensed'; }   // 資格を持つ人（店）にさばいてもらう魚
function hasPoison(fish) { return !!fish && fish.safety.prepType === 'removePoison'; } // 毒のトゲを取ってからさばく魚

// 釣りの準備。釣れやすさの数字はゲームのルールで、現実のデータではない
const SEASON_NAMES = ['春', '夏', '秋', '冬'];
const SEASON_DAYS = 10;   // ゲームの何日で季節が変わるか
const Trip = {
  gear(kind) { return window.fishData.gear[kind]; },

  // 次に釣りへ行く日の季節（1日は最初に投げたときに進むので、今日の次の日で数える）
  seasonIndex() { return Math.floor(Save.data.day / SEASON_DAYS) % 4; },
  tripsLeft() { return SEASON_DAYS - (Save.data.day % SEASON_DAYS); },

  // 今の季節に行ける釣り場か（渓流は冬が禁漁）
  spotOpen(spot) {
    return spot.open !== false && !(spot.closedSeasons || []).includes(this.seasonIndex());
  },

  // 保存された選択を確かめて、今の組み合わせを返す。合わないものは使えるものに直す
  current() {
    const saved = Save.data.trip;
    const pick = (list, id) => list.find((x) => x.id === id) || list[0];
    const spot = pick(this.gear('spots').filter((s) => this.spotOpen(s)), saved.spot);
    const time = pick(this.gear('times'), saved.time);
    const method = pick(this.gear('methods').filter((m) => m.spots.includes(spot.id)), saved.method);
    const rods = this.gear('rods').filter((r) => r.spots.includes(spot.id));
    const fitRod = rods.find((r) => method.rods.includes(r.id));
    const rod = pick(rods, saved.rod || (fitRod && fitRod.id));   // まだ選んでいないときは、仕掛けに合う竿にする
    const bait = pick(this.gear('baits').filter((b) => method.baits.includes(b.id)), saved.bait);
    return { spot, time, method, rod, bait };
  },

  choose(kind, id) {
    Save.data.trip[kind] = id;
    // 釣り場や仕掛けを変えたら、合う竿とエサに合わせる
    if (kind === 'spot' || kind === 'method') {
      const t = this.current();
      Save.data.trip.method = t.method.id;
      const fitRod = this.gear('rods').find((r) => t.method.rods.includes(r.id) && r.spots.includes(t.spot.id));
      if (fitRod) Save.data.trip.rod = fitRod.id;
      Save.data.trip.bait = t.method.baits[0];
    }
    Save.commit();
  },

  // その魚の釣れやすさ。0ならその釣り場にいない
  rate(fish, trip, seasonIndex) {
    const g = fish.game;
    if (!g.spots.includes(trip.spot.id)) return 0;
    const season = g.seasonRate[trip.spot.id][seasonIndex];
    const time = g.timeRate[this.gear('times').indexOf(trip.time)];
    const rod = trip.method.rods.includes(trip.rod.id) ? 1 : 0.75;
    return season * time * (trip.method.fit[fish.id] || 0.1) * (trip.bait.fit[fish.id] || 0.1) * rod;
  },

  // アタリが来るかどうかの確率
  biteChance(rate) { return Math.min(1, 0.3 + 0.45 * rate); },
};

// 市場。売値はゲーム用の数字
const EAT_BONUS = 1.3;   // 食べると、売値の何倍の得になるか（売るより得にするため1より大きくする）
const Market = {
  // 売れる魚か。フグ（未処理のフグを売ることは禁止されている）と、食べない魚は売らない
  canSell(fish) { return !!fish && !isLicensed(fish) && !isNoEat(fish) && fish.game.pricePerKg > 0; },

  // fresh は図鑑の鮮度の数字。冷凍の魚は味の割合がかかっているので、元にもどして値段を出す
  price(fish, weight, fresh, frozen) {
    const base = Math.min(1, fresh / (frozen ? RULES.frozenTaste : 1));
    const value = (weight / 1000) * fish.game.pricePerKg * (0.4 + 0.6 * base);
    return Math.max(5, Math.round(value * (frozen ? RULES.frozenPrice : 1)));
  },

  itemPrice(item, fish) {
    const info = Keep.info(item);
    return this.price(fish, item.weight, info.fresh, info.frozen);
  },

  sell(item, fish) {
    const price = this.itemPrice(item, fish);
    Save.data.money += price;
    Keep.remove(item.id);   // ここで保存もされる
    return price;
  },

  // 食べると食費が浮く。同じ魚を売るより、必ず多くもらえる
  eat(data) {
    const price = this.price(data.fish, Number.isFinite(data.weight) ? data.weight : 0, data.fresh, !!data.frozen);
    const bonus = Math.ceil(price * EAT_BONUS);
    Save.data.money += bonus;
    Save.commit();
    return `食費が浮いた！　+${bonus}D`;
  },
};

// ご近所の依頼。冷蔵庫の魚を渡すとお礼がもらえる
const REQUEST_LIMIT = 3;       // 同時に受けられる数
const REQUEST_DAYS = 10;       // 何日のあいだ待ってくれるか
const NEIGHBORS = [
  { who: 'となりのおばあちゃん', line: '夕飯に魚が食べたくてねえ' },
  { who: '角の八百屋さん', line: 'お店のまかないにしたいんだ' },
  { who: '下の階の親子', line: '子どもに魚を食べさせたくて' },
  { who: '町内会長さん', line: '今度の集まりに持っていきたいな' },
];
const Requests = {
  make() {
    const d = Save.data;
    // なるべく今の依頼と違う魚にする。フグは人にあげない、食べない魚は頼まれない
    const all = window.fishData.fish.filter((f) => Market.canSell(f));
    const unused = all.filter((f) => !d.requests.some((r) => r.fishId === f.id));
    const list = unused.length ? unused : all;
    const fish = list[Math.floor(Math.random() * list.length)];
    const [low, high] = fish.game.sizeCm;
    const minCm = Math.round(low + (high - low) * Math.random() * 0.45);
    const person = NEIGHBORS[Math.floor(Math.random() * NEIGHBORS.length)];
    const weight = fish.game.weightA * Math.pow(minCm, 3);
    const reward = Market.price(fish, weight, 0.8, false) * 2 + 80;
    d.requests.push({ id: d.nextRequestId++, fishId: fish.id, minCm, reward, who: person.who, line: person.line, until: d.day + REQUEST_DAYS });
  },

  // 古い依頼を消して、1日に1件ずつ増やす（はじめて開いたときは全部出す）
  refresh() {
    const d = Save.data;
    d.requests = d.requests.filter((r) => r.until >= d.day);
    if (d.requestDay === 0) {
      while (d.requests.length < REQUEST_LIMIT) this.make();
    } else if (d.day > d.requestDay && d.requests.length < REQUEST_LIMIT) {
      this.make();
    }
    d.requestDay = d.day;
    Save.commit();
  },

  // 依頼に渡せる魚（冷蔵庫の、腐っていない、大きさが足りている魚）
  matches(request) {
    return Keep.items().filter((item) => {
      const info = Keep.info(item);
      return item.fishId === request.fishId && !info.frozen && !info.rotten && item.sizeCm >= request.minCm;
    });
  },

  deliver(request, item) {
    Save.data.money += request.reward;
    Save.data.requests = Save.data.requests.filter((r) => r.id !== request.id);
    Keep.remove(item.id);
  },
};

// 店にさばいてもらう料金（ゲーム用の数字）。売値の半分＋200D
function shopFee(fish, weight, fresh, frozen) {
  return Math.round(Market.price(fish, weight, fresh, frozen) / 2) + 200;
}

// 釣り大会（お金C）。おまけの遊び。日にち、投げる回数、賞金、ライバルの強さはゲーム用の数字
// 「1か月」はゲームの30日。大潮の日はゲームのカレンダーで決めていて、現実の潮ごよみとは違う
const CONTEST_KEEP = 3;   // キープできる数
const CONTEST_KINDS = {
  small: { name: '小さな大会', every: 3, casts: 8, reveal: 4, rivals: 2, prizes: [300, 120, 40] },
  big: { name: '大潮の大会', every: 15, casts: 10, reveal: 5, rivals: 3, prizes: [1200, 500, 200, 60] },
};
const RIVAL_NAMES = ['港のサブロウさん', '釣具店のハルカさん', '常連のゲンさん'];
const Contest = {
  // その日に大会があるか（大潮の日は大きい大会だけ）
  kindOn(day) {
    if (day % CONTEST_KINDS.big.every === 0) return 'big';
    if (day % CONTEST_KINDS.small.every === 0) return 'small';
    return null;
  },
  // 次の釣りの日（最初に投げたときに1日進むので、今日の次の日）
  nextTripDay() { return Save.data.day + 1; },
  // 次の釣りで出られる大会。一度出た日はもう出られない
  available() {
    const day = this.nextTripDay();
    return Save.data.contestDay === day ? null : this.kindOn(day);
  },
  // あと何回釣りに行くと、その大会の日になるか
  tripsUntil(kind) {
    for (let n = 1; n <= 60; n++) if (this.kindOn(Save.data.day + n) === kind) return n;
    return null;
  },

  // ライバルの釣果を、今の釣り場の魚から先に決めておく
  start(kind, rates) {
    const def = CONTEST_KINDS[kind];
    const list = window.fishData.fish;
    const usable = rates.map((r, i) => (isNoEat(list[i]) ? 0 : r));
    const rivals = RIVAL_NAMES.slice(0, def.rivals).map((name) => {
      const casts = Phaser.Utils.Array.Shuffle(Array.from({ length: def.casts }, (_, i) => i + 1)).slice(0, CONTEST_KEEP).sort((a, b) => a - b);
      const catches = casts.map((at) => {
        const fish = pickFish(randBetween(0.2, 1), usable);
        const r = Math.max(Math.pow(Math.random(), 1.6), Math.pow(Math.random(), 1.6));
        return { fishId: fish.id, at, ...this.sized(fish, fish.game.sizeCm[0] + (fish.game.sizeCm[1] - fish.game.sizeCm[0]) * r) };
      });
      return { name, catches };
    });
    return { kind, def, cast: 0, kept: [], rivals, fixed: false };
  },

  sized(fish, sizeCm) {
    const [low, high] = fish.game.sizeCm;
    const cm = Math.min(high, Math.max(low, sizeCm));
    return { sizeCm: cm, weight: fish.game.weightA * Math.pow(cm, 3) };
  },

  // 見せてよいライバルの釣果（途中からは見せない）
  shown(c, rival) {
    if (c.cast > c.def.reveal) return null;
    return rival.catches.filter((x) => x.at <= c.cast);
  },

  // 終わったとき、見せていない釣果を少し動かして、いい勝負にする
  settle(c) {
    if (c.fixed) return;
    c.fixed = true;
    const mine = c.kept.reduce((s, x) => s + x.weight, 0);
    if (mine <= 0) return;
    for (const rival of c.rivals) {
      const open = rival.catches.filter((x) => x.at <= c.def.reveal);
      const hidden = rival.catches.filter((x) => x.at > c.def.reveal);
      if (!hidden.length) continue;
      const openW = open.reduce((s, x) => s + x.weight, 0);
      const hiddenW = hidden.reduce((s, x) => s + x.weight, 0);
      const target = mine * randBetween(0.85, 1.15);
      const k = Math.min(2.5, Math.max(0.5, (target - openW) / Math.max(1, hiddenW)));
      for (const x of hidden) {
        const fish = window.fishData.fish.find((f) => f.id === x.fishId);
        Object.assign(x, this.sized(fish, Math.cbrt((x.weight * k) / fish.game.weightA)));
      }
    }
  },

  // 重さの賞（キープした魚の合計）と、大きさの賞（いちばん大きい1匹）の順位と賞金
  results(c) {
    this.settle(c);
    const people = [{ name: 'あなた', me: true, catches: c.kept }, ...c.rivals];
    const rank = (score) => people
      .map((p) => ({ name: p.name, me: !!p.me, value: score(p.catches) }))
      .sort((a, b) => b.value - a.value)
      .map((p, i) => ({ ...p, place: i + 1, prize: p.value > 0 ? (c.def.prizes[i] || 0) : 0 }));
    return {
      weight: rank((list) => list.reduce((s, x) => s + x.weight, 0)),
      size: rank((list) => list.reduce((m, x) => Math.max(m, x.sizeCm), 0)),
    };
  },
};

// 図鑑の記録と達成ごほうび。ごほうびの知らせを文字の配列で返す
const Book = {
  entry(id) {
    const book = Save.data.book;
    if (!book[id]) book[id] = { caught: 0, cooked: 0, eaten: 0, maxCm: 0, dishes: {} };
    return book[id];
  },

  // 食べない魚は「釣れた」だけでそろう
  kinds(fish) { return isNoEat(fish) ? ['caught'] : ['caught', 'cooked', 'eaten']; },
  complete(fish) { const e = this.entry(fish.id); return this.kinds(fish).every((k) => e[k] > 0); },

  stampCount() {
    let n = 0;
    for (const fish of window.fishData.fish) {
      const e = this.entry(fish.id);
      n += this.kinds(fish).filter((k) => e[k] > 0).length;
    }
    return n;
  },
  stampTotal() { return window.fishData.fish.reduce((n, f) => n + this.kinds(f).length, 0); },
  rate() { return Math.floor((this.stampCount() / this.stampTotal()) * 100); },

  // 3段階のどれかを初めて達成したときだけ、ごほうびを出す
  stamp(fish, kind, label) {
    const e = this.entry(fish.id);
    const first = e[kind] === 0;
    e[kind] += 1;
    const notes = [];
    if (first) {
      Save.data.money += BOOK_REWARDS[kind];
      notes.push(`図鑑「${fish.name}」${label}　+${BOOK_REWARDS[kind]}D`);
      if (this.complete(fish)) {
        Save.data.money += BOOK_REWARDS.fishComplete;
        notes.push(`${fish.name}をコンプリート！　+${BOOK_REWARDS.fishComplete}D`);
      }
      if (this.stampCount() === this.stampTotal()) {
        Save.data.money += BOOK_REWARDS.allComplete;
        notes.push(`図鑑コンプリート！　+${BOOK_REWARDS.allComplete}D`);
      }
    }
    return notes;
  },

  pushLog(name, row) {
    const log = Save.data[name];
    log.push(row);
    if (log.length > LOG_LIMIT) log.splice(0, log.length - LOG_LIMIT);
  },

  recordCatch(fish, sizeCm, weight) {
    const e = this.entry(fish.id);
    e.maxCm = Math.max(e.maxCm, sizeCm);
    this.pushLog('catchLog', { day: Save.data.day, fishId: fish.id, sizeCm, weight: Math.round(weight) });
    const notes = this.stamp(fish, 'caught', '釣れた');
    Save.commit();
    return notes;
  },

  recordCook(fish, dish, stars) {
    const e = this.entry(fish.id);
    e.dishes[dish.id] = (e.dishes[dish.id] || 0) + 1;
    this.pushLog('cookLog', { day: Save.data.day, fishId: fish.id, dishId: dish.id, stars });
    const notes = this.stamp(fish, 'cooked', '料理した');
    Save.commit();
    return notes;
  },

  recordEat(fish) {
    const notes = this.stamp(fish, 'eaten', '食べた');
    Save.commit();
    return notes;
  },
};

   4. 音と振動、スマホを振る操作
   ============================================================ */

// 音はファイルを使わず、その場で作る
const Sound = (() => {
  let ctx = null;
  let master = null;
  let noiseBuffer = null;
  let sea = null;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = Save.data.sound ? 1 : 0;
      master.connect(ctx.destination);
      noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const samples = noiseBuffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    } catch (err) {
      ctx = null;  // 音が使えない環境では、音なしで続ける
    }
    return ctx;
  }

  // 高さを変えられる1音
  function tone(freq, dur, { type = 'sine', vol = 0.2, slideTo = null, delay = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // 水や風の「ザーッ」という音
  function noise(dur, { from = 1200, to = 300, vol = 0.2, type = 'lowpass', delay = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    src.buffer = noiseBuffer;
    filter.type = type;
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(master);
    src.start(t, Math.random());
    src.stop(t + dur + 0.02);
  }

  return {
    // 指で押した流れで呼ぶ（ブラウザは、押されるまで音を出させてくれない）
    unlock() {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
    },
    setEnabled(on) {
      Save.data.sound = on;
      Save.commit();
      if (master) master.gain.value = on ? 1 : 0;
    },
    startSea() {
      if (!ctx || sea) return;
      const src = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      src.buffer = noiseBuffer;
      src.loop = true;
      filter.type = 'lowpass';
      filter.frequency.value = 520;
      gain.gain.value = 0.05;
      lfo.frequency.value = 0.13;   // ゆっくり寄せては返す
      lfoGain.gain.value = 0.025;
      lfo.connect(lfoGain).connect(gain.gain);
      src.connect(filter).connect(gain).connect(master);
      src.start();
      lfo.start();
      sea = { src, lfo };
    },
    stopSea() {
      if (!sea) return;
      try { sea.src.stop(); sea.lfo.stop(); } catch (err) { /* すでに止まっている */ }
      sea = null;
    },
    cast()   { noise(0.42, { from: 2600, to: 500, vol: 0.14, type: 'bandpass' }); },
    splash() { noise(0.36, { from: 1800, to: 260, vol: 0.2 }); tone(240, 0.1, { slideTo: 90, vol: 0.12 }); },
    nibble() { tone(620, 0.07, { vol: 0.12, slideTo: 420 }); },
    bite()   { noise(0.3, { from: 1400, to: 200, vol: 0.28 }); tone(170, 0.24, { slideTo: 70, vol: 0.3 }); },
    hook()   { tone(330, 0.09, { type: 'triangle', vol: 0.2 }); tone(495, 0.14, { type: 'triangle', vol: 0.2, delay: 0.07 }); },
    warn()   { tone(880, 0.08, { type: 'triangle', vol: 0.16 }); tone(880, 0.08, { type: 'triangle', vol: 0.16, delay: 0.12 }); },
    surge()  { noise(0.3, { from: 900, to: 220, vol: 0.2 }); tone(130, 0.3, { type: 'sawtooth', vol: 0.08, slideTo: 90 }); },
    tick(t)  { tone(300 + t * 420, 0.025, { type: 'square', vol: 0.03 }); },
    snap()   { noise(0.12, { from: 5000, to: 1500, vol: 0.3, type: 'highpass' }); tone(1200, 0.12, { slideTo: 200, vol: 0.16 }); },
    miss()   { tone(300, 0.26, { type: 'triangle', slideTo: 170, vol: 0.14 }); },
    caught() {
      noise(0.42, { from: 2200, to: 300, vol: 0.2 });
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.34, { type: 'triangle', vol: 0.2, delay: 0.12 + i * 0.11 }));
    },
  };
})();

// 振動。Androidは本物の振動、iPhoneのSafariには振動の機能がないので小さな手応えだけ試す
const Buzz = (() => {
  const canVibrate = typeof navigator.vibrate === 'function';
  let iosSwitch = null;

  function tapIos() {
    if (!iosSwitch) {
      iosSwitch = document.createElement('label');
      iosSwitch.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      iosSwitch.appendChild(input);
      document.body.appendChild(iosSwitch);
    }
    iosSwitch.click();
  }

  return {
    pulse(pattern) {
      if (!canVibrate) return;
      try { navigator.vibrate(pattern); } catch (err) { /* 振動できなくても続ける */ }
    },
    // 指で押した瞬間だけ呼ぶ
    tap() {
      if (canVibrate) this.pulse(10);
      else if (navigator.maxTouchPoints > 0) tapIos();
    },
  };
})();

// スマホを振った動きを見つける
const Motion = (() => {
  const THRESHOLD = 15;      // これより強く動いたら「振った」とする（m/s²）
  const PEAK_WINDOW = 160;   // いちばん強いところを探す時間（ミリ秒）
  const COOLDOWN = 500;      // 1回振ったあと、次を受けつけない時間（ミリ秒）
  const supported = 'DeviceMotionEvent' in window && navigator.maxTouchPoints > 0;
  let listening = false;
  let callback = null;
  let peak = 0;
  let peakEnd = 0;
  let coolUntil = 0;

  function strengthOf(event) {
    const a = event.acceleration;
    if (a && a.x !== null && a.x !== undefined) return Math.hypot(a.x, a.y, a.z);
    const g = event.accelerationIncludingGravity;
    if (g && g.x !== null && g.x !== undefined) return Math.abs(Math.hypot(g.x, g.y, g.z) - 9.8);
    return 0;
  }

  function onMotion(event) {
    const now = performance.now();
    if (now < coolUntil) return;
    const m = strengthOf(event);
    if (peak === 0) {
      if (m >= THRESHOLD) { peak = m; peakEnd = now + PEAK_WINDOW; }
      return;
    }
    peak = Math.max(peak, m);
    if (now >= peakEnd) {
      const strength = Math.min(1, (peak - THRESHOLD) / 25);
      peak = 0;
      coolUntil = now + COOLDOWN;
      if (callback) callback(strength);
    }
  }

  return {
    supported,
    // iPhoneは、ボタンを押した流れの中で許可を求める必要がある
    async request() {
      try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          const answer = await DeviceMotionEvent.requestPermission();
          if (answer !== 'granted') return false;
        }
        if (!listening) {
          window.addEventListener('devicemotion', onMotion);
          listening = true;
        }
        return true;
      } catch (err) {
        return false;  // 許可されなくても、ボタンで遊べる
      }
    },
    onSwing(fn) { callback = fn; peak = 0; },
  };
})();

/* ============================================================
   5. 図形の絵（水彩風の絵は、最初に一度だけ描いてとっておく）
   ============================================================ */

// 同じ絵が毎回同じように描けるよう、種つきの乱数を使う
function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function bake(scene, key, width, height, draw) {
  if (scene.textures.exists(key)) return;
  const texture = scene.textures.createCanvas(key, width, height);
  draw(texture.getContext(), width, height);
  texture.refresh();
}

// ふちがぼけた、にじみの丸
function blob(ctx, x, y, rx, ry, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, rgba(color, alpha));
  g.addColorStop(0.7, rgba(color, alpha * 0.6));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// 少しずつ形を変えて薄く重ね塗りし、水彩のにじんだふちを作る
function wash(ctx, rnd, cx, cy, rx, ry, color, passes, alpha) {
  const count = 20;
  const base = Array.from({ length: count }, () => 1 + (rnd() - 0.5) * 0.36);
  ctx.fillStyle = rgba(color, alpha);
  for (let p = 0; p < passes; p++) {
    const pts = base.map((r, k) => {
      const a = (k / count) * TAU;
      const j = r * (1 + (rnd() - 0.5) * 0.26);
      return [cx + Math.cos(a) * rx * j, cy + Math.sin(a) * ry * j];
    });
    ctx.beginPath();
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const start = mid(pts[count - 1], pts[0]);
    ctx.moveTo(start[0], start[1]);
    for (let k = 0; k < count; k++) {
      const m = mid(pts[k], pts[(k + 1) % count]);
      ctx.quadraticCurveTo(pts[k][0], pts[k][1], m[0], m[1]);
    }
    ctx.closePath();
    ctx.fill();
  }
}

// 朝焼けの空と、海の下地
function paintDawn(ctx, w, h) {
  const rnd = seeded(11);

  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#46548a');
  sky.addColorStop(0.3, '#6d74aa');
  sky.addColorStop(0.56, '#b794b6');
  sky.addColorStop(0.78, '#eea898');
  sky.addColorStop(0.93, '#f8cb94');
  sky.addColorStop(1, '#fde5b4');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, HORIZON);

  // 空のにじみ
  const tints = ['#8c86c0', '#f3b8a8', '#5f6ca6', '#f9d7ae'];
  for (let i = 0; i < 70; i++) {
    const y = rnd() * HORIZON;
    const tint = tints[Math.min(3, Math.floor((y / HORIZON) * 3 + rnd() * 1.4))];
    blob(ctx, rnd() * w, y, 120 + rnd() * 220, 50 + rnd() * 100, tint, 0.08);
  }

  // 太陽（水平線から半分だけ出ている）
  const sunY = HORIZON - 8;
  blob(ctx, SUN_X, sunY, 430, 300, '#ffd9a0', 0.55);
  blob(ctx, SUN_X, sunY, 200, 150, '#fff0c4', 0.7);
  ctx.fillStyle = '#fff4d2';
  ctx.beginPath();
  ctx.arc(SUN_X, sunY, 62, 0, TAU);
  ctx.fill();

  // 朝日に照らされた雲（下側ほど明るい）
  const clouds = [
    [0.18, 0.60, 300, 26, '#c98fae'],
    [0.86, 0.66, 260, 22, '#f2a596'],
    [0.40, 0.76, 340, 20, '#f6a78e'],
    [0.08, 0.84, 240, 16, '#f7b48f'],
    [0.82, 0.86, 280, 15, '#fbc690'],
    [0.50, 0.46, 240, 18, '#a58ab9'],
  ];
  for (const [fx, fy, rx, ry, color] of clouds) {
    const x = fx * w;
    const y = fy * HORIZON;
    wash(ctx, rnd, x, y, rx, ry, color, 16, 0.06);
    wash(ctx, rnd, x + rx * 0.28, y + ry * 0.5, rx * 0.56, ry * 0.5, '#ffe2c4', 12, 0.06);
  }

  // 遠くの山
  ctx.beginPath();
  ctx.moveTo(0, HORIZON + 2);
  for (let x = 0; x <= w * 0.5; x += 8) {
    const fade = 1 - x / (w * 0.5);
    const lift = (46 + 26 * Math.sin(x / 70) + 12 * Math.sin(x / 23)) * fade;
    ctx.lineTo(x, HORIZON - lift);
  }
  ctx.lineTo(w * 0.5, HORIZON + 2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(133,112,168,0.72)';
  ctx.fill();

  // 海の下地
  const sea = ctx.createLinearGradient(0, HORIZON, 0, h);
  sea.addColorStop(0, '#f2c3a5');
  sea.addColorStop(0.22, '#bda6bb');
  sea.addColorStop(0.55, '#6d84aa');
  sea.addColorStop(1, '#2d5478');
  ctx.fillStyle = sea;
  ctx.fillRect(0, HORIZON, w, SEA_H);

  // 海に映る朝日
  for (let i = 0; i < 26; i++) {
    const t = i / 26;
    const y = HORIZON + t * SEA_H * 0.55;
    blob(ctx, SUN_X + (rnd() - 0.5) * 40, y, 50 + t * 170, 16, '#ffdcae', 0.16 * (1 - t * 0.7));
  }
}

// 波1枚。横の長さは画面2つ分で、1画面ごとに同じ形がくり返す（つなぎ目が出ない）
function paintWave(ctx, w, h, seed, top, deep, amp) {
  const rnd = seeded(seed);
  const period = w / 2;
  const parts = [2, 3, 5, 8].map((n) => ({ n, phase: rnd() * TAU, size: 1 / n }));
  const crest = (x) => parts.reduce(
    (sum, p) => sum + Math.sin((p.n * TAU * x) / period + p.phase) * p.size * amp,
    amp + 16
  );
  const fill = ctx.createLinearGradient(0, 0, 0, h);
  fill.addColorStop(0, top);
  fill.addColorStop(0.5, deep);
  fill.addColorStop(1, rgba(deep, 0));

  ctx.globalAlpha = 0.2;
  ctx.fillStyle = fill;
  for (let pass = 0; pass < 7; pass++) {
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 10) {
      const bleed = pass * 2.2 + 3 * Math.sin(((3 + pass) * TAU * x) / period + pass);
      ctx.lineTo(x, crest(x) + bleed);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 堤防と、釣りをしている人
const SHORE_TOP = Math.round(H * 0.74) - 300;
const ROD_TIP = { x: 430, y: SHORE_TOP + 70 };

function paintShore(ctx, w, h, noRod) {

  ctx.fillStyle = rgba(COLOR.shore, 0.5);
  for (let pass = 0; pass < 6; pass++) {
    const j = () => (rnd() - 0.5) * 5;
    ctx.beginPath();
    ctx.moveTo(0, 292 + j());
    ctx.lineTo(w * 0.42 + j(), 312 + j());
    ctx.lineTo(w * 0.44 + j(), 400 + j());
    ctx.lineTo(0, 480 + j());
    ctx.closePath();
    ctx.fill();
  }

}

// 船の上。へさきが右に伸びる
function paintBoat(ctx, w) {
  const rnd = seeded(41);

    const j = () => (rnd() - 0.5) * 5;
    ctx.beginPath();

// 渓流の川岸。手前に岩、人は岩の上に立つ
function paintRiverBank(ctx, w) {
  const rnd = seeded(61);
  ctx.fillStyle = rgba(COLOR.shore, 0.55);
  for (let pass = 0; pass < 5; pass++) {
    const j = () => (rnd() - 0.5) * 6;
    ctx.beginPath();
    ctx.moveTo(0, 300 + j());
    ctx.quadraticCurveTo(w * 0.22, 282 + j(), w * 0.4 + j(), 318 + j());
    ctx.quadraticCurveTo(w * 0.47, 380, w * 0.42 + j(), 430 + j());
    ctx.lineTo(0, 490 + j());

  // 向こう岸の石
  for (let i = 0; i < 9; i++) {
    ctx.fillStyle = rgba('#2a2f3a', 0.35 + rnd() * 0.25);

}

// 渓流の山並み（水平線の上に重ねる）
function paintRidge(ctx, w, h) {
  const rnd = seeded(73);
  for (const [base, color, amp] of [[0.45, '#5e6a7e', 0.3], [0.65, '#3f4d5c', 0.25], [0.86, '#2b3a3e', 0.18]]) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 20) {
      const y = h * (base - amp * (0.5 + 0.5 * Math.sin(x * 0.006 + base * 9)) * (0.7 + 0.3 * rnd()));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
  }
}

// 人（立って、竿を持っている）
function paintAngler(ctx, noRod) {
  ctx.fillStyle = COLOR.shore;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();               // 足
  ctx.moveTo(214, 300);
  ctx.lineTo(224, 232);
  ctx.lineTo(250, 232);
  ctx.lineTo(262, 300);
  ctx.lineTo(244, 300);
  ctx.lineTo(237, 256);
  ctx.lineTo(232, 300);
  ctx.closePath();

  ctx.beginPath();               // 体
  ctx.moveTo(220, 240);
  ctx.quadraticCurveTo(218, 186, 234, 176);
  ctx.quadraticCurveTo(258, 176, 258, 196);
  ctx.lineTo(254, 240);

  ctx.fill();
  ctx.lineWidth = 12;            // 腕
  ctx.beginPath();
  ctx.moveTo(246, 188);
  ctx.lineTo(282, 212);
  ctx.stroke();
  ctx.beginPath();               // 頭
  ctx.arc(240, 158, 17, 0, TAU);

  ctx.moveTo(226, 148);

  ctx.lineWidth = 4;             // 竿

  ctx.moveTo(270, 232);
  ctx.quadraticCurveTo(350, 110, ROD_TIP.x, 70);

// 時間帯ごとの空と海の色の重ね方。朝まずめは元の絵のまま
const SKY_TINT = {

function paintFloat(ctx, w, h) {
