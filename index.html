<script>
'use strict';

/* ============================================================
   2. ゲームの設定
   ============================================================ */
const GAME_VERSION = 'v0.2';
const TAU = Math.PI * 2;

// 横幅は固定し、高さを端末の縦横比に合わせる（スマホで上下左右に余白を出さないため）
const W = 780;
const H = (() => {
  const aspect = window.innerWidth / window.innerHeight;
  if (!(aspect > 0) || aspect >= 1) return 1560;  // PCや横向きは決まった縦長で表示する
  return Math.round(W / Math.min(0.62, Math.max(0.45, aspect)));
})();

const HORIZON = Math.round(H * 0.6);      // 水平線の高さ
const SEA_H = H - HORIZON;
const SUN_X = Math.round(W * 0.63);

const FONT_TITLE = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif';
const FONT_BODY = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif';

const COLOR = {
  cream: '#fff6e6',
  ink: '#27406a',
  shore: '#343757',
};

// 動きを減らす設定の端末では、波やふわっと出る動きを控えめにする
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// やり取りの調整用の数字（ゲームの手応えを決めるもので、現実の魚のデータではない）
// calm：おとなしい時間（秒）／warn：合図の時間／surge：強く引く時間／reel：巻いて寄る速さ
// out：緩めたときに糸が出る速さ／extra：どこまで糸を出されるとにげられるか
const FIGHT_STYLES = {
  dart: {
    calm: [0.9, 1.9], warn: 0.38, surge: 0.38, reel: 0.12, out: 0.08, extra: 0.4, side: 0.3, dive: false,
    warnText: 'ピクッときた！', surgeText: '小きざみに引いてる！',
    escapeText: '遠くへにげられた…',
  },
  run: {
    calm: [1.4, 2.8], warn: 0.6, surge: 1.2, reel: 0.15, out: 0.09, extra: 0.6, side: 1, dive: false,
    warnText: '横に走るぞ！', surgeText: '走った！ はなして！',
    escapeText: '糸を出されすぎた…',
  },
  dive: {
    calm: [1.1, 2.2], warn: 0.5, surge: 0.9, reel: 0.09, out: 0.26, extra: 0.3, side: 0, dive: true, first: 0.5,
    warnText: '潜るぞ！', surgeText: 'こらえて！ はなすな！',
    escapeText: '岩のすきまに潜られた…',
  },
};
const TENSION_SLACK = 0.18;   // これより下は「ゆるい」
const TENSION_DANGER = 0.82;  // これより上は「切れそう」
const HOLD_STRAIN = 0.09;     // 押し続けた1秒ごとに、糸の張りの目標が上がる量
const METERS_PER_DIST = 40;   // 画面の距離1が何mに見えるか

function randBetween(a, b) { return a + Math.random() * (b - a); }

// 失敗したときの案内を、画面いっぱいに出す
function showNotice(title, lines, code) {
  const box = document.getElementById('notice');
  box.textContent = '';
  const h = document.createElement('h1');
  h.textContent = title;
  box.appendChild(h);
  for (const line of lines) {
    const p = document.createElement('p');
    p.textContent = line;
    box.appendChild(p);
  }
  if (code) {
    const p = document.createElement('p');
    const c = document.createElement('code');
    c.textContent = code;
    p.appendChild(c);
    box.appendChild(p);
  }
  const button = document.createElement('button');
  button.textContent = 'もう一度読み込む';
  button.addEventListener('click', () => location.reload());
  box.appendChild(button);
  box.style.display = 'block';
}

// エラーの文から「データの何行目か」を取り出す（ブラウザごとに書き方が違う）
function findErrorLine(text, message) {
  let match = /line (\d+) column/.exec(message);
  if (match) return Number(match[1]);
  match = /position (\d+)/.exec(message);
  if (match) return text.slice(0, Number(match[1])).split('\n').length;
  return null;
}

// 先頭の魚データを読む。書き間違いがあれば、場所を案内して null を返す
function loadFishData() {
  const text = document.getElementById('fish-data').textContent;
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    const line = findErrorLine(text, String(err.message));
    const code = line ? text.split('\n')[line - 1].trim() : null;
    showNotice(
      '魚データの書き方に間違いがあります',
      [line
        ? 'index.html の魚データで、次の行か、その1つ上の行を見てください。カンマや「"」の抜けがよくある原因です。'
        : 'index.html の魚データで、カンマや「"」の抜けがないか見てください。'],
      code
    );
    return null;
  }
  if (!data || !Array.isArray(data.fish) || typeof data.sources !== 'object' || data.sources === null) {
    showNotice('魚データの形が違います', ['魚データには「sources」と「fish」の欄が必要です。']);
    return null;
  }
  if (data.fish.length === 0) {
    showNotice('魚データが空です', ['魚データの「fish」に、魚を1種類以上入れてください。']);
    return null;
  }
  // ゲームに必要な数字がそろっているかを、魚ごとに確かめる
  for (const fish of data.fish) {
    const g = fish && fish.game;
    const ok = g && Array.isArray(g.sizeCm) && g.sizeCm.length === 2 && FIGHT_STYLES[g.fight]
      && Number.isFinite(g.power) && Number.isFinite(g.biteWindowMs) && Number.isFinite(g.weightA)
      && Array.isArray(g.nibbles) && g.nibbles.length === 2
      && Array.isArray(g.bestRange) && g.bestRange.length === 2;
    if (!ok) {
      showNotice(
        '魚データの「game」の欄に足りないものがあります',
        ['sizeCm、fight（dart / run / dive）、power、biteWindowMs、nibbles、bestRange、weightA を見てください。'],
        fish && fish.name ? String(fish.name) : null
      );
      return null;
    }
  }
  return data;
}

/* ============================================================
   3. 保存（使えない環境では、開いている間だけ覚えておく）
   ============================================================ */
const Save = (() => {
  const KEY = 'tsuri-game/save/v1';
  const DEFAULTS = { version: 1, plays: 0, sound: true };
  let state = { ...DEFAULTS };
  let available = false;

  try {
    const storage = window.localStorage;
    storage.setItem(KEY + '/test', '1');
    storage.removeItem(KEY + '/test');
    available = true;
    const raw = storage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') state = { ...DEFAULTS, ...parsed };
    }
  } catch (err) {
    // 保存が使えない、または中身が壊れている場合は、最初の状態で続ける
  }

  return {
    get data() { return state; },
    get available() { return available; },
    commit() {
      if (!available) return;
      try {
        window.localStorage.setItem(KEY, JSON.stringify(state));
      } catch (err) {
        available = false;  // 容量切れなど。以降は保存せずに続ける
      }
    },
  };
})();

/* ============================================================
   4. 音と振動、スマホを振る操作
   ============================================================ */

// 音はファイルを使わず、その場で作る
const Sound = (() => {
  let ctx = null;
  let master = null;
  let noiseBuffer = null;
  let sea = null;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = Save.data.sound ? 1 : 0;
      master.connect(ctx.destination);
      noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const samples = noiseBuffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    } catch (err) {
      ctx = null;  // 音が使えない環境では、音なしで続ける
    }
    return ctx;
  }

  // 高さを変えられる1音
  function tone(freq, dur, { type = 'sine', vol = 0.2, slideTo = null, delay = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // 水や風の「ザーッ」という音
  function noise(dur, { from = 1200, to = 300, vol = 0.2, type = 'lowpass', delay = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    src.buffer = noiseBuffer;
    filter.type = type;
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(master);
    src.start(t, Math.random());
    src.stop(t + dur + 0.02);
  }

  return {
    // 指で押した流れで呼ぶ（ブラウザは、押されるまで音を出させてくれない）
    unlock() {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
    },
    setEnabled(on) {
      Save.data.sound = on;
      Save.commit();
      if (master) master.gain.value = on ? 1 : 0;
    },
    startSea() {
      if (!ctx || sea) return;
      const src = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      src.buffer = noiseBuffer;
      src.loop = true;
      filter.type = 'lowpass';
      filter.frequency.value = 520;
      gain.gain.value = 0.05;
      lfo.frequency.value = 0.13;   // ゆっくり寄せては返す
      lfoGain.gain.value = 0.025;
      lfo.connect(lfoGain).connect(gain.gain);
      src.connect(filter).connect(gain).connect(master);
      src.start();
      lfo.start();
      sea = { src, lfo };
    },
    stopSea() {
      if (!sea) return;
      try { sea.src.stop(); sea.lfo.stop(); } catch (err) { /* すでに止まっている */ }
      sea = null;
    },
    cast()   { noise(0.42, { from: 2600, to: 500, vol: 0.14, type: 'bandpass' }); },
    splash() { noise(0.36, { from: 1800, to: 260, vol: 0.2 }); tone(240, 0.1, { slideTo: 90, vol: 0.12 }); },
    nibble() { tone(620, 0.07, { vol: 0.12, slideTo: 420 }); },
    bite()   { noise(0.3, { from: 1400, to: 200, vol: 0.28 }); tone(170, 0.24, { slideTo: 70, vol: 0.3 }); },
    hook()   { tone(330, 0.09, { type: 'triangle', vol: 0.2 }); tone(495, 0.14, { type: 'triangle', vol: 0.2, delay: 0.07 }); },
    warn()   { tone(880, 0.08, { type: 'triangle', vol: 0.16 }); tone(880, 0.08, { type: 'triangle', vol: 0.16, delay: 0.12 }); },
    surge()  { noise(0.3, { from: 900, to: 220, vol: 0.2 }); tone(130, 0.3, { type: 'sawtooth', vol: 0.08, slideTo: 90 }); },
    tick(t)  { tone(300 + t * 420, 0.025, { type: 'square', vol: 0.03 }); },
    snap()   { noise(0.12, { from: 5000, to: 1500, vol: 0.3, type: 'highpass' }); tone(1200, 0.12, { slideTo: 200, vol: 0.16 }); },
    miss()   { tone(300, 0.26, { type: 'triangle', slideTo: 170, vol: 0.14 }); },
    caught() {
      noise(0.42, { from: 2200, to: 300, vol: 0.2 });
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.34, { type: 'triangle', vol: 0.2, delay: 0.12 + i * 0.11 }));
    },
  };
})();

// 振動。Androidは本物の振動、iPhoneのSafariには振動の機能がないので小さな手応えだけ試す
const Buzz = (() => {
  const canVibrate = typeof navigator.vibrate === 'function';
  let iosSwitch = null;

  function tapIos() {
    if (!iosSwitch) {
      iosSwitch = document.createElement('label');
      iosSwitch.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      iosSwitch.appendChild(input);
      document.body.appendChild(iosSwitch);
    }
    iosSwitch.click();
  }

  return {
    pulse(pattern) {
      if (!canVibrate) return;
      try { navigator.vibrate(pattern); } catch (err) { /* 振動できなくても続ける */ }
    },
    // 指で押した瞬間だけ呼ぶ
    tap() {
      if (canVibrate) this.pulse(10);
      else if (navigator.maxTouchPoints > 0) tapIos();
    },
  };
})();

// スマホを振った動きを見つける
const Motion = (() => {
  const THRESHOLD = 15;      // これより強く動いたら「振った」とする（m/s²）
  const PEAK_WINDOW = 160;   // いちばん強いところを探す時間（ミリ秒）
  const COOLDOWN = 500;      // 1回振ったあと、次を受けつけない時間（ミリ秒）
  const supported = 'DeviceMotionEvent' in window && navigator.maxTouchPoints > 0;
  let listening = false;
  let callback = null;
  let peak = 0;
  let peakEnd = 0;
  let coolUntil = 0;

  function strengthOf(event) {
    const a = event.acceleration;
    if (a && a.x !== null && a.x !== undefined) return Math.hypot(a.x, a.y, a.z);
    const g = event.accelerationIncludingGravity;
    if (g && g.x !== null && g.x !== undefined) return Math.abs(Math.hypot(g.x, g.y, g.z) - 9.8);
    return 0;
  }

  function onMotion(event) {
    const now = performance.now();
    if (now < coolUntil) return;
    const m = strengthOf(event);
    if (peak === 0) {
      if (m >= THRESHOLD) { peak = m; peakEnd = now + PEAK_WINDOW; }
      return;
    }
    peak = Math.max(peak, m);
    if (now >= peakEnd) {
      const strength = Math.min(1, (peak - THRESHOLD) / 25);
      peak = 0;
      coolUntil = now + COOLDOWN;
      if (callback) callback(strength);
    }
  }

  return {
    supported,
    // iPhoneは、ボタンを押した流れの中で許可を求める必要がある
    async request() {
      try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          const answer = await DeviceMotionEvent.requestPermission();
          if (answer !== 'granted') return false;
        }
        if (!listening) {
          window.addEventListener('devicemotion', onMotion);
          listening = true;
        }
        return true;
      } catch (err) {
        return false;  // 許可されなくても、ボタンで遊べる
      }
    },
    onSwing(fn) { callback = fn; peak = 0; },
  };
})();

/* ============================================================
   5. 図形の絵（水彩風の絵は、最初に一度だけ描いてとっておく）
   ============================================================ */

// 同じ絵が毎回同じように描けるよう、種つきの乱数を使う
function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function bake(scene, key, width, height, draw) {
  if (scene.textures.exists(key)) return;
  const texture = scene.textures.createCanvas(key, width, height);
  draw(texture.getContext(), width, height);
  texture.refresh();
}

// ふちがぼけた、にじみの丸
function blob(ctx, x, y, rx, ry, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, rgba(color, alpha));
  g.addColorStop(0.7, rgba(color, alpha * 0.6));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// 少しずつ形を変えて薄く重ね塗りし、水彩のにじんだふちを作る
function wash(ctx, rnd, cx, cy, rx, ry, color, passes, alpha) {
  const count = 20;
  const base = Array.from({ length: count }, () => 1 + (rnd() - 0.5) * 0.36);
  ctx.fillStyle = rgba(color, alpha);
  for (let p = 0; p < passes; p++) {
    const pts = base.map((r, k) => {
      const a = (k / count) * TAU;
      const j = r * (1 + (rnd() - 0.5) * 0.26);
      return [cx + Math.cos(a) * rx * j, cy + Math.sin(a) * ry * j];
    });
    ctx.beginPath();
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const start = mid(pts[count - 1], pts[0]);
    ctx.moveTo(start[0], start[1]);
    for (let k = 0; k < count; k++) {
      const m = mid(pts[k], pts[(k + 1) % count]);
      ctx.quadraticCurveTo(pts[k][0], pts[k][1], m[0], m[1]);
    }
    ctx.closePath();
    ctx.fill();
  }
}

// 朝焼けの空と、海の下地
function paintDawn(ctx, w, h) {
  const rnd = seeded(11);

  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#46548a');
  sky.addColorStop(0.3, '#6d74aa');
  sky.addColorStop(0.56, '#b794b6');
  sky.addColorStop(0.78, '#eea898');
  sky.addColorStop(0.93, '#f8cb94');
  sky.addColorStop(1, '#fde5b4');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, HORIZON);

  // 空のにじみ
  const tints = ['#8c86c0', '#f3b8a8', '#5f6ca6', '#f9d7ae'];
  for (let i = 0; i < 70; i++) {
    const y = rnd() * HORIZON;
    const tint = tints[Math.min(3, Math.floor((y / HORIZON) * 3 + rnd() * 1.4))];
    blob(ctx, rnd() * w, y, 120 + rnd() * 220, 50 + rnd() * 100, tint, 0.08);
  }

  // 太陽（水平線から半分だけ出ている）
  const sunY = HORIZON - 8;
  blob(ctx, SUN_X, sunY, 430, 300, '#ffd9a0', 0.55);
  blob(ctx, SUN_X, sunY, 200, 150, '#fff0c4', 0.7);
  ctx.fillStyle = '#fff4d2';
  ctx.beginPath();
  ctx.arc(SUN_X, sunY, 62, 0, TAU);
  ctx.fill();

  // 朝日に照らされた雲（下側ほど明るい）
  const clouds = [
    [0.18, 0.60, 300, 26, '#c98fae'],
    [0.86, 0.66, 260, 22, '#f2a596'],
    [0.40, 0.76, 340, 20, '#f6a78e'],
    [0.08, 0.84, 240, 16, '#f7b48f'],
    [0.82, 0.86, 280, 15, '#fbc690'],
    [0.50, 0.46, 240, 18, '#a58ab9'],
  ];
  for (const [fx, fy, rx, ry, color] of clouds) {
    const x = fx * w;
    const y = fy * HORIZON;
    wash(ctx, rnd, x, y, rx, ry, color, 16, 0.06);
    wash(ctx, rnd, x + rx * 0.28, y + ry * 0.5, rx * 0.56, ry * 0.5, '#ffe2c4', 12, 0.06);
  }

  // 遠くの山
  ctx.beginPath();
  ctx.moveTo(0, HORIZON + 2);
  for (let x = 0; x <= w * 0.5; x += 8) {
    const fade = 1 - x / (w * 0.5);
    const lift = (46 + 26 * Math.sin(x / 70) + 12 * Math.sin(x / 23)) * fade;
    ctx.lineTo(x, HORIZON - lift);
  }
  ctx.lineTo(w * 0.5, HORIZON + 2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(133,112,168,0.72)';
  ctx.fill();

  // 海の下地
  const sea = ctx.createLinearGradient(0, HORIZON, 0, h);
  sea.addColorStop(0, '#f2c3a5');
  sea.addColorStop(0.22, '#bda6bb');
  sea.addColorStop(0.55, '#6d84aa');
  sea.addColorStop(1, '#2d5478');
  ctx.fillStyle = sea;
  ctx.fillRect(0, HORIZON, w, SEA_H);

  // 海に映る朝日
  for (let i = 0; i < 26; i++) {
    const t = i / 26;
    const y = HORIZON + t * SEA_H * 0.55;
    blob(ctx, SUN_X + (rnd() - 0.5) * 40, y, 50 + t * 170, 16, '#ffdcae', 0.16 * (1 - t * 0.7));
  }
}

// 波1枚。横の長さは画面2つ分で、1画面ごとに同じ形がくり返す（つなぎ目が出ない）
function paintWave(ctx, w, h, seed, top, deep, amp) {
  const rnd = seeded(seed);
  const period = w / 2;
  const parts = [2, 3, 5, 8].map((n) => ({ n, phase: rnd() * TAU, size: 1 / n }));
  const crest = (x) => parts.reduce(
    (sum, p) => sum + Math.sin((p.n * TAU * x) / period + p.phase) * p.size * amp,
    amp + 16
  );
  const fill = ctx.createLinearGradient(0, 0, 0, h);
  fill.addColorStop(0, top);
  fill.addColorStop(0.5, deep);
  fill.addColorStop(1, rgba(deep, 0));

  ctx.globalAlpha = 0.2;
  ctx.fillStyle = fill;
  for (let pass = 0; pass < 7; pass++) {
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 10) {
      const bleed = pass * 2.2 + 3 * Math.sin(((3 + pass) * TAU * x) / period + pass);
      ctx.lineTo(x, crest(x) + bleed);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 堤防と、釣りをしている人
const SHORE_TOP = Math.round(H * 0.74) - 300;
const ROD_TIP = { x: 430, y: SHORE_TOP + 70 };

function paintShore(ctx, w, h, noRod) {
  const rnd = seeded(23);
  ctx.fillStyle = rgba(COLOR.shore, 0.2);
  for (let pass = 0; pass < 6; pass++) {
    const j = () => (rnd() - 0.5) * 5;
    ctx.beginPath();
    ctx.moveTo(0, 292 + j());
    ctx.lineTo(w * 0.42 + j(), 312 + j());
    ctx.lineTo(w * 0.44 + j(), 400 + j());
    ctx.lineTo(0, 480 + j());
    ctx.closePath();
    ctx.fill();
  }

  // 人（立って、竿を持っている）
  ctx.fillStyle = COLOR.shore;
  ctx.strokeStyle = COLOR.shore;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();               // 足
  ctx.moveTo(214, 300);
  ctx.lineTo(224, 232);
  ctx.lineTo(250, 232);
  ctx.lineTo(262, 300);
  ctx.lineTo(244, 300);
  ctx.lineTo(237, 256);
  ctx.lineTo(232, 300);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();               // 体
  ctx.moveTo(220, 240);
  ctx.quadraticCurveTo(218, 186, 234, 176);
  ctx.quadraticCurveTo(258, 176, 258, 196);
  ctx.lineTo(254, 240);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 12;            // 腕
  ctx.beginPath();
  ctx.moveTo(246, 188);
  ctx.lineTo(282, 212);
  ctx.stroke();
  ctx.beginPath();               // 頭
  ctx.arc(240, 158, 17, 0, TAU);
  ctx.fill();
  ctx.lineWidth = 7;             // 帽子のつば
  ctx.beginPath();
  ctx.moveTo(226, 148);
  ctx.lineTo(266, 148);
  ctx.stroke();
  if (noRod) return;             // 釣りの画面では、竿は動かすので別に描く
  ctx.lineWidth = 4;             // 竿
  ctx.beginPath();
  ctx.moveTo(270, 232);
  ctx.quadraticCurveTo(350, 110, ROD_TIP.x, 70);

}

function paintFloat(ctx, w, h) {
  ctx.fillStyle = '#d9564a';
  ctx.beginPath();
  ctx.arc(w / 2, 20, 11, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#fff6e6';

  ctx.arc(w / 2, 20, 11, 0, Math.PI);
  ctx.fill();
  ctx.strokeStyle = '#3b3f63';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(w / 2, 0);
  ctx.lineTo(w / 2, h);

}

function paintGull(ctx, w, h) {
  ctx.strokeStyle = '#3f4674';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(4, h * 0.65);
  ctx.quadraticCurveTo(w * 0.25, 2, w / 2, h * 0.75);
  ctx.quadraticCurveTo(w * 0.75, 2, w - 4, h * 0.65);
  ctx.stroke();
}

// 魚の絵の違い（体の太さ、色、ヒレの形）
const FISH_ART = {
  aji:    { top: 62, belly: 60, tail: 11, back: '#5d7d93', mid: '#b9c9cc', low: '#f3efe3', fin: '#a9b48e', tailFork: 54 },
  saba:   { top: 52, belly: 52, tail: 8,  back: '#2c6877', mid: '#9dbbbe', low: '#f6f2e7', fin: '#476f79', tailFork: 62 },
  kasago: { top: 78, belly: 62, tail: 18, back: '#7a382b', mid: '#b9553e', low: '#edc8a5', fin: '#a2452f', tailFork: 8 },
};

function fishBodyPath(ctx, h, a) {
  const cy = h / 2;
  ctx.beginPath();
  ctx.moveTo(34, cy + 6);
  ctx.bezierCurveTo(130, cy - a.top * 1.3, 300, cy - a.top * 1.25, 452, cy - a.tail);
  ctx.lineTo(452, cy + a.tail);
  ctx.bezierCurveTo(300, cy + a.belly * 1.25, 130, cy + a.belly * 1.3, 34, cy + 6);
  ctx.closePath();
}

// 横向きの魚（頭が左）。尾→ヒレ→体→模様→目の順に重ねる
function paintFish(ctx, w, h, id) {
  const a = FISH_ART[id] || FISH_ART.aji;
  const cy = h / 2;
  const rnd = seeded(id.length * 97);

  // 尾びれ
  ctx.fillStyle = a.fin;
  ctx.beginPath();
  ctx.moveTo(444, cy - a.tail);
  ctx.quadraticCurveTo(490, cy - 40, 534, cy - 76);
  ctx.quadraticCurveTo(534 - a.tailFork, cy, 534, cy + 76);
  ctx.quadraticCurveTo(490, cy + 40, 444, cy + a.tail);
  ctx.closePath();
  ctx.fill();

  // 背びれ・しりびれ
  ctx.fillStyle = a.fin;
  if (id === 'kasago') {
    // カサゴはトゲのある背びれ
    ctx.beginPath();
    ctx.moveTo(160, cy - a.top + 2);
    for (let i = 0; i <= 11; i++) {
      const x = 160 + i * 22;
      ctx.lineTo(x + 10, cy - a.top - 34 + i * 2.4);
      ctx.lineTo(x + 22, cy - a.top + 6 + i * 3);
    }
    ctx.lineTo(420, cy - 20);
    ctx.lineTo(160, cy - 30);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(190, cy - a.top + 4);
    ctx.lineTo(214, cy - a.top - 36);
    ctx.lineTo(262, cy - a.top + 2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(288, cy - a.top + 8);
    ctx.quadraticCurveTo(320, cy - a.top - 24, 400, cy - 22);
    ctx.lineTo(380, cy - 10);
    ctx.closePath();
    ctx.fill();
  }
  ctx.beginPath();
  ctx.moveTo(290, cy + a.belly - 6);
  ctx.quadraticCurveTo(330, cy + a.belly + 24, 400, cy + 22);
  ctx.lineTo(370, cy + 10);
  ctx.closePath();
  ctx.fill();

  // サバは尾の近くに小さいヒレが並ぶ
  if (id === 'saba') {
    for (let i = 0; i < 4; i++) {
      const x = 400 + i * 13;
      for (const dir of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x, cy + dir * 15);
        ctx.lineTo(x + 8, cy + dir * 30);
        ctx.lineTo(x + 11, cy + dir * 11);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // 体（背中が濃く、おなかが淡い）
  const body = ctx.createLinearGradient(0, cy - a.top, 0, cy + a.belly);
  body.addColorStop(0, a.back);
  body.addColorStop(0.46, a.mid);
  body.addColorStop(1, a.low);
  fishBodyPath(ctx, h, a);
  ctx.fillStyle = body;
  ctx.fill();

  // 模様は体の内側だけに描く
  ctx.save();
  fishBodyPath(ctx, h, a);
  ctx.clip();
  if (id === 'aji') {
    // 尾に向かうトゲトゲのうろこの列
    ctx.fillStyle = 'rgba(232,212,126,0.9)';
    for (let i = 0; i < 18; i++) {
      const x = 268 + i * 11;
      ctx.beginPath();
      ctx.moveTo(x, cy - 2);
      ctx.lineTo(x + 7, cy - 8);
      ctx.lineTo(x + 12, cy - 2);
      ctx.lineTo(x + 7, cy + 5);
      ctx.closePath();
      ctx.fill();
    }
    blob(ctx, 170, cy - 22, 15, 11, '#2d3a48', 0.85);
  } else if (id === 'saba') {
    // 背中の波のような模様
    ctx.strokeStyle = 'rgba(24,52,66,0.8)';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 17; i++) {
      const x = 120 + i * 20;
      ctx.beginPath();
      ctx.moveTo(x, cy - 72);
      ctx.quadraticCurveTo(x + 18, cy - 44, x - 4, cy - 28 + (i % 3) * 5);
      ctx.stroke();
    }
  } else {
    // まだらの模様
    for (let i = 0; i < 26; i++) {
      blob(ctx, 90 + rnd() * 350, cy - 70 + rnd() * 105, 16 + rnd() * 26, 10 + rnd() * 18, '#54231c', 0.55);
    }
    for (let i = 0; i < 12; i++) {
      blob(ctx, 110 + rnd() * 310, cy - 20 + rnd() * 60, 8 + rnd() * 12, 6 + rnd() * 9, '#f1d3b6', 0.5);
    }
  }
  // 体のつやと水彩のにじみ
  blob(ctx, 220, cy - 14, 190, 16, '#ffffff', 0.32);
  for (let i = 0; i < 10; i++) {
    blob(ctx, 60 + rnd() * 400, cy - 60 + rnd() * 120, 40 + rnd() * 50, 20 + rnd() * 26, a.mid, 0.14);
  }
  ctx.restore();

  // エラ・胸びれ
  ctx.strokeStyle = 'rgba(30,40,60,0.45)';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(120, cy, a.top * 0.72, -0.9, 0.9);
  ctx.stroke();
  ctx.fillStyle = rgba(a.fin, 0.92);
  ctx.beginPath();
  ctx.moveTo(150, cy + 8);
  ctx.quadraticCurveTo(204, cy + 6, 222, cy + 36);
  ctx.quadraticCurveTo(178, cy + 42, 150, cy + 22);
  ctx.closePath();
  ctx.fill();

  // 目と口
  const eyeR = id === 'kasago' ? 20 : 16;
  ctx.fillStyle = '#fff6e6';
  ctx.beginPath();
  ctx.arc(84, cy - 16, eyeR, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#20263c';
  ctx.beginPath();
  ctx.arc(82, cy - 16, eyeR * 0.6, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(79, cy - 20, eyeR * 0.2, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(30,30,50,0.65)';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(38, cy + 7);
  ctx.quadraticCurveTo(62, cy + (id === 'kasago' ? 26 : 16), id === 'kasago' ? 92 : 78, cy + (id === 'kasago' ? 22 : 12));
  ctx.stroke();
}

function paintGlint(ctx, w, h) {
  blob(ctx, w / 2, h / 2, w / 2, h / 2, '#fff3d4', 1);
}

// 紙のざらつき
function paintGrain(ctx, w, h) {
  const rnd = seeded(5);
  const image = ctx.createImageData(w, h);
  for (let i = 0; i < image.data.length; i += 4) {
    const dark = rnd() < 0.5;
    image.data[i] = image.data[i + 1] = image.data[i + 2] = dark ? 40 : 255;
    image.data[i + 3] = Math.floor(rnd() * 22);
  }
  ctx.putImageData(image, 0, 0);
}

function paintButton(ctx, w, h) {
  const m = 14;
  const r = (h - m * 2) / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(26,40,80,0.35)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = COLOR.cream;
  ctx.beginPath();
  ctx.moveTo(m + r, m);
  ctx.lineTo(w - m - r, m);
  ctx.arc(w - m - r, h / 2, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(m + r, h - m);
  ctx.arc(m + r, h / 2, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 海と空の背景を作る。2つの画面で同じものを使う
const WAVE_LAYERS = [
  { key: 'wave1', from: 0.02, size: 0.36, top: '#f4cdb0', deep: '#c9abbb', amp: 7,  speed: 0.006,  bob: 3 },
  { key: 'wave2', from: 0.12, size: 0.42, top: '#c7a9c0', deep: '#94a0bf', amp: 11, speed: -0.009, bob: 5 },
  { key: 'wave3', from: 0.30, size: 0.48, top: '#90a3c2', deep: '#5f80a8', amp: 16, speed: 0.013,  bob: 8 },
  { key: 'wave4', from: 0.52, size: 0.48, top: '#6189ad', deep: '#3e6a92', amp: 22, speed: -0.018, bob: 11 },
  { key: 'wave5', from: 0.76, size: 0.34, top: '#47769c', deep: '#2b5277', amp: 28, speed: 0.026,  bob: 14 },
];

function createDawn(scene) {
  bake(scene, 'dawn', W, H, paintDawn);
  scene.add.image(0, 0, 'dawn').setOrigin(0).setDepth(0);

  const depths = [1, 2, 4, 7, 8];
  const waves = WAVE_LAYERS.map((layer, i) => {
    const height = Math.round(SEA_H * layer.size) + 60;
    bake(scene, layer.key, W * 2, height, (ctx, w, h) =>
      paintWave(ctx, w, h, 31 + i * 7, layer.top, layer.deep, layer.amp));
    const y = HORIZON + SEA_H * layer.from - layer.amp;
    const image = scene.add.image(0, y, layer.key).setOrigin(0).setDepth(depths[i]);
    return { image, y, layer, phase: i * 1.7 };
  });

  bake(scene, 'grain', 256, 256, paintGrain);
  scene.add.tileSprite(0, 0, W, H, 'grain').setOrigin(0).setDepth(50).setTileScale(2);

  const pace = REDUCE_MOTION ? 0.15 : 1;
  return {
    update(time) {
      for (const wave of waves) {
        const shift = ((time * wave.layer.speed * pace) % W + W) % W;
        wave.image.x = -shift;
        wave.image.y = wave.y + Math.sin(time * 0.0009 * pace + wave.phase) * wave.layer.bob;
      }
    },
  };
}

// 丸いボタン。押すと少し沈む
function createButton(scene, x, y, label, onPress, fontSize = 50) {
  bake(scene, 'button', 420, 136, paintButton);
  const box = scene.add.container(x, y).setDepth(40);
  box.add(scene.add.image(0, 0, 'button'));
  box.add(scene.add.text(0, -2, label, {
    fontFamily: FONT_BODY, fontSize: `${fontSize}px`, fontStyle: 'bold', color: COLOR.ink,
  }).setOrigin(0.5));
  box.setSize(420, 136);
  box.setInteractive({ useHandCursor: true });
  box.on('pointerdown', () => box.setScale(0.96));
  box.on('pointerout', () => box.setScale(1));
  box.on('pointerup', () => {
    box.setScale(1);
    Sound.unlock();
    onPress();
  });
  return box;
}

// 文字だけの小さいボタン（「港へ」「音」など）
function createTextButton(scene, x, y, label, onPress, originX = 0) {
  const text = scene.add.text(x, y, label, {
    fontFamily: FONT_BODY, fontSize: '30px', color: COLOR.cream, padding: { x: 14, y: 12 },
  }).setOrigin(originX, 0.5).setDepth(45).setShadow(0, 2, 'rgba(40,44,96,0.5)', 6);
  text.setInteractive({ useHandCursor: true });
  text.on('pointerup', () => {
    Sound.unlock();
    onPress(text);
  });
  return text;
}

function changeScene(scene, nextKey, data) {
  scene.cameras.main.fadeOut(REDUCE_MOTION ? 0 : 320, 60, 71, 112);
  scene.cameras.main.once('camerafadeoutcomplete', () => scene.scene.start(nextKey, data));
}

// 投げた距離（0〜1くらい）を、画面の海の上の場所に直す。遠いほど上で小さい
function waterPoint(d) {
  const t = Math.min(1.15, Math.max(0, d));
  return { x: 470 + t * 150, y: HORIZON + SEA_H * (0.55 - 0.45 * t), scale: 1.15 - 0.6 * t };
}

// 投げた距離に合う魚が来やすいように、くじを引く
function pickFish(d) {
  const list = window.fishData.fish;
  const weights = list.map((f) => (d >= f.game.bestRange[0] && d <= f.game.bestRange[1] ? 1 : 0.15));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
}

// Phaser が読み込めなかったときに止まらないよう、起動の中で画面を組み立てる
function makeScenes() {

class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }

  create() {
    this.leaving = false;
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 400, 60, 71, 112);
    this.dawn = createDawn(this);

    // 太陽のきらめき
    bake(this, 'glint', 44, 8, paintGlint);
    const rnd = seeded(47);
    this.glints = Array.from({ length: 36 }, () => {
      const t = rnd();
      const spread = (rnd() + rnd() - 1) * (30 + t * 150);
      const image = this.add.image(SUN_X + spread, HORIZON + 14 + t * SEA_H * 0.42, 'glint')
        .setDepth(3)
        .setScale(0.6 + t * 0.9, 1);
      return { image, speed: 0.0012 + rnd() * 0.002, phase: rnd() * TAU };
    });

    // 堤防と釣り人、ウキと糸
    bake(this, 'shore', W, 500, paintShore);
    this.add.image(0, SHORE_TOP, 'shore').setOrigin(0).setDepth(5);
    bake(this, 'float', 26, 56, paintFloat);
    this.float = this.add.image(Math.round(W * 0.76), HORIZON + SEA_H * 0.3, 'float').setDepth(6);
    this.floatY = this.float.y;
    this.line = this.add.graphics().setDepth(6);

    // カモメ
    bake(this, 'gull', 84, 34, paintGull);
    this.gulls = [
      { x: 180, y: H * 0.46, scale: 0.7, speed: 0.014, phase: 0 },
      { x: 300, y: H * 0.43, scale: 0.5, speed: 0.012, phase: 1.3 },
      { x: 660, y: H * 0.5, scale: 0.42, speed: 0.009, phase: 2.2 },
    ].map((gull) => ({ ...gull, image: this.add.image(gull.x, gull.y, 'gull').setDepth(9) }));

    this.addVerticalTitle();

    createButton(this, W / 2, Math.round(H * 0.875), 'はじめる', () => this.start());

    const plays = Save.data.plays;
    if (plays > 0) {
      this.add.text(W / 2, Math.round(H * 0.875) + 96, `これまでに ${plays}回、海へ行きました`, {
        fontFamily: FONT_BODY, fontSize: '26px', color: COLOR.cream,
      }).setOrigin(0.5).setDepth(40);
    }
    this.add.text(W - 22, H - 18, Save.available ? GAME_VERSION : `${GAME_VERSION} 保存オフ`, {
      fontFamily: FONT_BODY, fontSize: '20px', color: COLOR.cream,
    }).setOrigin(1, 1).setAlpha(0.65).setDepth(40);

    this.input.keyboard.once('keydown-ENTER', () => this.start());
  }

  // 題字を、右から左へ縦書きで並べる
  addVerticalTitle() {
    const size = 112;
    const pitch = 122;
    const columns = [
      { text: 'つって', x: W * 0.76, y: H * 0.075 },
      { text: 'さばいて', x: W * 0.5, y: H * 0.075 + 66 },
      { text: 'たべる', x: W * 0.24, y: H * 0.075 + 190 },
    ];
    let order = 0;
    for (const column of columns) {
      [...column.text].forEach((char, i) => {
        // 小さい「っ」は、縦書きでは右上に寄せる
        const small = 'っゃゅょぁぃぅぇぉ'.includes(char);
        const x = column.x + (small ? size * 0.14 : 0);
        const y = column.y + i * pitch - (small ? size * 0.14 : 0);
        const glyph = this.add.text(x, y, char, {
          fontFamily: FONT_TITLE, fontSize: `${size}px`, fontStyle: '600', color: COLOR.cream,
          padding: { x: 14, y: 14 },
        }).setOrigin(0.5).setDepth(30).setShadow(0, 3, 'rgba(40,44,96,0.45)', 12);
        if (!REDUCE_MOTION) {
          glyph.setAlpha(0);
          this.tweens.add({ targets: glyph, alpha: 1, duration: 620, delay: 220 + order * 90, ease: 'Sine.easeOut' });
        }
        order += 1;
      });
    }
  }

  start() {
    if (this.leaving) return;
    this.leaving = true;
    Save.data.plays += 1;
    Save.commit();
    changeScene(this, 'Harbor');
  }

  update(time) {
    this.dawn.update(time);
    const pace = REDUCE_MOTION ? 0.15 : 1;

    for (const glint of this.glints) {
      glint.image.setAlpha(0.2 + 0.7 * Math.abs(Math.sin(time * glint.speed * pace + glint.phase)));
    }

    this.float.y = this.floatY + Math.sin(time * 0.0016 * pace) * 6;
    this.line.clear();
    this.line.lineStyle(1.5, 0x3b3f63, 0.55);
    this.line.lineBetween(ROD_TIP.x, ROD_TIP.y, this.float.x, this.float.y - 26);

    for (const gull of this.gulls) {
      gull.x += gull.speed * this.game.loop.delta * pace;
      if (gull.x > W + 80) gull.x = -80;
      gull.image.x = gull.x;
      gull.image.setScale(gull.scale, gull.scale * (0.7 + 0.35 * Math.sin(time * 0.004 * pace + gull.phase)));
    }
  }
}

// 釣りの入口。遊び方の案内と、ボタンか「振る」かを選ぶ
class HarborScene extends Phaser.Scene {
  constructor() { super('Harbor'); }

  create() {
    this.leaving = false;
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 400, 60, 71, 112);
    this.dawn = createDawn(this);

    const heading = this.add.text(W / 2, H * 0.14, '堤防で釣ろう', {
      fontFamily: FONT_TITLE, fontSize: '72px', fontStyle: '600', color: COLOR.cream,
    }).setOrigin(0.5).setDepth(30).setShadow(0, 3, 'rgba(40,44,96,0.45)', 12);

    const howTo = [
      '① 押してためて、はなすと投げる',
      '② ウキがしずんだら、すぐ合わせる',
      '③ 押すと巻く、はなすと緩む',
      '　 押しっぱなしだと、糸が切れるよ',
      '',
      '投げる強さで、寄ってくる魚が変わるよ',
    ].join('\n');
    this.add.text(W / 2, heading.y + 84, howTo, {
      fontFamily: FONT_BODY, fontSize: '34px', color: COLOR.cream, lineSpacing: 16,
    }).setOrigin(0.5, 0).setDepth(30).setShadow(0, 2, 'rgba(40,44,96,0.55)', 8);

    const go = (motion) => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Fishing', { motion });
    };

    createButton(this, W / 2, Math.round(H * 0.68), 'ボタンで遊ぶ', () => go(false), 46);

    if (Motion.supported) {
      createButton(this, W / 2, Math.round(H * 0.68) + 132, 'スマホを振って遊ぶ', () => this.askMotion(go), 38);
      this.caution = this.add.text(W / 2, Math.round(H * 0.68) + 212,
        '振るときはスマホをしっかり持って、\nまわりに人や物がない場所で。強く振らなくてOK', {
          fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream, align: 'center', lineSpacing: 10,
        }).setOrigin(0.5, 0).setDepth(40).setShadow(0, 2, 'rgba(26,40,80,0.7)', 6);
    }

    createTextButton(this, 22, 56, '← タイトルへ', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Title');
    });
  }

  // iPhoneの許可は、ボタンを押した流れの中で聞く必要がある
  askMotion(go) {
    if (this.asking || this.leaving) return;
    this.asking = true;
    Motion.request().then((granted) => {
      this.asking = false;
      if (granted) {
        go(true);
      } else if (this.caution) {
        this.caution.setText('振る操作が使えませんでした。\n「ボタンで遊ぶ」で同じように楽しめます');
      }
    });
  }

  update(time) {
    this.dawn.update(time);
  }
}

// 堤防での釣り。投げる → アタリ → 合わせる → やり取り → 釣れた
class FishingScene extends Phaser.Scene {
  constructor() { super('Fishing'); }

  init(data) {
    this.useMotion = !!(data && data.motion);
  }

  create() {
    this.leaving = false;
    this.cameras.main.fadeIn(REDUCE_MOTION ? 0 : 400, 60, 71, 112);
    this.dawn = createDawn(this);
    this.motionPace = REDUCE_MOTION ? 0.15 : 1;

    bake(this, 'shoreNoRod', W, 500, (ctx, w, h) => paintShore(ctx, w, h, true));
    this.add.image(0, SHORE_TOP, 'shoreNoRod').setOrigin(0).setDepth(5);
    bake(this, 'float', 26, 56, paintFloat);
    for (const fish of window.fishData.fish) {
      bake(this, `fish-${fish.id}`, 560, 280, (ctx, w, h) => paintFish(ctx, w, h, fish.id));
    }

    this.world = this.add.graphics().setDepth(9);
    this.float = this.add.image(0, 0, 'float').setDepth(9);
    this.shadow = this.add.image(0, 0, `fish-${window.fishData.fish[0].id}`)
      .setDepth(9).setTint(0x1c3552).setAlpha(0).setScale(0.22);

    this.buildHud();
    this.buildAction();

    // 動きの状態
    this.pressed = false;
    this.rodBack = 0;
    this.bend = 0;
    this.dip = 0;
    this.dipTarget = 0;
    this.side = 0;
    this.sink = 0;
    this.jitter = 0;
    this.overlay = [];

    this.setupInput();
    Sound.startSea();
    this.enterReady();
  }

  /* ---------- 画面の部品 ---------- */

  buildHud() {
    const shadow = (t) => t.setDepth(31).setShadow(0, 2, 'rgba(26,40,80,0.6)', 6);
    this.hud = this.add.graphics().setDepth(30);
    this.message = this.add.text(W / 2, Math.max(330, H * 0.22), '', {
      fontFamily: FONT_BODY, fontSize: '46px', fontStyle: 'bold', color: COLOR.cream, align: 'center', padding: { x: 8, y: 8 },
    }).setOrigin(0.5).setDepth(31).setShadow(0, 3, 'rgba(26,40,80,0.65)', 10);
    this.tensionLabel = shadow(this.add.text(90, 132, '糸の張り', {
      fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream,
    }).setOrigin(0, 0.5));
    this.distLabel = shadow(this.add.text(W - 90, 132, '', {
      fontFamily: FONT_BODY, fontSize: '30px', fontStyle: 'bold', color: COLOR.cream,
    }).setOrigin(1, 0.5));
    this.status = shadow(this.add.text(W / 2, 228, '', {
      fontFamily: FONT_BODY, fontSize: '30px', fontStyle: 'bold', color: COLOR.cream,
    }).setOrigin(0.5));

    createTextButton(this, 22, 56, '← 港へ', () => {
      if (this.leaving) return;
      this.leaving = true;
      changeScene(this, 'Harbor');
    });
    const soundLabel = () => (Save.data.sound ? '音：あり' : '音：なし');
    createTextButton(this, W - 22, 56, soundLabel(), (t) => {
      Sound.setEnabled(!Save.data.sound);
      t.setText(soundLabel());
    }, 1);
  }

  // 下の大きいボタン。画面のどこを押しても同じ動きをする
  buildAction() {
    bake(this, 'button', 420, 136, paintButton);
    const y = Math.round(H * 0.875);
    this.actionY = y;
    this.actionBox = this.add.container(W / 2, y).setDepth(40);
    this.actionImage = this.add.image(0, 0, 'button');
    this.actionText = this.add.text(0, -2, '', {
      fontFamily: FONT_BODY, fontSize: '50px', fontStyle: 'bold', color: COLOR.ink,
    }).setOrigin(0.5);
    this.actionBox.add([this.actionImage, this.actionText]);
    this.hint = this.add.text(W / 2, y + 92, '', {
      fontFamily: FONT_BODY, fontSize: '28px', color: COLOR.cream, align: 'center',
    }).setOrigin(0.5).setDepth(40).setShadow(0, 2, 'rgba(26,40,80,0.7)', 6);
  }

  setAction(label, urgent = false) {
    this.actionText.setText(label);
    this.actionBox.setVisible(true);
    if (urgent) this.actionImage.setTint(0xffc65c);
    else this.actionImage.clearTint();
  }

  say(text) { this.message.setText(text); }

  setupInput() {
    this.input.on('pointerdown', (pointer, over) => {
      if (over.length > 0) return;   // 「港へ」などの上で押したときは、釣りの操作にしない
      this.onPress();
    });
    const release = () => this.onRelease();
    this.input.on('pointerup', release);
    this.input.on('pointerupoutside', release);

    const space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    space.on('down', () => this.onPress());
    space.on('up', release);

    // 途中で別のアプリに切りかえたら、押しっぱなしのままにしない
    const onHidden = () => {
      this.pressed = false;
      if (this.state === 'charging') this.enterReady();
    };
    this.game.events.on('hidden', onHidden);
    this.game.events.on('blur', onHidden);

    if (this.useMotion) Motion.onSwing((s) => this.onSwing(s));

    this.events.once('shutdown', () => {
      this.game.events.off('hidden', onHidden);
      this.game.events.off('blur', onHidden);
      Motion.onSwing(null);
      Sound.stopSea();
    });
  }

  /* ---------- 操作 ---------- */

  onPress() {
    Sound.unlock();
    Sound.startSea();
    if (this.pressed) return;
    this.pressed = true;
    Buzz.tap();
    switch (this.state) {
      case 'ready':
        this.state = 'charging';
        this.chargeT = 0;
        this.charge = 0;
        this.setAction('はなすと飛ぶ');
        this.hint.setText('強いほど遠くへ飛ぶよ');
        break;
      case 'waiting':
      case 'nibble':
        this.earlyStrike();
        break;
      case 'bite':
        this.strike();
        break;
      default:
        break;
    }
  }

  onRelease() {
    if (!this.pressed) return;
    this.pressed = false;
    if (this.state === 'charging') this.cast(this.charge);
  }

  onSwing(strength) {
    if (this.state === 'ready') {
      this.cast(0.35 + 0.65 * strength);
    } else if (this.state === 'bite') {
      this.strike();
    } else if ((this.state === 'waiting' || this.state === 'nibble') && this.fishNear) {
      this.earlyStrike();
    }
  }

  /* ---------- 段取り ---------- */

  enterReady() {
    this.state = 'ready';
    this.castD = 0;
    this.fish = null;
    this.fishNear = false;
    this.dipTarget = 0;
    this.side = 0;
    this.sink = 0;
    this.float.setAlpha(1);
    this.shadow.setAlpha(0);
    this.say('');
    this.status.setText('');
    this.setFightHud(false);
    this.setAction('投げる');
    this.hint.setText(this.useMotion ? '押してためて、はなす（スマホを振ってもOK）' : '押してためて、はなす');
  }

  cast(power) {
    this.state = 'flying';
    const p = Math.max(0.08, power);
    this.castD = 0.22 + 0.78 * p;
    const tip = this.rodTip(this.time.now);
    this.fly = { t: 0, dur: 0.55 + 0.45 * p, x: tip.x, y: tip.y + 84 };
    this.flyKick = 0.16;
    this.hint.setText('');
    this.setAction('…');
    Sound.cast();
  }

  enterWaiting() {
    this.state = 'waiting';
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 3.2);
    Sound.splash();
    this.fish = pickFish(this.castD);
    this.shadow.setTexture(`fish-${this.fish.id}`);
    this.fishNear = false;
    this.nibblesLeft = Phaser.Math.Between(this.fish.game.nibbles[0], this.fish.game.nibbles[1]);
    this.waitT = randBetween(2.2, 5.2);
    this.say('');
    this.setAction('合わせる');
    this.hint.setText(this.useMotion ? 'ウキがしずんだら、押すか振る' : 'ウキがしずんだら押す');
  }

  startNibble() {
    this.state = 'nibble';
    this.nibbleT = 0.38;
    this.fishNear = true;
    this.dipTarget = 0.34;
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 1.8);
    Sound.nibble();
    Buzz.pulse(15);
    this.say('ピクッ…まだ待って');
  }

  startBite() {
    this.state = 'bite';
    const extra = this.useMotion ? 0.25 : 0;   // 振るのは押すより時間がかかるので少し長く待つ
    this.biteTotal = this.fish.game.biteWindowMs / 1000 + extra;
    this.biteT = this.biteTotal;
    this.dipTarget = 1;
    const p = waterPoint(this.castD);
    this.ripple(p.x, p.y, 4.2);
    Sound.bite();
    Buzz.pulse([60, 30, 90]);
    this.shake(120, 0.008);
    this.say('今だ！');
    this.setAction('合わせる！', true);
  }

  earlyStrike() {
    if (this.fishNear) {
      this.fail('早すぎて、にげられた…');
      return;
    }
    this.say('まだアタリがないよ');
    this.waitT += 0.3;
    this.time.delayedCall(800, () => {
      if (this.state === 'waiting' && this.message.text === 'まだアタリがないよ') this.say('');
    });
  }

  strike() {
    const quick = this.biteT / this.biteTotal > 0.6;
    const game = this.fish.game;
    const style = FIGHT_STYLES[game.fight];
    const r = Math.pow(Math.random(), 1.6);   // 小さめが多く、大物はたまに
    this.sizeRatio = r;
    this.sizeCm = game.sizeCm[0] + (game.sizeCm[1] - game.sizeCm[0]) * r;
    this.pullScale = 0.9 + 0.25 * r;

    this.state = 'fight';
    this.style = style;
    this.D = Math.max(0.18, this.castD - (quick ? 0.06 : 0));
    this.startD = this.D;
    this.T = 0.5;
    this.holdTime = 0;
    this.slack = 0;
    this.over = 0;
    this.phase = 'calm';
    this.phaseT = style.first || randBetween(style.calm[0], style.calm[1]);
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.tickT = 0;
    this.buzzT = 0;
    this.dipTarget = 0;

    Sound.hook();
    Buzz.pulse(70);
    this.shake(160, 0.01);
    this.say(quick ? 'いいタイミング！' : 'かかった！');
    this.setAction('押して巻く');
    this.hint.setText('押すと巻く・はなすと緩む');
    this.setFightHud(true);
  }

  fail(text, snapped = false) {
    this.state = 'failed';
    this.failT = 1.7;
    this.dipTarget = 0;
    this.say(text);
    this.status.setText('');
    this.hint.setText('');
    this.actionBox.setVisible(false);
    this.setFightHud(false);
    this.shadow.setAlpha(0);
    if (snapped) { Sound.snap(); Buzz.pulse(120); this.shake(180, 0.012); }
    else Sound.miss();
  }

  landFish() {
    this.state = 'caught';
    const game = this.fish.game;
    const weight = game.weightA * Math.pow(this.sizeCm, 3);
    const count = (this.registry.get('todayCount') || 0) + 1;
    this.registry.set('todayCount', count);

    this.setFightHud(false);
    this.say('');
    this.status.setText('');
    this.hint.setText('');
    this.actionBox.setVisible(false);
    this.float.setAlpha(0);
    this.shadow.setAlpha(0);
    Sound.caught();
    Buzz.pulse([40, 40, 40, 40, 160]);
    if (!REDUCE_MOTION) this.cameras.main.flash(260, 255, 246, 230);

    const items = [];
    const add = (obj) => { obj.setDepth(62); items.push(obj); return obj; };
    const dim = this.add.rectangle(0, 0, W, H, 0x24305a, 0.72).setOrigin(0).setDepth(60);
    items.push(dim);

    const cy = H * 0.42;
    add(this.add.text(W / 2, cy - 330, this.sizeRatio >= 0.72 ? '大物だ！' : '釣れた！', {
      fontFamily: FONT_TITLE, fontSize: '84px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
    }).setOrigin(0.5).setShadow(0, 3, 'rgba(20,28,60,0.6)', 12));

    const art = add(this.add.image(W / 2, cy - 60, `fish-${this.fish.id}`));
    const finalScale = 1.05 + this.sizeRatio * 0.2;
    if (REDUCE_MOTION) {
      art.setScale(finalScale);
    } else {
      art.setScale(0.15).setAngle(-24);
      this.tweens.add({ targets: art, scale: finalScale, angle: 0, duration: 520, ease: 'Back.easeOut' });
      this.tweens.add({ targets: art, y: art.y - 12, duration: 900, delay: 520, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      this.spray(W / 2, cy - 60);
    }

    add(this.add.text(W / 2, cy + 112, this.fish.name, {
      fontFamily: FONT_TITLE, fontSize: '92px', fontStyle: '600', color: COLOR.cream, padding: { x: 10, y: 10 },
    }).setOrigin(0.5));
    add(this.add.text(W / 2, cy + 214, `${this.sizeCm.toFixed(1)} cm　/　${Math.round(weight)} g`, {
      fontFamily: FONT_BODY, fontSize: '50px', fontStyle: 'bold', color: '#ffe0a6',
    }).setOrigin(0.5));
    add(this.add.text(W / 2, cy + 278, `今日の${count}ひき目`, {
      fontFamily: FONT_BODY, fontSize: '32px', color: COLOR.cream,
    }).setOrigin(0.5));

    const again = createButton(this, W / 2, Math.round(H * 0.875), 'もう一回投げる', () => {
      for (const item of this.overlay) item.destroy();
      this.overlay = [];
      this.enterReady();
    }, 44);
    again.setDepth(70);
    items.push(again);
    this.overlay = items;
  }

  /* ---------- 演出 ---------- */

  shake(ms, power) {
    if (!REDUCE_MOTION) this.cameras.main.shake(ms, power);
  }

  ripple(x, y, size) {
    const g = this.add.graphics({ x, y }).setDepth(9);
    g.lineStyle(3, 0xfff6e6, 0.85);
    g.strokeEllipse(0, 0, 52, 15);
    this.tweens.add({
      targets: g, scaleX: size, scaleY: size, alpha: 0, duration: 760, ease: 'Sine.easeOut',
      onComplete: () => g.destroy(),
    });
  }

  // 釣れた瞬間の水しぶき
  spray(x, y) {
    for (let i = 0; i < 22; i++) {
      const dot = this.add.circle(x, y, 4 + Math.random() * 9, 0xfff6e6, 0.9).setDepth(61);
      const a = Math.random() * TAU;
      const r = 180 + Math.random() * 240;
      this.tweens.add({
        targets: dot, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * 0.75 + 70, alpha: 0, scale: 0.3,
        duration: 620 + Math.random() * 300, ease: 'Cubic.easeOut', onComplete: () => dot.destroy(),
      });
    }
  }

  setFightHud(on) {
    this.fightHud = on;
    this.tensionLabel.setVisible(on);
    this.distLabel.setVisible(on);
    this.status.setVisible(on);
  }

  // 竿の先の場所。ためると後ろへ、魚がかかるとしなる
  rodTip(time) {
    const shakeWarn = this.state === 'fight' && this.phase === 'warn' ? Math.sin(time * 0.07) * 9 : 0;
    return {
      x: ROD_TIP.x - this.rodBack * 190 - this.bend * 12,
      y: ROD_TIP.y - this.rodBack * 60 + this.bend * 85 + shakeWarn,
    };
  }

  /* ---------- 毎フレームの処理 ---------- */

  update(time, delta) {
    this.dawn.update(time);
    const dt = Math.min(delta, 50) / 1000;

    switch (this.state) {
      case 'charging': this.updateCharging(dt); break;
      case 'flying':
        this.fly.t += dt / this.fly.dur;
        this.flyKick -= dt;
        if (this.fly.t >= 1) this.enterWaiting();
        break;
      case 'waiting':
        this.waitT -= dt;
        if (this.waitT <= 0) {
          if (this.nibblesLeft > 0) this.startNibble();
          else this.startBite();
        }
        break;
      case 'nibble':
        this.nibbleT -= dt;
        if (this.nibbleT <= 0) {
          this.nibblesLeft -= 1;
          this.dipTarget = 0;
          this.state = 'waiting';
          this.waitT = randBetween(0.7, 1.6);
          this.say('');
        }
        break;
      case 'bite':
        this.biteT -= dt;
        if (this.biteT <= 0) this.fail('エサだけ取られた…');
        break;
      case 'fight': this.updateFight(dt); break;
      case 'failed':
        this.failT -= dt;
        if (this.failT <= 0) this.enterReady();
        break;
      default: break;
    }

    this.drawWorld(time, dt);
    this.drawHud();
  }

  updateCharging(dt) {
    this.chargeT += dt;
    // 0→1→0 をくり返すので、いちばん強いところではなす楽しみがある
    const phase = (this.chargeT / 1.15) % 2;
    this.charge = phase <= 1 ? phase : 2 - phase;
  }

  updateFight(dt) {
    const style = this.style;
    const power = this.fish.game.power;

    // おとなしい → 合図 → 強く引く、をくり返す
    this.phaseT -= dt;
    if (this.phaseT <= 0) {
      if (this.phase === 'calm') {
        this.phase = 'warn';
        this.phaseT = style.warn;
        this.dir = Math.random() < 0.5 ? -1 : 1;
        this.say(style.warnText);
        Sound.warn();
        Buzz.pulse(30);
      } else if (this.phase === 'warn') {
        this.phase = 'surge';
        this.phaseT = style.surge;
        this.say(style.surgeText);
        Sound.surge();
        Buzz.pulse(Math.round(style.surge * 1000 * 0.5));
        this.shake(style.surge * 400, 0.005);
      } else {
        this.phase = 'calm';
        this.phaseT = randBetween(style.calm[0], style.calm[1]);
        this.say('');
      }
    }

    const surging = this.phase === 'surge';
    const pull = (surging ? 0.55 + power * 0.1 : 0.12 + power * 0.03) * this.pullScale;
    const holding = this.pressed;

    // 糸の張りは、目標の値へなめらかに近づく
    // 押しっぱなしだと張りがじわじわ上がるので、ときどき緩める必要がある
    this.holdTime = holding ? this.holdTime + dt : Math.max(0, this.holdTime - dt * 2.5);
    let target = holding ? 0.5 + pull * 0.6 + this.holdTime * HOLD_STRAIN : pull * 0.45;
    if (surging && style.dive) target = Math.min(target, 0.97);   // 潜るときは、こらえれば切れない
    this.T += (target - this.T) * (1 - Math.exp(-(holding ? 1.6 : 2.2) * dt));
    this.T = Math.min(1, Math.max(0, this.T));

    // 巻くと寄り、緩めると糸が出る
    if (holding) this.D -= style.reel * (surging ? 0.1 : 1) * dt;
    else this.D += style.out * (surging ? 1 : 0.12) * dt;

    // 走る・潜るの見た目
    const follow = 1 - Math.exp(-3.2 * dt);
    this.side += ((surging ? this.dir * style.side : 0) - this.side) * follow;
    this.sink += ((surging && style.dive ? 1 : 0) - this.sink) * follow;

    // リールの音と、引いているときの振動
    if (holding) {
      this.tickT -= dt;
      if (this.tickT <= 0) {
        this.tickT = 0.09 - this.T * 0.04;
        Sound.tick(this.T);
      }
    }
    this.buzzT -= dt;
    if (holding && surging && this.buzzT <= 0) {
      this.buzzT = 0.16;
      Buzz.pulse(60);
    }

    // 切れそう・ゆるいの声かけ
    if (surging && style.dive) this.status.setText('');   // 潜るときは「こらえて」の声かけを優先する
    else if (this.T >= TENSION_DANGER) this.status.setText('切れそう！ はなして！').setColor('#ffb3a0');
    else if (this.T <= TENSION_SLACK) this.status.setText('ゆるい！ 巻いて！').setColor('#bfe0ff');
    else this.status.setText('');

    // 勝ち負けの判定
    this.over = this.T >= 1 ? this.over + dt : 0;
    this.slack = this.T < TENSION_SLACK ? this.slack + dt : Math.max(0, this.slack - dt * 2);

    if (this.over >= 0.25) this.fail('糸が切れた…', true);
    else if (this.slack >= 1.3) this.fail('糸がゆるんで、バレた…');
    else if (this.D > this.startD + style.extra) this.fail(style.escapeText, true);
    else if (this.D <= 0) this.landFish();
  }

  drawWorld(time, dt) {
    // 竿のしなりと、投げるときの動き
    let rodTarget = 0;
    if (this.state === 'charging') rodTarget = 0.25 + this.charge * 0.75;
    else if (this.state === 'flying' && this.flyKick > 0) rodTarget = -0.22;
    this.rodBack += (rodTarget - this.rodBack) * (1 - Math.exp(-(this.state === 'charging' ? 16 : 22) * dt));
    const bendTarget = this.state === 'fight' ? this.T : (this.state === 'bite' ? 0.3 : 0);
    this.bend += (bendTarget - this.bend) * (1 - Math.exp(-9 * dt));
    this.dip += (this.dipTarget - this.dip) * (1 - Math.exp(-26 * dt));

    const tip = this.rodTip(time);
    const bob = Math.sin(time * 0.0016 * this.motionPace);

    // ウキの場所
    let fx;
    let fy;
    let scale = 1;
    let sag = 40;
    let taut = false;
    if (this.state === 'ready' || this.state === 'charging') {
      fx = tip.x + bob * 2;
      fy = tip.y + 84;
      scale = 0.8;
      sag = 0;
      taut = true;
    } else if (this.state === 'flying') {
      const t = Math.min(1, this.fly.t);
      const to = waterPoint(this.castD);
      fx = this.fly.x + (to.x - this.fly.x) * t;
      fy = this.fly.y + (to.y - this.fly.y) * t - Math.sin(t * Math.PI) * (200 + this.castD * 170);
      scale = 0.8 + (to.scale - 0.8) * t;
      sag = 20;
    } else if (this.state === 'fight') {
      const p = waterPoint(this.D);
      const wiggle = this.phase === 'surge' ? Math.sin(time * 0.05) * 6 : Math.sin(time * 0.012) * 3;
      fx = p.x + this.side * 130 + wiggle;
      fy = p.y + this.sink * 26 + bob * 3;
      scale = p.scale;
      sag = Math.pow(1 - this.T, 2) * 90;
      this.float.setAlpha(1 - this.sink * 0.65);
      // 岸に近づくと魚の影が見える
      if (this.D < 0.3) {
        this.shadow.setPosition(fx - 8, fy + 40).setAlpha(((0.3 - this.D) / 0.3) * 0.6);
        this.shadow.setFlipX(this.side > 0.1);
      }
    } else {
      const p = waterPoint(this.castD);
      fx = p.x;
      fy = p.y + bob * 6 + this.dip * 36 * p.scale;
      scale = p.scale;
      this.float.setAlpha(1 - this.dip * 0.55);
    }
    if (this.state === 'failed') this.float.setAlpha(Math.max(0, this.failT / 1.7));
    this.float.setPosition(fx, fy).setScale(scale);

    // 竿と糸
    const g = this.world;
    g.clear();
    if (this.state === 'caught') return;
    const baseX = 270;
    const baseY = SHORE_TOP + 232;
    g.lineStyle(4.5, 0x343757, 1);
    g.beginPath();
    g.moveTo(baseX, baseY);
    const ctrl = { x: 350 - this.rodBack * 110, y: SHORE_TOP + 110 - this.rodBack * 30 - this.bend * 10 };
    for (let i = 1; i <= 14; i++) {
      const t = i / 14;
      const u = 1 - t;
      g.lineTo(u * u * baseX + 2 * u * t * ctrl.x + t * t * tip.x, u * u * baseY + 2 * u * t * ctrl.y + t * t * tip.y);
    }
    g.strokePath();

    const warn = this.state === 'fight' && this.phase !== 'calm';
    g.lineStyle(warn ? 3 : 2, warn ? 0xffb04a : 0xfff6e6, warn ? 1 : 0.75);
    const endY = fy - 26 * scale;
    if (this.state !== 'failed' || this.failT > 1.2) {
      g.beginPath();
      g.moveTo(tip.x, tip.y);
      const midX = (tip.x + fx) / 2;
      const midY = (tip.y + endY) / 2 + (taut ? 0 : sag);
      for (let i = 1; i <= 18; i++) {
        const t = i / 18;
        const u = 1 - t;
        g.lineTo(u * u * tip.x + 2 * u * t * midX + t * t * fx, u * u * tip.y + 2 * u * t * midY + t * t * endY);
      }
      g.strokePath();
    }
  }

  drawHud() {
    const g = this.hud;
    g.clear();

    // 投げる強さのゲージ
    if (this.state === 'charging') {
      const bw = 460;
      const x = (W - bw) / 2;
      const y = this.actionY - 112;
      g.fillStyle(0x24305a, 0.6);
      g.fillRoundedRect(x - 8, y - 8, bw + 16, 42, 21);
      g.fillStyle(0xffc65c, 1);
      g.fillRoundedRect(x, y, Math.max(26, bw * this.charge), 26, 13);
    }

    if (!this.fightHud) return;

    const x = 90;
    const bw = W - 180;
    const y = 158;
    const bh = 34;
    g.fillStyle(0x24305a, 0.62);
    g.fillRoundedRect(x - 30, 104, bw + 60, 150, 20);
    // ゆるい／ちょうどいい／切れそう の3つの帯
    const a = bw * TENSION_SLACK;
    const b = bw * TENSION_DANGER;
    g.fillStyle(0x7fb2e0, 1);
    g.fillRect(x, y, a, bh);
    g.fillStyle(0x8fcf9b, 1);
    g.fillRect(x + a, y, b - a, bh);
    g.fillStyle(0xe2705c, 1);
    g.fillRect(x + b, y, bw - b, bh);
    // 今の張り
    const mx = x + bw * this.T;
    g.fillStyle(0xffffff, 1);
    g.fillRect(mx - 6, y - 9, 12, bh + 18);
    g.lineStyle(2, 0x27406a, 1);
    g.strokeRect(mx - 6, y - 9, 12, bh + 18);

    this.distLabel.setText(`岸まで ${Math.max(0, Math.ceil(this.D * METERS_PER_DIST))} m`);
  }
}

return [TitleScene, HarborScene, FishingScene];
}

/* ============================================================
   7. 起動
   ============================================================ */
(function boot() {
  if (!window.Phaser) {
    showNotice('ゲームを読み込めませんでした', ['通信のよい場所で、もう一度開いてください。']);
    return;
  }
  const fishData = loadFishData();
  if (!fishData) return;

  window.fishData = fishData;  // 段階2以降の画面から使う
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: W,
    height: H,
    backgroundColor: '#3c4770',
    banner: false,
    audio: { noAudio: true },   // 音は「4. 音と振動」で作るので、Phaserの音は使わない
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: makeScenes(),
  });
})();
</script>
